        document.getElementById("btnICloudSaveBar").addEventListener("click", () => saveAuftragToICloud(current.id));
      } else {
        bar.classList.remove("is-visible");
        bar.innerHTML = "";
      }
    }

    function renderApp() {
      renderHeader();
      renderToolbar();
      renderTabs();
      renderMain();
    }

    /* ---------- Toast ---------- */
    let toastTimer;
    function toast(msg, isError) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.toggle("error", !!isError);
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), isError ? 3200 : 2200);
    }

    /* ---------- List / save ---------- */
    function auftragListLabel(r) {
      const nr = (r.meta && r.meta.auftragsNr || "").trim() || "Ohne Nummer";
      const kunde = (r.meta && r.meta.kunde || "").trim() || "Ohne Kunde";
      let date = "";
      if (r.meta && r.meta.terminVon) date = formatDe(r.meta.terminVon);
      else if (r.values && r.values.datum) date = formatDateDe(r.values.datum);
      else date = formatDe(r.updatedAt);
      return { nr, kunde, date };
    }

    function saveToList(silent) {
      const quiet = silent === true;
      if (view === "fotodetail") readPhotoDetailIntoModel();
      persistCurrent();
      const copy = JSON.parse(JSON.stringify(current));
      copy.updatedAt = nowIso();
      const idx = reports.findIndex((r) => r.id === copy.id);
      if (idx >= 0) reports[idx] = copy;
      else reports.unshift(copy);
      persistList();
      const btn = document.getElementById("btnSave") || document.getElementById("btnSavePhoto");
      if (btn) {
        btn.classList.remove("save-flash");
        void btn.offsetWidth;
        btn.classList.add("save-flash");
      }
      if (!quiet) toast("Auftrag gespeichert");
      renderReportList();
    }

    function auftragContentEquals(a, b) {
      const strip = (r) => JSON.stringify({
        meta: r && r.meta || {},
        values: r && r.values || {},
        mitarbeiter: r && r.mitarbeiter || {},
        photos: (r && r.photos || []).map((p) => p.id)
      });
      return strip(a) === strip(b);
    }
    function isPristineAuftrag(r) {
      if (!r) return true;
      if (r.photos && r.photos.length) return false;
      const fresh = freshAuftrag();
      return auftragContentEquals(r, fresh);
    }
    function syncCurrentIntoList() {
      if (view === "fotodetail") readPhotoDetailIntoModel();
      persistCurrent();
      const idx = reports.findIndex((r) => r.id === current.id);
      if (idx >= 0) {
        reports[idx] = JSON.parse(JSON.stringify(current));
        return;
      }
      if (!isPristineAuftrag(current)) {
        reports.unshift(JSON.parse(JSON.stringify(current)));
      }
    }
    function sortReportsNewestFirst() {
      reports.sort((a, b) => {
        const ca = Date.parse(a.createdAt || a.updatedAt || 0) || 0;
        const cb = Date.parse(b.createdAt || b.updatedAt || 0) || 0;
        if (cb !== ca) return cb - ca;
        const ua = Date.parse(a.updatedAt || 0) || 0;
        const ub = Date.parse(b.updatedAt || 0) || 0;
        if (ub !== ua) return ub - ua;
        return String(b.id || "").localeCompare(String(a.id || ""));
      });
    }
    function newAuftrag() {
      syncCurrentIntoList();
      current = freshAuftrag();
      photoSortMode = "custom";
      reports.unshift(JSON.parse(JSON.stringify(current)));
      sortReportsNewestFirst();
      persistCurrent();
      persistList();
      showView("overview");
      toast("Neuer Auftrag angelegt");
      renderReportList();
    }

    function openAuftrag(id) {
      const found = reports.find((r) => r.id === id);
      if (!found) return;
      found.neu = false;
      current = migrateAuftrag(JSON.parse(JSON.stringify(found)));
      persistList();
      photoSortMode = current.photoSortMode === "date" ? "date" : "custom";
      ensurePhotoOrder();
      persistCurrent();
      showView("overview");
      closeDrawer();
      toast("Auftrag geöffnet");
    }

    async function deleteAuftrag(id, ev) {
      if (ev) ev.stopPropagation();
      if (!confirm("Diesen Auftrag wirklich löschen?")) return;
      reports = reports.filter((r) => r.id !== id);
      persistList();
      try { await idbDeleteAuftragPhotos(id); } catch (e) {}
      if (current.id === id) {
        current = freshAuftrag();
        persistCurrent();
        showView("overview");
      }
      renderReportList();
      toast("Auftrag gelöscht");
    }

    /* ================= Aufträge-Liste (wie EasyTec) + Sync-Schicht (Version 22) =================
       Einstellungen: localStorage "leckortung.settings" = { "serverUrl": "https://server.example" } (leer = nicht eingerichtet).

       Server-API (erwartetes JSON):
       GET  {serverUrl}/auftraege
            -> { "auftraege": [ Auftrag, ... ] }   (oder direkt ein Array)
            Auftrag = {
              "nr": "WA260489-001",              // Pflicht, eindeutiger Schlüssel (alternativ "auftragsNr")
              "kunde": "Max Mustermann", "anrede": "Herr",
              "strasse": "Hambacher Straße 25", "plz": "67433", "ort": "Neustadt an der Weinstraße",
              "auftragsart": "Leckageortung, (L)",  // optional
              "projekt": "WS WEG Am Schlossberg 10, Maikammer",  // optional
              "start": "2026-11-18T08:00", "ende": "2026-11-18T11:00"   // optional, ISO lokal
            }
            Bereits vorhandene Nummern werden nicht überschrieben; neue erscheinen mit "NEW"-Badge.
       POST {serverUrl}/auftraege/{nr}   Content-Type: application/json
            Body = { "format": "leckortung-auftrag", "formatVersion": 1, "appVersion": 22, "auftragsNr", "status": "abgeschlossen",
                     "abgeschlossenAm": ISO, "meta": {...}, "values": {...}, "mitarbeiter": {...},
                     "photos": [ { order, id, name, comment, druck, annotated, annotationsRelative: [...] } ] }
            Fotos nur als Metadaten (ohne Bilddaten). Unterschriften sind NIE enthalten (sie existieren nur im Arbeitsspeicher
            und landen ausschließlich in den lokal erzeugten PDFs). Antwort 2xx = angenommen.
    */
    const STORAGE_SETTINGS = "leckortung.settings";
    function loadSettings() {
      try { return Object.assign({ serverUrl: "" }, JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || "{}")); }
      catch (e) { return { serverUrl: "" }; }
    }
    function saveSettings(s) { try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s)); } catch (e) {} }
    function serverBase() {
      const u = String(loadSettings().serverUrl || "").trim().replace(/\/+$/, "");
      return /^https?:\/\//i.test(u) ? u : "";
    }

    const SYNC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6c0 1-.25 1.97-.7 2.8l1.46 1.46A8 8 0 0 0 20 12a8 8 0 0 0-8-8zm0 14a6 6 0 0 1-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A8 8 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4v3z"/></svg>';
    const FLAG_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="3" width="2" height="18"/><path d="M5.4 4h3.5v3.5H5.4zM12 4h3.5v3.5H12zM8.9 7.5h3.1V11H8.9zM15.5 7.5H19V11h-3.5zM5.4 11h3.5v3.5H5.4zM12 11h3.5v3.5H12z"/><rect x="5.4" y="4" width="13.6" height="10.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
    const SIGN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(0,-2.2) scale(.95)" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/><rect x="3" y="20.2" width="18" height="1.8" rx=".9"/></svg>';

    /* ---------- Listen-Ansicht ---------- */
    const aufState = { kat: "alle", q: "", name: false, nr: false, adresse: false, alle: true, asc: true };
    function aufStart(r) {
      return (r.meta && r.meta.terminVon) || (r.values && (r.values.messterminVon || r.values.datum)) || r.createdAt || r.updatedAt || "";
    }
    function aufAdresse(r) {
      const m = r.meta || {};
      return [m.strasse, [m.plz, m.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    }
    function aufProjekt(r) {
      const m = r.meta || {}, v = r.values || {};
      return String(m.projekt || "").trim() || [v.versicherungsgesellschaft, v.schadenNr].filter((x) => String(x || "").trim()).join(", ");
    }
    function aufArt(r) { return String((r.meta && r.meta.auftragsart) || "").trim(); }
    function aufMatches(r) {
      const m = r.meta || {};
      if (aufState.kat === "neu" && !r.neu) return false;
      if (aufState.kat === "offen" && r.status === "abgeschlossen") return false;
      if (aufState.kat === "abgeschlossen" && r.status !== "abgeschlossen") return false;
      if (aufState.kat === "wartet" && r.sync !== "wartet") return false;
      if (aufState.kat.indexOf("art:") === 0 && aufArt(r) !== aufState.kat.slice(4)) return false;
      const q = aufState.q.trim().toLowerCase();
      if (!q) return true;
      const parts = [];
      if (aufState.alle || aufState.name) parts.push(m.kunde);
      if (aufState.alle || aufState.nr) parts.push(m.auftragsNr);
      if (aufState.alle || aufState.adresse) parts.push(aufAdresse(r));
      if (aufState.alle) parts.push(aufArt(r), aufProjekt(r), m.anrede, (r.values || {}).schadenNr);
      return parts.join(" \n ").toLowerCase().indexOf(q) >= 0;
    }
    function aufStatusChips(r) {
      let h = "";
      if (r.status === "abgeschlossen") {
        h += r.sync === "wartet"
          ? '<span class="auf-chip warn" title="Abgeschlossen, wartet auf Sync">⟳ Wartet auf Sync</span>'
          : '<span class="auf-chip ok">✓ Abgeschlossen' + (r.sync === "gesendet" ? " · gesendet" : "") + "</span>";
      }
      return h;
    }
    function renderAufFilter() {
      const sel = document.getElementById("aufKat");
      if (!sel) return;
      const arts = Array.from(new Set(reports.map(aufArt).filter(Boolean))).sort();
      const opts = [["alle", "Alle Kategorien"], ["neu", "Neu"], ["offen", "Offen"], ["abgeschlossen", "Abgeschlossen"], ["wartet", "Wartet auf Sync"]]
        .concat(arts.map((a) => ["art:" + a, a]));
      if (!opts.some((o) => o[0] === aufState.kat)) aufState.kat = "alle";
      sel.innerHTML = opts.map((o) => `<option value="${attr(o[0])}"${o[0] === aufState.kat ? " selected" : ""}>${escapeHtml(o[1])}</option>`).join("");
      document.getElementById("aufSuche").value = aufState.q;
      ["name", "nr", "adresse", "alle"].forEach((k) => { document.getElementById("auf-" + k).checked = !!aufState[k]; });
    }
    function bindAufFilter() {
      document.getElementById("aufKat").addEventListener("change", (e) => { aufState.kat = e.target.value; renderReportList(); });
      document.getElementById("aufSuche").addEventListener("input", (e) => { aufState.q = e.target.value; renderReportList(); });
      ["name", "nr", "adresse", "alle"].forEach((k) => document.getElementById("auf-" + k).addEventListener("change", (e) => {
        aufState[k] = e.target.checked;
        if (k === "alle" && e.target.checked) { aufState.name = aufState.nr = aufState.adresse = false; }
        else if (e.target.checked) aufState.alle = false;
        if (!aufState.name && !aufState.nr && !aufState.adresse) aufState.alle = true;
        renderAufFilter();
        renderReportList();
      }));
      document.getElementById("aufCount").addEventListener("click", () => { aufState.asc = !aufState.asc; renderReportList(); });
    }
    function renderReportList() {
      const box = document.getElementById("reportList");
      const version = '<div class="app-version">Version ' + APP_VERSION + '</div>';
      renderAufFilter();
      const all = reports.slice();
      const list = all.filter(aufMatches);
      list.sort((a, b) => {
        const da = Date.parse(aufStart(a)) || 0, db = Date.parse(aufStart(b)) || 0;
        const d = aufState.asc ? da - db : db - da;
        return d || String((a.meta || {}).auftragsNr || "").localeCompare(String((b.meta || {}).auftragsNr || ""));
      });
      const n = list.length;
      document.getElementById("aufCount").textContent = (n === 1 ? "1 Eintrag gefunden" : n + " Einträge gefunden")
        + ", Sortiert nach Startdatum (" + (aufState.asc ? "A-Z" : "Z-A") + ")";
      if (!all.length) {
        box.innerHTML = '<div class="empty-list">Noch keine Aufträge. Tippen Sie auf „Neuer Auftrag“ oder holen Sie Aufträge über das Sync-Symbol oben rechts.</div>' + version;
        return;
      }
      if (!n) {
        box.innerHTML = '<div class="empty-list">Keine Aufträge für diese Suche.</div>' + version;
        return;
      }
      box.innerHTML = '<div class="auf-grid">' + list.map((r) => {
        const m = r.meta || {};
        const isCurrent = r.id === current.id;
        const nr = String(m.auftragsNr || "").trim() || "Ohne Nummer";
        const ortZeile = [m.plz, m.ort].filter(Boolean).join(" ");
        const start = fmtDateTimeDe(m.terminVon), ende = fmtDateTimeDe(m.terminBis);
        const zeit = (start || ende) ? ((start ? "Start: " + start : "") + (start && ende ? " · " : "") + (ende ? "Ende: " + ende : "")) : "";
        const lines = [
          ["auf-name", [m.anrede, m.kunde].filter((x) => String(x || "").trim()).join(" ") || "Ohne Kunde"],
          ["", ortZeile], ["", m.strasse], ["auf-art", aufArt(r)], ["auf-proj", aufProjekt(r)], ["auf-zeit", zeit]
        ].filter((l) => String(l[1] || "").trim());
        return `<div class="report-item auf-card${isCurrent ? " current" : ""}${r.status === "abgeschlossen" ? " done" : ""}" data-open="${r.id}"${isCurrent ? ' aria-current="true"' : ""}>
          <div class="meta">
            <div class="auf-nr"><strong>${escapeHtml(nr)}</strong>${r.neu ? '<span class="auf-new">NEW</span>' : ""}${aufStatusChips(r)}</div>
            ${lines.map((l) => `<div class="auf-line ${l[0]}">${escapeHtml(l[1])}</div>`).join("")}
          </div>
          <div class="report-actions">
            <button type="button" class="btn btn-icloud" data-icloud="${r.id}" title="In iCloud speichern">☁</button>
            <button class="btn danger" data-del="${r.id}" title="Auftrag löschen">Löschen</button>
          </div>
        </div>`;
      }).join("") + "</div>" + version;
    }

    /* ---------- Sync ---------- */
    let syncBusy = false;
    function setSyncSpin(on) {
      document.querySelectorAll("#btnSyncList, #btnSyncHdr").forEach((b) => b.classList.toggle("spin", !!on));
    }
    function auftragFromServer(s) {
      const nr = String(s.nr || s.auftragsNr || "").trim();
      if (!nr) return null;
      const meta = Object.assign(freshMeta(), {
        auftragsNr: nr, anrede: s.anrede || "", kunde: s.kunde || "", strasse: s.strasse || "", plz: s.plz || "", ort: s.ort || "",
        projekt: s.projekt || "", terminVon: s.start || s.terminVon || "", terminBis: s.ende || s.terminBis || ""
      });
      if (s.auftragsart) meta.auftragsart = s.auftragsart;
      return migrateAuftrag({ id: uid("r"), createdAt: nowIso(), updatedAt: nowIso(), meta, neu: true, serverNr: nr });
    }
    async function buildServerPayload(a) {
      const photos = [];
      const list = (a.photos || []).slice().sort((x, y) => (Number(x.sortiernummer) || 0) - (Number(y.sortiernummer) || 0));
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        let w = 0, h = 0;
        try { const rec = await idbGetPhoto(a.id, p.id); if (rec && rec.width) { w = rec.width; h = rec.height; } } catch (e) {}
        const anns = Array.isArray(p.annotations) ? p.annotations : [];
        photos.push({
          order: i + 1, id: p.id, name: p.name || "", comment: p.comment || "", druck: !!p.druck, annotated: !!p.annotated,
          annotationsRelative: (w && h) ? anns.map((s) => annotToRelative(s, w, h)) : []
        });
      }
      return {
        format: "leckortung-auftrag", formatVersion: 1, appVersion: APP_VERSION,
        auftragsNr: (a.meta && a.meta.auftragsNr) || a.serverNr || "",
        status: a.status === "abgeschlossen" ? "abgeschlossen" : "offen",
        abgeschlossenAm: a.abgeschlossenAm || null,
        meta: JSON.parse(JSON.stringify(a.meta || {})),
        values: JSON.parse(JSON.stringify(a.values || {})),
        mitarbeiter: JSON.parse(JSON.stringify(a.mitarbeiter || {})),
        photos
      };
    }
    async function postAuftrag(a) {
      const base = serverBase();
      const nr = (a.meta && a.meta.auftragsNr) || a.serverNr || a.id;
      const payload = await buildServerPayload(a);
      const res = await fetch(base + "/auftraege/" + encodeURIComponent(nr), {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    }
    function markSent(id) {
      const t = (current.id === id) ? current : null;
      const e = reports.find((r) => r.id === id);
      [t, e].forEach((x) => { if (x) { x.sync = "gesendet"; x.syncedAt = nowIso(); } });
      if (t) persistCurrent();
      persistList();
    }
    function showSyncHint() {
      showChoiceDialog("Server noch nicht eingerichtet",
        "Sobald der Firmenserver bereit ist, tragen Sie unter „Einstellungen“ die Adresse ein. Dann holt dieser Knopf neue Aufträge und schickt abgeschlossene Aufträge zurück. Bis dahin bleibt alles lokal gespeichert.",
        [{ label: "Einstellungen", value: "set" }, { label: "OK", value: "ok", primary: true }]
      ).then((v) => { if (v === "set") showSettingsDialog(); });
    }
    async function syncNow() {
      if (syncBusy) return;
      const base = serverBase();
      if (!base) { showSyncHint(); return; }
      syncBusy = true; setSyncSpin(true);
      let neu = 0, gesendet = 0, fehler = 0;
      try {
        syncCurrentIntoList();
        try {
          const res = await fetch(base + "/auftraege", { headers: { Accept: "application/json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const arr = Array.isArray(data) ? data : (data && Array.isArray(data.auftraege) ? data.auftraege : []);
          arr.forEach((s) => {
            const a = auftragFromServer(s || {});
            if (!a) return;
            const nr = a.meta.auftragsNr;
            if (reports.some((r) => ((r.meta || {}).auftragsNr || r.serverNr) === nr)) return;
            reports.push(JSON.parse(JSON.stringify(a)));
            neu++;
          });
          persistList();
        } catch (e) { console.warn("sync get", e); fehler++; }
        for (const r of reports.filter((x) => x.status === "abgeschlossen" && x.sync === "wartet")) {
          try { await postAuftrag(r); markSent(r.id); gesendet++; } catch (e) { console.warn("sync post", e); fehler++; }
        }
        renderReportList();
        if (view === "report") renderMain();
        toast(fehler && !neu && !gesendet ? "Server nicht erreichbar – später erneut versuchen"
          : (neu + (neu === 1 ? " neuer Auftrag" : " neue Aufträge") + ", " + gesendet + " gesendet" + (fehler ? " (" + fehler + " Fehler)" : "")), !!fehler && !neu && !gesendet);
      } finally {
        syncBusy = false; setSyncSpin(false);
      }
    }

    /* ---------- Auftrag abschließen (Zielflagge, nur in der Report-Ansicht) ---------- */
    async function abschliessenClick() {
      if (view === "fotodetail") readPhotoDetailIntoModel();
      persistCurrent();
      const done = current.status === "abgeschlossen";
      const choice = await showChoiceDialog(
        done ? "Auftrag bereits abgeschlossen" : "Auftrag abschließen?",
        done ? "Dieser Auftrag ist als abgeschlossen markiert. Erneut an den Server senden oder wieder öffnen?"
             : "Der Auftrag wird als abgeschlossen markiert und an den Firmenserver gesendet. Ohne eingerichteten Server wartet er lokal auf den nächsten Sync.",
        done
          ? [{ label: "Abbrechen", value: "cancel" }, { label: "Wieder öffnen", value: "open" }, { label: "Erneut senden", value: "go", primary: true }]
          : [{ label: "Abbrechen", value: "cancel" }, { label: "Abschließen", value: "go", primary: true }]
      );
      if (choice === "open") {
        current.status = "offen"; current.sync = null; current.abgeschlossenAm = null;
      } else if (choice === "go") {
        if (!done) { current.status = "abgeschlossen"; current.abgeschlossenAm = nowIso(); }
        current.sync = "wartet";
      } else return;
      current.updatedAt = nowIso();
      persistCurrent();
      syncCurrentIntoList(); persistList();
      if (choice === "go") {
        if (serverBase()) {
          try {
            toast("Auftrag wird gesendet…");
            await postAuftrag(current);
            markSent(current.id);
            toast("Auftrag abgeschlossen und gesendet");
          } catch (e) {
            console.warn(e);
            toast("Abgeschlossen – Server nicht erreichbar, wartet auf Sync", true);
          }
        } else toast("Abgeschlossen – wartet auf Sync (Server noch nicht eingerichtet)");
      } else toast("Auftrag wieder geöffnet");
      renderReportList();
      if (view === "report") renderMain();
    }

    /* ---------- Einstellungen ---------- */
    function showSettingsDialog() {
      const old = document.getElementById("settingsOverlay");
      if (old) old.remove();
      const o = document.createElement("div");
      o.className = "choice-overlay open";
      o.id = "settingsOverlay";
      o.innerHTML = `<div class="choice-dialog" role="dialog" aria-modal="true" aria-labelledby="setTitle">
        <h3 id="setTitle">Einstellungen</h3>
        <p>Server-Adresse für den Sync (leer = nicht eingerichtet). Beispiel: https://server.firma.de/api</p>
        <input type="url" id="setServer" class="sig-input" placeholder="https://…" value="${attr(loadSettings().serverUrl || "")}" autocomplete="off" />
        <div class="choice-actions" style="margin-top:14px"><button type="button" class="btn" id="setCancel">Abbrechen</button><button type="button" class="btn primary" id="setSave">Speichern</button></div>
      </div>`;
      document.body.appendChild(o);
      document.getElementById("setCancel").addEventListener("click", () => o.remove());
      document.getElementById("setSave").addEventListener("click", () => {
        const u = document.getElementById("setServer").value.trim();
        if (u && !/^https?:\/\//i.test(u)) { toast("Bitte mit http:// oder https:// beginnen", true); return; }
        saveSettings({ serverUrl: u });
        o.remove();
        toast(u ? "Server gespeichert" : "Server-Adresse entfernt");
      });
    }
    document.getElementById("btnSyncList").addEventListener("click", syncNow);
    document.getElementById("btnSettings").addEventListener("click", showSettingsDialog);
    bindAufFilter();


    document.getElementById("reportList").addEventListener("click", (e) => {
      const icloudBtn = e.target.closest("[data-icloud]");
      if (icloudBtn) {
        e.stopPropagation();
        return saveAuftragToICloud(icloudBtn.getAttribute("data-icloud"));
      }
      const del = e.target.closest("[data-del]");
      if (del) return deleteAuftrag(del.getAttribute("data-del"), e);
      const item = e.target.closest("[data-open]");
      if (item) openAuftrag(item.getAttribute("data-open"));
    });

    /* Drawer */
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");
    function openDrawer() {
      syncCurrentIntoList(); persistList();
      renderReportList();
      overlay.hidden = false;
      requestAnimationFrame(() => {
        overlay.classList.add("open");
        drawer.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
      });
    }
    function closeDrawer() {
      overlay.classList.remove("open");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");

    function annotToRelative(s, w, h) {
      if (!s || !w || !h) return s ? JSON.parse(JSON.stringify(s)) : s;
      const nx = (v) => (typeof v === "number" ? v / w : v);
      const ny = (v) => (typeof v === "number" ? v / h : v);
      const out = Object.assign({}, s);
      if ("x" in out) out.x = nx(out.x);
      if ("y" in out) out.y = ny(out.y);
      if ("w" in out) out.w = nx(out.w);
      if ("h" in out) out.h = ny(out.h);
      if ("x1" in out) out.x1 = nx(out.x1);
      if ("y1" in out) out.y1 = ny(out.y1);
      if ("x2" in out) out.x2 = nx(out.x2);
      if ("y2" in out) out.y2 = ny(out.y2);
      if (Array.isArray(out.points)) {
        out.points = out.points.map((pt) => ({ x: nx(pt.x), y: ny(pt.y) }));
      }
      return out;
    }

    async function photoDimensions(p) {
      const rec = await idbGetPhoto(current.id, p.id);
      if (rec && rec.width && rec.height) {
        return { width: rec.width, height: rec.height, mime: rec.mime || "" };
      }
      const blob = rec && rec.blob;
      if (!blob) return { width: 0, height: 0, mime: "" };
      try {
        const url = URL.createObjectURL(blob);
        const dims = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = reject;
          img.src = url;
        });
        URL.revokeObjectURL(url);
        return { width: dims.width, height: dims.height, mime: rec.mime || blob.type || "" };
      } catch (e) {
        return { width: 0, height: 0, mime: "" };
      }
    }

    /* ----- Text-Layout-Helfer (mm / pt) ----- */
    function wrapLines(str, widthMm, size, bold) {
      const out = [];
      String(str == null ? "" : str).replace(/\r\n?/g, "\n").split("\n").forEach((para) => {
        if (para === "") { out.push(""); return; }
        const words = para.split(" ");
        let line = "";
        const flush = () => { out.push(line); line = ""; };
        words.forEach((w) => {
          const cand = line === "" ? w : line + " " + w;
          if (textWidthMm(cand, size, bold) <= widthMm) { line = cand; return; }
          if (line !== "") flush();
          if (textWidthMm(w, size, bold) <= widthMm) { line = w; return; }
          let piece = "";
          for (const ch of w) {
            if (textWidthMm(piece + ch, size, bold) > widthMm && piece) { out.push(piece); piece = ""; }
            piece += ch;
          }
          line = piece;
        });
        flush();
      });
      return out;
    }
    function baselineMm(top, size, f) {
      const lhPt = size * f;
      return top - 0.25 + ((lhPt - size * 1.117) / 2 + size * 0.905) / MM;
    }
    function lhMm(size, f) { return size * f / MM; }
    function drawBox(doc, x, top, on) {
      const s = 8 / MM;
      doc.rect(x, top, s, s, { fill: "#ffffff", stroke: "#111111", lw: 0.6 });
      if (on) {
        const w = textWidthMm("X", 7, true);
        doc.text(x + (s - w) / 2, top + s / 2 + 0.358 * 7 / MM, "X", 7, true, "#111111");
      }
    }
    /* parts: string | {b:string} | {box:bool} | {sp:mm} */
    function drawInline(doc, x, top, parts, size, f) {
      let cx = x;
      const base = baselineMm(top, size, f);
      parts.forEach((p) => {
        if (typeof p === "string" || (p && p.b != null)) {
          const bold = typeof p !== "string";
          const t = bold ? p.b : p;
          doc.text(cx, base, t, size, bold, "#111111");
          cx += textWidthMm(t, size, bold);
        } else if (p && p.box !== undefined) {
          cx += 1 / MM;
          drawBox(doc, cx, base - 7.5 / MM, p.box);
          cx += 8.5 / MM + 1.5 / MM;
        } else if (p && p.sp) cx += p.sp;
      });
      return cx - x;
    }

    function fmtDateDe(v) {
      if (!v) return "";
      const s = String(v);

      if (!v) return "";

      if (m) return m[3] + "." + m[2] + "." + m[1] + " " + m[4] + ":" + m[5];
      return fmtDateDe(v);

      const end = (mb) => { pm = mb; };

      const lineH = (fs, f) => lhMm(fs, f || F);
      function textBlock(str, o) {
        const fs = o.fs || 9.5, f = o.f || F, bold = !!o.bold, x = o.x == null ? LEFT : o.x, w = o.w || CW;
        const lines = wrapLines(str, w, fs, bold);

      const FS = 7.5, FL = 1.3, LH = lhMm(FS, FL), BOX = 8 / MM;

      function row(draw, h) { begin(0); need(h || LH); draw(y); y += (h || LH); end(0.8); }
      function boxLabel(x, top, on, label, bold) {
        drawBox(doc, x, top + (LH - BOX) / 2, !!on);
        if (label) doc.text(x + BOX + 1.4, baselineMm(top, FS, FL), label, FS, !!bold, "#111111");
      }
      /* Kästchen-Gruppe: zwei Spalten, zweite Spalte bei colPct der Inhaltsbreite */
      function cbPairs(items, colPct) {
        for (let i = 0; i < items.length; i += 2) {
          row((top) => {
            boxLabel(LEFT, top, items[i].on, items[i].label);
            if (items[i + 1]) boxLabel(px(colPct), top, items[i + 1].on, items[i + 1].label);
          });
        }
      }
      /* Zeile "Label  [ ] Ja  [ ] Nein" mit festen Spalten; extra = Zusatz bei 57 % */
      function ynRow(label, on, extra) {
        row((top) => {
          doc.text(LEFT, baselineMm(top, FS, FL), label, FS, false, "#111111");
          boxLabel(px(0.36), top, on === true, "Ja");
          boxLabel(px(0.43), top, false, "Nein"); /* Nein wird nie automatisch angekreuzt */
          if (extra) {
            if (extra.box !== undefined) boxLabel(px(0.57), top, extra.box, extra.label);
            else doc.text(px(0.57), baselineMm(top, FS, FL), extra.text, FS, false, "#111111");
          }
        });
      }
      /* Zeile "Label:  Wert" – Wert bei 20 % */
      function kv(label, value) {
        begin(0);
        const lines = wrapLines(noQ(value), CW * 0.8, FS, false);
        const n = Math.max(1, lines.length);
        need(n * LH);
        doc.text(LEFT, baselineMm(y, FS, FL), label, FS, false, "#111111");
        lines.forEach((ln, i) => { if (ln) doc.text(px(0.2), baselineMm(y + i * LH, FS, FL), ln, FS, false, "#111111"); });
        y += n * LH; end(0.8);
      }

      /* Seite 1 */
      newPage();
      const berichtDatum = dateOnly(v.datum) || dateOnly(meta.terminVon) || dateOnly(todayDate());
      const messDatum = dateOnly(v.messterminVon) || dateOnly(v.datum) || berichtDatum;
      const objekt = [meta.kunde, meta.strasse, [meta.plz, meta.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      const empf = [meta.anrede, meta.kunde, meta.strasse, [meta.plz, meta.ort].filter(Boolean).join(" ")].filter(Boolean);
      begin(0);
      const sender = "Watersolution GmbH - Fritz-Karl-Henkel-Straße 14 - 67454 Haßloch";
      doc.text(LEFT, baselineMm(y, 8, F), sender, 8, false, "#111111");
      doc.line(LEFT, baselineMm(y, 8, F) + 0.9 / MM, LEFT + textWidthMm(sender, 8, false), baselineMm(y, 8, F) + 0.9 / MM, 0.5, "#111111");
      y += lhMm(8, F); end(4);
      begin(0);
      const colW2 = (CW - 8) / 2;
      let ly = y;
      empf.forEach((ln) => wrapLines(ln, colW2, 10, false).forEach((l) => { doc.text(LEFT, baselineMm(ly, 10, 1.4), l, 10, false, "#111111"); ly += lhMm(10, 1.4); }));
      let ry = y;
      const rx = LEFT + colW2 + 8;
      doc.text(rx, baselineMm(ry, 8.5, 1.35), "Bitte bei Rückfragen und Zuschriften stets angeben", 8.5, false, "#111111");
      ry += lhMm(8.5, 1.35) + 2;
      doc.text(rx, baselineMm(ry, 11, 1.35), noQ(meta.auftragsNr), 11, true, "#111111");
      ry += lhMm(11, 1.35) + 2;
      doc.text(rx, baselineMm(ry, 8.5, 1.35), "Datum: " + berichtDatum, 8.5, false, "#111111");
      ry += lhMm(8.5, 1.35) + 2.5;
      wrapLines("Watersolution GmbH, Fritz-Karl-Henkel-Straße 14, 67454 Haßloch, Telefon: 06324 - 980 37 98, info@service-watersolution.de, www.service-watersolution.de", colW2, 8, false)
        .forEach((l) => { doc.text(rx, baselineMm(ry, 8, 1.35), l, 8, false, "#111111"); ry += lhMm(8, 1.35); });
      y = Math.max(ly, ry, y + lhMm(10, 1.4)); end(5);
      begin(0);
      [["Objekt:", objekt], ["Vers.-Schein-Nr.:", v.versicherungsNr], ["Schaden-Nr.:", v.schadenNr]].forEach(([k, val]) => {
        const lines = wrapLines(noQ(val), 142, 9.5, false);
        const kl = wrapLines(k, 35, 9.5, true);
        const n = Math.max(lines.length, kl.length);
        need(n * lineH(9.5) + 1.2);
        kl.forEach((l, i) => doc.text(LEFT, baselineMm(y + 0.6 + i * lineH(9.5), 9.5, F), l, 9.5, true, "#111111"));
        lines.forEach((l, i) => doc.text(LEFT + 38, baselineMm(y + 0.6 + i * lineH(9.5), 9.5, F), l, 9.5, false, "#111111"));
        y += n * lineH(9.5) + 1.2;
      });
      end(4);
      begin(3);
      doc.text(LEFT, baselineMm(y, 15, F), "Schadenaufnahme", 15, true, "#111111");
      y += lhMm(15, F); end(3);
      begin(0);
      {
        const base = baselineMm(y, 9.5, F);
        let cx = LEFT;
        [["Messtermin am: ", messDatum], ["   Uhrzeit von: ", fmtTimeUhr(v.messterminVon)], ["   bis: ", fmtTimeUhr(v.messterminBis)]].forEach(([l, val]) => {
          doc.text(cx, base, l, 9.5, true, "#111111"); cx += textWidthMm(l, 9.5, true);
          doc.text(cx, base, val, 9.5, false, "#111111"); cx += textWidthMm(val, 9.5, false);
        });
        y += lineH(9.5); end(1.2);
      }
      [["Messtechniker: ", v.messtechniker], ["Mobil-Nr.: ", v.messtechnikerTel]].forEach(([l, val]) => {
        begin(0); need(lineH(9.5));
        const base = baselineMm(y, 9.5, F);
        doc.text(LEFT, base, l, 9.5, true, "#111111");
        doc.text(LEFT + textWidthMm(l, 9.5, true), base, noQ(val), 9.5, false, "#111111");
        y += lineH(9.5); end(1.2);
      });

      /* Allgemeine Informationen */
      hU("Allgemeine Informationen");
      hSub("Anwesende Personen");
      cbPairs([cb(v.anwesendVn, "Versicherungsnehmer"), cb(v.anwesendMieter, "Mieter"), cb(v.anwesendEigentuemer, "Eigentümer"), cb(v.anwesendInstallateur, "Installateur")], 0.45);
      row((top) => {
        boxLabel(LEFT, top, v.anwesendSonstige, "sonstige Person:");
        doc.text(LEFT + BOX + 1.4 + textWidthMm("sonstige Person:", FS, false) + 1.5, baselineMm(top, FS, FL),
          noQ(v.personVorOrt) + (v.personVorOrtTel ? "   Telefon-Nr.: " + v.personVorOrtTel : ""), FS, false, "#111111");
      });
      hSub("Allgemeine Informationen"); bodyText(v.allgemeineInformationen);
      hSub("Vorgefundenes Schadensbild"); bodyText(v.schadensbild);
      hSub("Kurzergebnis zur Schadensursache"); bodyText(v.schadensursache);
      hSub("Kurzbeschreibung der durchgeführten Arbeiten"); bodyText(v.durchgefuehrteArbeiten);
      begin(1.5);
      ynRow("Schadensstelle geöffnet", v.schadensstelleGeoeffnet, { text: "durch: " + noQ(v.geoeffnetDurch) });
      ynRow("Fliese(n) entnommen", v.fliesenEntnommen, { text: "Anzahl: " + noQ(v.fliesenAnzahl == null ? "" : v.fliesenAnzahl) });
      ynRow("Schadensursache gefunden", v.schadensursacheGefunden, { box: !!v.folgeterminNotwendig, label: "Folgetermin Notwendig" });

      /* Prüfungen */
      begin(0); need(82); /* Überschrift, Zeilen und Tabelle zusammenhalten */
      hSub("Prüfungen");
      ynRow("Druckprüfung durchgeführt", v.druckpruefungDurchgefuehrt);
      kv("Leitung:", v.leitung);
      kv("Ergebnis:", v.ergebnis);
      {
        const leitungen = [
          ["Kaltwasserleitung", v.kwGeprueft, v.kwDruckverlust],
          ["Warmwasserleitung", v.wwGeprueft, v.wwDruckverlust],
          ["Zirkulationsleitung", v.zirkGeprueft, v.zirkDruckverlust],
          ["Heizungsleitung", v.hzGeprueft, v.hzDruckverlust],
          ["Fußbodenheizung", v.fbhGeprueft, v.fbhDruckverlust],
          ["Außenleitung", v.aussenGeprueft, v.aussenDruckverlust],
          ["Abwasserleitung", v.awGeprueft, v.awUndicht],
          ["Grundleitung", v.grundGeprueft, v.grundUndicht],
          ["Regenleitung", v.regenGeprueft, v.regenUndicht],
          ["Flachdach angestaut", v.flachdachGeprueft, v.flachdachUndicht],
          ["sonstiges" + (v.sonstigesLeitung ? " (" + v.sonstigesLeitung + ")" : ""), filled(v.sonstigesLeitung) ? true : null, v.sonstigesUndicht]
        ];
        begin(1.5);
        const cw = 18, lw = CW - 72, rowH = 5, hh = 5;
        const tw = lw + 4 * cw;
        need(hh + 5 + rowH * leitungen.length);
        const x0 = LEFT, bd = "#333333";
        const cell = (x, yy, w, h, fill) => doc.rect(x, yy, w, h, { fill: fill || null, stroke: bd, lw: 0.4 });
        const ctext = (t, x, yy, w, h) => { const w2 = textWidthMm(t, FS, true); doc.text(x + (w - w2) / 2, baselineMm(yy + (h - LH) / 2, FS, FL), t, FS, true, "#111111"); };
        cell(x0, y, lw, hh + 5, "#f3f3f3");
        doc.text(x0 + 1.2, baselineMm(y + (hh + 5 - LH) / 2, FS, FL), "Leitung", FS, true, "#111111");
        cell(x0 + lw, y, 2 * cw, 5, "#f3f3f3"); ctext("geprüft", x0 + lw, y, 2 * cw, 5);
        cell(x0 + lw + 2 * cw, y, 2 * cw, 5, "#f3f3f3"); ctext("Druckverlust / Undicht", x0 + lw + 2 * cw, y, 2 * cw, 5);
        ["Ja", "Nein", "Ja", "Nein"].forEach((t, i) => { cell(x0 + lw + i * cw, y + 5, cw, hh, "#f3f3f3"); ctext(t, x0 + lw + i * cw, y + 5, cw, hh); });
        let yy = y + 5 + hh;
        leitungen.forEach(([label, gep, flag]) => {
          cell(x0, yy, lw, rowH);
          doc.text(x0 + 1.2, baselineMm(yy + (rowH - LH) / 2, FS, FL), label, FS, false, "#111111");
          [gep === true, false, flag === true, false].forEach((on, i) => {
            cell(x0 + lw + i * cw, yy, cw, rowH);
            drawBox(doc, x0 + lw + i * cw + (cw - BOX) / 2, yy + (rowH - BOX) / 2, on);
          });
          yy += rowH;
        });
        y = yy; end(1.5);
      }
      hSub("Methoden");
      {
        const tr = String(v.tracerKg || "").trim();
        cbPairs([
          cb(v.methodeFeuchte, "Feuchtigkeitsmessung"), cb(v.methodeAkustik, "Akustik"),
          cb(v.methodeLeitungsortung, "Leitungsortung"), cb(tr && tr !== "0,0" && tr !== "0", "Trace-/Prüfgas  " + (v.tracerKg || "0,0") + " kg"),
          cb(v.methodeThermografie, "Thermografie"), cb(v.methodeKanalkamera, "Kanalkamera"),
          cb(v.methodeVideoendoskopie, "Videoendoskopie"), cb(v.methodeFaerbemittel, "Färbemittel")
        ], 0.45);
        row((top) => boxLabel(LEFT, top, filled(v.methodeSonstiges), "sonstige Methode:" + (v.methodeSonstiges ? " " + v.methodeSonstiges : "")));
      }
      hSub("Wichtige Besonderheiten / Empfehlungen"); bodyText(v.besondereEmpfehlungen);
      hSub("Hinweispflicht zum Messergebnis"); bodyText(v.hinweispflicht);
      hSub("Messtechnik"); bodyText(v.messtechnik);

      hSub("Schadenregulierer/Sachverständiger Versicherung");
      ynRow("Halten wir für erforderlich", v.svErforderlich);
      ynRow("Wurde informiert", v.svInformiert);
      kv("Name:", v.svName);
      hSub("Leitungssystem - Versorgung");
      cbPairs([cb(v.vsHeizung, "Heizung"), cb(v.vsFbh, "Fußbodenheizung"), cb(v.vsWarmwasser, "Warmwasser"), cb(v.vsKaltwasser, "Kaltwasser"), cb(v.vsRegenwasser, "Regenwasser"), cb(filled(v.vsSonstiges), "sonstiges:" + (v.vsSonstiges ? " " + v.vsSonstiges : ""))], 0.45);
      cbPairs([cb(v.vsKupfer, "Kupfer"), cb(v.vsStahl, "Stahl"), cb(v.vsWicu, "WICU"), cb(v.vsMehrverbund, "Mehrverbundrohr"), cb(v.vsKunststoff, "Kunststoff"), cb(filled(v.vsMaterialSonstiges), "sonstiges:" + (v.vsMaterialSonstiges ? " " + v.vsMaterialSonstiges : ""))], 0.45);
      hSub("Leitungssystem - Entsorgung");
      cbPairs([cb(v.enSammelleitung, "Abwassersammelleitung"), cb(v.enStrang, "Abwasserstrang"), cb(v.enGrundleitung, "Abwassergrundleitung"), cb(v.enRegenwasser, "Regenwasserleitung"), cb(filled(v.enSonstiges), "sonstiges:" + (v.enSonstiges ? " " + v.enSonstiges : "")), cb(v.enAbflussKunststoff, "Abfluss/Kunststoff"), cb(v.enAbflussGuss, "Abfluss/Guss"), cb(filled(v.enMaterialSonstiges), "sonstiges:" + (v.enMaterialSonstiges ? " " + v.enMaterialSonstiges : ""))], 0.45);

      /* Weitere Empfehlungen / Gewerke / Schadenshöhe – direkt vor den Fotos */
      hSub("Weitere Empfehlungen/ weitere Maßnahmen");
      row((top) => {
        boxLabel(LEFT, top, v.maReparaturInstallateur, "Reparatur durch Installateur erforderlich");
        boxLabel(px(0.57), top, v.maSanierung, "Sanierung erforderlich");
      });
      kv("Schadensaufnahme:", v.maSchadensaufnahme);
      kv("Trocknung:", v.maTrocknung);
      kv("Sofortmaßnahme:", v.maSofortmassnahme);
      row((top) => boxLabel(LEFT, top, v.maDetailsTrocknungsangebot, "Details siehe Trocknungsangebot (folgt)"));
      y += LH * 0.6;
      row((top) => boxLabel(LEFT, top, filled(v.maSonstiges), "sonstiges:" + (v.maSonstiges ? " " + v.maSonstiges : "")));
      ynRow("Lochfrasswiederverschluss", v.alLochfrass);
      ynRow("Schwitzwasser/Kondenswasserbildung", v.alSchwitzwasser);
      ynRow("Armatur defekt/undicht", v.alArmatur);
      ynRow("Silikonfugen undicht", v.alSilikonfugen);
      ynRow("Fliesenfugen undicht", v.alFliesenfugen);
      ynRow("Muffenversatz", v.alMuffenversatz);
      kv("sonstiges:", v.alSonstiges);

      hSub("Erforderliche Gewerke");
      cbPairs([cb(v.gwMaurer, "Maurer"), cb(v.gwFliesenleger, "Fliesenleger"), cb(v.gwDachdecker, "Dachdecker"), cb(v.gwBodenleger, "Bodenleger"), cb(v.gwMalerTrockenbauer, "Maler / Trockenbauer"), cb(v.gwTrocknung, "Trocknung / Leckortung")], 0.38);
      row((top) => boxLabel(LEFT, top, filled(v.gwSonstiges), "sonstiges:" + (v.gwSonstiges ? " " + v.gwSonstiges : "")));

      hSub("Eingeschätzte Schadenshöhe");
      {
        const kosten = String(v.shKostenschaetzung || "");
        row((top) => boxLabel(LEFT, top, /über\s*2000/i.test(kosten), "über 2000,00 €"));
        row((top) => boxLabel(LEFT, top, /unter\s*2000/i.test(kosten), "unter 2000,00 €"));
        row((top) => boxLabel(LEFT, top, /nicht einzuschätzen/i.test(kosten), "nicht einzuschätzen"));
      }

      /* Fotoseiten: nur Fotos mit Druck-Haken, in der Reihenfolge der Fotoliste */
      let onPage = 0;
      photoImgs.forEach(({ p, img }) => {
        const textW = CW - 82 - 7;
        /* gesamter Kommentar einheitlich: normale Schrift, 7,5 pt, alle Zeilen gleich */
        const tLines = wrapLines(String(p.comment || p.name || "").replace(/^\n+|\n+$/g, ""), textW, FS, false);
        const textH = tLines.length * LH;
        let ih = 0, iw = 0;
        if (img) {
          iw = 80; ih = 80 * img.h / img.w;
          if (ih > 68) { ih = 68; iw = 68 * img.w / img.h; }
        }
        const rowH = Math.max(68, textH, ih);
        if (onPage === 0 || onPage >= 3 || y + rowH > BOTTOM) { newPage(); onPage = 0; y += pm; pm = 0; }
        let ty = y;
        tLines.forEach((ln) => { if (ln) doc.text(LEFT, baselineMm(ty, FS, FL), ln, FS, false, "#111111"); ty += LH; });
        if (img) doc.image(doc.addImage(img.bytes, img.w, img.h, img.comps), LEFT + 91 + 7 + (80 - iw) / 2, y, iw, ih);
        y += rowH + 5;
        onPage++;
      });
      return doc.build("Leckortungsbericht " + noQ(meta.auftragsNr));
    }

    /* ----- 2) Servicereport (Dokument 2) ----- */
    function serviceData() {
      const meta = current.meta || {};
      const v = current.values || {};
      const m = current.mitarbeiter || {};
      const ortZeile = [meta.plz, meta.ort].filter(Boolean).join(" ");
      const kundeAdr = [[meta.anrede, meta.kunde].filter(Boolean).join(" "), meta.strasse, ortZeile].filter(Boolean).join("\n");
      const today = fmtDateDe(todayDate());
      return {
        nr: noQ(meta.auftragsNr || v.schadenNr),
        kunde: kundeAdr,
        auftragnehmer: noQ(m.auftragnehmer),
        einsatzort: String(m.einsatzort || "").trim() ? m.einsatzort : kundeAdr,
        zustaendig: String(m.zustaendig || "").trim() || "Nicht definiert",
        start: fmtDateTimeDe(meta.terminVon || m.startzeit),
        ende: fmtDateTimeDe(meta.terminBis || m.endzeit),
        mitarbeiter: String(m.mitarbeiterName || "").trim() || noQ(v.messtechniker),
        beschr1: String(m.beschreibung1 || "").trim() || [meta.kunde, meta.strasse, meta.ort].filter(Boolean).join(", "),
        beschr2: String(m.beschreibung2 || "").trim() || noQ(meta.auftragsart),
        arbeiten: String(m.ausgefArbeiten || "").trim() || "Nicht definiert",
        artikel: artikelRows().map((r) => ({ nr: noQ(r.nr), text: noQ(r.text), menge: noQ(r.menge), einheit: noQ(r.einheit), pos: noQ(r.pos) })),
        nameMa: String(m.sigNameMa || "").trim() || noQ(v.messtechniker),
        nameKunde: String(m.sigNameKunde || "").trim() || noQ(meta.kunde),
        datum: today
      };
    }

    function buildServicePdf(sigs) {
      const d = serviceData();
      const doc = new PdfDoc();
      doc.addPage();
      const L = 15, W = 180, HALF = W / 2, GREY = "#d4d4d4", FS = 7.5, F = 1.25, PAD = 1.3, BD = 0.35;
      const lh = lhMm(FS, F);
      const NARROW = 190 / MM; /* ca. 1/3 Seitenbreite */
      const cell = (x, y, w, h, fill) => doc.rect(x, y, w, h, { fill: fill || null, stroke: "#000000", lw: BD });
      const nLines = (str, w) => wrapLines(str, w - 2 * PAD, FS, false).length;
      const textH = (str, w, minLines) => Math.max(minLines || 1, nLines(str, w)) * lh + 2 * PAD;
      /* Beschriftungszelle: grau, fett, vertikal zentriert */
      const label = (x, y, w, h, t) => {
        cell(x, y, w, h, GREY);
        doc.text(x + PAD, y + (h - lh) / 2 + (baselineMm(0, FS, F) + 0.25), t, FS, true);
      };
      /* Inhaltszelle: weiß, oben ausgerichtet, ggf. gekürzt */
      const content = (x, y, w, h, str, maxLines) => {
        cell(x, y, w, h);
        let lines = wrapLines(str, w - 2 * PAD, FS, false);
        if (maxLines && lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] += " …"; }
        lines.forEach((ln, k) => { if (ln) doc.text(x + PAD, baselineMm(y + PAD + k * lh, FS, F) + 0.25, ln, FS, false); });
      };
      /* vertikal zentrierter Einzeiler in weißer Zelle */
      const valueMid = (x, y, w, h, t) => {
        cell(x, y, w, h);
        doc.text(x + PAD, y + (h - lh) / 2 + (baselineMm(0, FS, F) + 0.25), t, FS, false);
      };
      const HH = 5.2;

      doc.text(L, 20, "Servicereport", 10, true);
      doc.text(L, 26, "Auftrag : " + d.nr, 9, false);
      let y = 31;

      /* 1) Kunde | Auftragnehmer und Einsatzort | Zuständig: EINE durchgehende Tabelle */
      [["Kunde", d.kunde, "Auftragnehmer", d.auftragnehmer], ["Standort", d.einsatzort, "Zuständig", d.zustaendig]].forEach((r) => {
        label(L, y, HALF, HH, r[0]); label(L + HALF, y, HALF, HH, r[2]);
        y += HH;
        const h = Math.max(textH(r[1], HALF, 3), textH(r[3], HALF, 3));
        content(L, y, HALF, h, r[1], 6); content(L + HALF, y, HALF, h, r[3], 6);
        y += h;
      });

      /* 2) Termine: schmale Tabelle, zwei gestapelte Zeilen */
      y += 5;
      const lw = NARROW * 0.4, vw = NARROW - lw, RH = 5.6;
      label(L, y, lw, RH, "Starttermin"); valueMid(L + lw, y, vw, RH, d.start);
      y += RH;
      label(L, y, lw, RH, "Fertigtermin"); valueMid(L + lw, y, vw, RH, d.ende);
      y += RH;

      /* 3) Mitarbeiter: gleiche schmale Breite */
      y += 4;
      label(L, y, NARROW, HH, "Mitarbeiter"); y += HH;
      const mh = textH(d.mitarbeiter, NARROW, 1) + 0.6;
      content(L, y, NARROW, mh, d.mitarbeiter, 3); y += mh;

      /* 4) Beschreibung + Ausgeführte Arbeiten: eine durchgehende Tabelle */
      y += 4;
      label(L, y, W, HH, "Beschreibung"); y += HH;
      content(L, y, W, textH(d.beschr1, W, 1), d.beschr1, 2); y += textH(d.beschr1, W, 1);
      content(L, y, W, textH(d.beschr2, W, 1), d.beschr2, 2); y += textH(d.beschr2, W, 1);
      label(L, y, W, HH, "Ausgeführte Arbeiten"); y += HH;
      const maxArb = Math.max(2, Math.min(10, Math.floor((236 - y - 2 * PAD) / lh)));
      const ah = textH(d.arbeiten, W, 1);
      content(L, y, W, Math.min(ah, maxArb * lh + 2 * PAD), d.arbeiten, maxArb);

      /* 4b) Artikeltabelle (Artikel-Nr. | Beschreibung | Anzahl | Einheit | Position-Nr.) + Material Gesamt */
      {

        y += HH;

      /* 5) Unterschriften: ca. 45 pt unter dem Text, zwei aneinanderstoßende Boxen, linksbündig */
      y += 45 / MM;
      const BW = 135 / MM, SH = 50 / MM, CH = 2 * lh + 2 * PAD;
      [["Unterschrift Mitarbeiter", d.nameMa, sigs && sigs.ma, L], ["Unterschrift Kunde", d.nameKunde, sigs && sigs.kunde, L + BW]].forEach(([cap, name, st, x]) => {

        doc.strokes(x + (BW - fw) / 2, y + (SH - fh) / 2, fw, fh, st, 0.8);
        cell(x, y + SH, BW, CH, GREY);
        doc.text(x + PAD, baselineMm(y + SH + PAD, FS, F) + 0.25, cap, FS, true);
        doc.text(x + PAD, baselineMm(y + SH + PAD + lh, FS, F) + 0.25, (d.datum + " " + name).trim(), FS, true);
      });

      /* 6) Fußzeile mit dünner Linie */
      doc.line(L, 282, L + W, 282, 0.3, "#000000");
      doc.text(L, 286.5, "Auftrag : " + d.nr, 8, false);
      const pg = "1/1";
      doc.text(L + W - textWidthMm(pg, 8, false), 286.5, pg, 8, false);
      return doc.build("Servicereport " + d.nr);
    }

    /* ----- 3) Notizen als echte .docx (minimales OOXML, ZIP ohne Kompression) ----- */
    const CRC_TABLE = (function () {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
      return t;
    })();
    function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
    function zipStore(files) {
      const enc = new TextEncoder();
      const parts = [], central = [];
      let off = 0;
      const now = new Date();
      const dtime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
      const ddate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      files.forEach((f) => {
        const name = enc.encode(f.name);
        const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
        const crc = crc32(data);
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
        lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true); lh.setUint32(14, crc, true);
        lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
        parts.push(new Uint8Array(lh.buffer), name, data);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
        ch.setUint16(12, dtime, true); ch.setUint16(14, ddate, true); ch.setUint32(16, crc, true);
        ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
        ch.setUint32(42, off, true);
        central.push(new Uint8Array(ch.buffer), name);
        off += 30 + name.length + data.length;
      });
      let csize = 0;
      central.forEach((c) => { csize += c.length; });
      const eo = new DataView(new ArrayBuffer(22));
      eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
      eo.setUint32(12, csize, true); eo.setUint32(16, off, true);
      const all = parts.concat(central, [new Uint8Array(eo.buffer)]);
      const total = all.reduce((n, p) => n + p.length, 0);
      const out = new Uint8Array(total);
      let p = 0;
      all.forEach((a) => { out.set(a, p); p += a.length; });
      return out;
    }
    function xmlEsc(s) {
      return String(s == null ? "" : s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g, "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function docxRun(text) {
      return String(text).split("\t").map((seg, i) => (i ? "<w:r><w:tab/></w:r>" : "") + (seg === "" ? "" : '<w:r><w:t xml:space="preserve">' + xmlEsc(seg) + "</w:t></w:r>")).join("");
    }
    function buildNotizenDocx() {

      if (meta.kunde) paras.push("<w:p>" + docxRun("Kunde: " + meta.kunde) + "</w:p>");
      paras.push("<w:p>" + docxRun("Datum: " + datum) + "</w:p>");
      paras.push("<w:p/>");
      String(m.notiz || "").replace(/\r\n?/g, "\n").split("\n").forEach((ln) => { paras.push("<w:p>" + docxRun(ln) + "</w:p>"); });
      const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
      const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<w:document ' + NS + "><w:body>" + paras.join("")

        + '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr><w:keepNext/><w:spacing w:after="160"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:sz w:val="32"/><w:szCs w:val="32"/></w:rPr></w:style></w:styles>';
      const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
      const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
      const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
      return zipStore([
        { name: "[Content_Types].xml", data: ct },

    /* ----- JPEG-Helfer: Fotos 1:1 als DCT in die PDF einbetten ----- */
    function jpegInfo(b) {
      if (!b || b.length < 4 || b[0] !== 0xFF || b[1] !== 0xD8) return null;
      let i = 2;
      while (i + 9 < b.length) {
        if (b[i] !== 0xFF) { i++; continue; }
        const mk = b[i + 1];
        if (mk === 0xFF) { i++; continue; }
        if (mk === 0xD8 || (mk >= 0xD0 && mk <= 0xD7) || mk === 0x01) { i += 2; continue; }
        const len = (b[i + 2] << 8) | b[i + 3];
        if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) {
          return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8], comps: b[i + 9] };
        }
        i += 2 + len;
      }
      return null;
    }
    function reencodeJpeg(blob) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          c.toBlob((b) => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", 0.92);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
        img.src = url;
      });
    }
    async function blobToJpegImg(blob) {
      let bytes = new Uint8Array(await blob.arrayBuffer());
      let info = jpegInfo(bytes);
      if (!info || (info.comps !== 3 && info.comps !== 1)) {
        bytes = new Uint8Array(await (await reencodeJpeg(blob)).arrayBuffer());
        info = jpegInfo(bytes);
      }
      if (!info) return null;
      return { bytes, w: info.w, h: info.h, comps: info.comps };
    }
    async function collectPhotoImages() {
      const out = [];
      for (const p of orderedPhotos().filter((x) => x.druck)) {
        let img = null;
        try {
          const rec = await idbGetPhoto(current.id, p.id);
          const b = displayBlob(rec);
          if (b) img = await blobToJpegImg(b);
        } catch (e) { console.warn("photo", e); }
        if (img) out.push({ p, img });
      }
      return out;
    }

    function bindSigPad() {
      const canvas = document.getElementById("sigCanvas");
      if (!canvas) return;
      const key = sigTab;
      const ctx = canvas.getContext("2d");
      function size() {
        const dpr = window.devicePixelRatio || 1;
        const r = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(r.width * dpr));
        canvas.height = Math.max(1, Math.round(r.height * dpr));
        redraw();
      }
      function redraw() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#111"; ctx.fillStyle = "#111";
        ctx.lineWidth = Math.max(2, canvas.width / 300);
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        sigStore[key].forEach((st) => {
          if (!st.length) return;
          ctx.beginPath();
          st.forEach((pt, i) => { const x = pt[0] * canvas.width, y = pt[1] * canvas.height; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
          if (st.length === 1) ctx.lineTo(st[0][0] * canvas.width + 0.01, st[0][1] * canvas.height);
          ctx.stroke();
        });
      }
      size();
      let cur = null;
      const pt = (e) => {
        const r = canvas.getBoundingClientRect();
        return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
      };
      canvas.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        sigSyncOwner();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
        cur = [pt(e)];
        sigStore[key].push(cur);
        redraw();
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!cur) return;
        e.preventDefault();
        const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [e];
        (evs.length ? evs : [e]).forEach((ev) => cur.push(pt(ev)));
        redraw();
      });
      const done = () => { cur = null; };
      canvas.addEventListener("pointerup", done);
      canvas.addEventListener("pointercancel", done);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      window.addEventListener("resize", () => { if (document.getElementById("sigCanvas") === canvas) size(); });
      main.querySelectorAll("[data-sigtab]").forEach((b) => b.addEventListener("click", () => {
        sigTab = b.getAttribute("data-sigtab");
        renderMain();
      }));
    }
