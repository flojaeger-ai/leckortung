      document.getElementById("annotTextOk").addEventListener("click", annotCommitText);
      document.getElementById("annotTextCancel").addEventListener("click", annotCancelText);
      document.getElementById("annotTextInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); annotCommitText(); }
        if (e.key === "Escape") annotCancelText();
      });
    }

    function onAnnotDown(e) {
      if (!annot.open || e.button) return;
      e.preventDefault();
      e.stopPropagation();
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      annot.pointerId = e.pointerId;
      const p = annotPtr(e);
      annot.drawing = true;
      if (annot.tool === "freehand") {
        annot.draft = { type: "freehand", color: annot.color, width: annot.width, points: [{ x: p.x, y: p.y }] };
      } else if (annot.tool === "text") {
        annot.draft = { type: "text", color: annot.color, width: annot.width, x: p.x, y: p.y, text: "" };
        annot.drawing = false;
        annotShowTextPop(e.clientX, e.clientY);
        return;
      } else {
        annot.draft = { type: annot.tool, color: annot.color, width: annot.width, x1: p.x, y1: p.y, x2: p.x, y2: p.y, x: p.x, y: p.y, w: 0, h: 0 };
      }
      annotRedraw();
    }

    function onAnnotMove(e) {
      if (!annot.drawing || !annot.draft) return;
      if (annot.pointerId != null && e.pointerId !== annot.pointerId) return;
      e.preventDefault();
      const p = annotPtr(e);
      if (annot.draft.type === "freehand") {
        const last = annot.draft.points[annot.draft.points.length - 1];
        if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 1.5 / annot.scale) {
          annot.draft.points.push({ x: p.x, y: p.y });
        }
      } else {
        annot.draft.x2 = p.x;
        annot.draft.y2 = p.y;
        annot.draft.w = p.x - annot.draft.x;
        annot.draft.h = p.y - annot.draft.y;
      }
      annotRedraw();
    }

    function onAnnotUp(e) {
      if (!annot.drawing && annot.tool !== "text") return;
      if (annot.pointerId != null && e.pointerId !== annot.pointerId) return;
      if (annot.draft && annot.draft.type !== "text") {
        annot.shapes.push(annot.draft);
        annot.draft = null;
        annotPushHistory();
      }
      annot.drawing = false;
      annot.pointerId = null;
      annotRedraw();
    }

    let annotTextPos = null;
    function annotShowTextPop(clientX, clientY) {
      const pop = document.getElementById("annotTextPop");
      const stage = document.getElementById("annotStage");
      const sr = stage.getBoundingClientRect();
      let left = clientX - sr.left + 8;
      let top = clientY - sr.top + 8;
      pop.classList.add("open");
      pop.style.left = "0px";
      pop.style.top = "0px";
      const pr = pop.getBoundingClientRect();
      if (left + pr.width > sr.width - 8) left = Math.max(8, sr.width - pr.width - 8);
      if (top + pr.height > sr.height - 8) top = Math.max(8, sr.height - pr.height - 8);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
      const input = document.getElementById("annotTextInput");
      input.value = "";
      setTimeout(() => input.focus(), 30);
    }
    function annotCommitText() {
      const input = document.getElementById("annotTextInput");
      const text = (input && input.value || "").trim();
      document.getElementById("annotTextPop").classList.remove("open");
      if (text && annot.draft && annot.draft.type === "text") {
        annot.draft.text = text;
        annot.shapes.push(annot.draft);
        annotPushHistory();
      }
      annot.draft = null;
      annotRedraw();
    }
    function annotCancelText() {
      document.getElementById("annotTextPop").classList.remove("open");
      annot.draft = null;
      annotRedraw();
    }

    async function openAnnotEditor() {
      const p = getPhoto(activePhotoId);
      if (!p) return;
      const rec = await idbGetPhoto(current.id, p.id);
      if (!rec || !rec.blob) {
        toast("Bild konnte nicht geladen werden.", true);
        return;
      }
      annotBuildChrome();
      const img = new Image();
      const url = URL.createObjectURL(rec.blob);
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      URL.revokeObjectURL(url);
      annot.open = true;
      annot.photoId = p.id;
      annot.img = img;
      annot.imgW = img.naturalWidth;
      annot.imgH = img.naturalHeight;
      annot.shapes = JSON.parse(JSON.stringify(p.annotations || []));
      annot.history = [JSON.parse(JSON.stringify(annot.shapes))];
      annot.historyIndex = 0;
      annot.draft = null;
      annot.drawing = false;
      annot.dirty = false;
      annot.tool = "freehand";
      annot.color = "rot";
      annot.width = "mid";
      const el = document.getElementById("annotEditor");
      el.hidden = false;
      el.classList.add("open");
      document.body.style.overflow = "hidden";
      annotUpdateButtons();
      requestAnimationFrame(() => { annotLayout(); annotLayout(); });
    }

    async function flattenAnnotatedJpeg(img, shapes) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0);
      shapes.forEach((s) => drawAnnotShape(ctx, s, c.width, c.height));
      return new Promise((resolve, reject) => {
        c.toBlob((b) => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", 0.88);
      });
    }

    async function annotClose(save) {
      if (!annot.open) return;
      if (!save && annot.dirty) {
        if (!confirm("Markierungen verwerfen und den Editor schließen?")) return;
      }
      if (save) {
        const p = getPhoto(annot.photoId);
        if (p && annot.img) {
          p.annotations = JSON.parse(JSON.stringify(annot.shapes));
          p.annotated = p.annotations.length > 0;
          persistCurrent();
          try {
            let annotatedBlob = null;
            if (p.annotated) annotatedBlob = await flattenAnnotatedJpeg(annot.img, p.annotations);
            await idbMergePhoto(current.id, p.id, { annotatedBlob: annotatedBlob });
          } catch (err) {
            toast("Markierungen konnten nicht gespeichert werden.", true);
          }
          toast(p.annotated ? "Markierungen gespeichert" : "Bild ohne Markierungen gespeichert");
        }
      }
      annot.open = false;
      annot.img = null;
      annot.shapes = [];
      document.getElementById("annotEditor").classList.remove("open");
      document.getElementById("annotEditor").hidden = true;
      document.body.style.overflow = "";
      const pop = document.getElementById("annotTextPop");
      if (pop) pop.classList.remove("open");
      if (save) renderApp();
    }

    async function restoreOriginalPhoto() {
      const p = getPhoto(activePhotoId);
      if (!p) return;
      if (!confirm("Markierungen entfernen und das Originalbild wiederherstellen?")) return;
      p.annotations = [];
      p.annotated = false;
      persistCurrent();
      try { await idbMergePhoto(current.id, p.id, { annotatedBlob: null }); } catch (e) {}
      renderApp();
      toast("Original wiederhergestellt");
    }

    document.addEventListener("keydown", (e) => {
      if (!annot.open) return;
      if (e.key === "Escape") {
        const pop = document.getElementById("annotTextPop");
        if (pop && pop.classList.contains("open")) { annotCancelText(); return; }
        annotClose(false);
      }
      const cmd = e.metaKey || e.ctrlKey;
      if (cmd && e.key.toLowerCase() === "z") { e.preventDefault(); if (e.shiftKey) annotRedo(); else annotUndo(); }
      if (cmd && e.key.toLowerCase() === "y") { e.preventDefault(); annotRedo(); }
    });
    window.addEventListener("resize", () => { if (annot.open) annotLayout(); });


    const ICLOUD_FORMAT = "leckortung";
    const ICLOUD_FORMAT_VERSION = 1;
    const STORAGE_ICLOUD_HINT = "leckortung.icloudHint";

    function safeAuftragFilename(a) {
      const nr = ((a.meta && a.meta.auftragsNr) || "ohne-Nr").trim() || "ohne-Nr";
      const kunde = ((a.meta && a.meta.kunde) || "ohne-Kunde").trim() || "ohne-Kunde";
      return ("Auftrag_" + nr + "_" + kunde + ".leckortung.json")
        .replace(/[^\w.\-ÄÖÜäöüß]+/g, "_")
        .replace(/_+/g, "_");
    }

    async function dataUrlToBlob(dataUrl) {
      const res = await fetch(dataUrl);
      if (!res.ok) throw new Error("data-url");
      return res.blob();
    }

    function canShareFiles(file) {
      try {
        return !!(navigator.canShare && file && navigator.canShare({ files: [file] }));
      } catch (e) {
        return false;
      }
    }

    function showChoiceDialog(title, message, buttons) {
      return new Promise((resolve) => {
        const overlay = document.getElementById("choiceOverlay");
        document.getElementById("choiceTitle").textContent = title;
        document.getElementById("choiceMsg").innerHTML = message;
        const actions = document.getElementById("choiceActions");
        actions.innerHTML = "";
        const finish = (value) => {
          overlay.hidden = true;
          overlay.classList.remove("open");
          document.removeEventListener("keydown", onKey);
          resolve(value);
        };
        const onKey = (e) => { if (e.key === "Escape") finish("cancel"); };
        buttons.forEach((b) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "btn" + (b.primary ? " primary" : "") + (b.danger ? " danger" : "");
          btn.id = b.id || "";
          btn.textContent = b.label;
          btn.addEventListener("click", () => finish(b.value));
          actions.appendChild(btn);
        });
        overlay.hidden = false;
        requestAnimationFrame(() => overlay.classList.add("open"));
        document.addEventListener("keydown", onKey);
      });
    }

    async function maybeShowICloudHint() {
      try {
        if (localStorage.getItem(STORAGE_ICLOUD_HINT)) return;
      } catch (e) {}
      await showChoiceDialog(
        "In iCloud speichern",
        "Im Teilen-Menü „In Dateien sichern“ wählen und den Ordner iCloud Drive › Leckortung auswählen.",
        [{ label: "Verstanden", value: "ok", primary: true, id: "choiceOk" }]
      );
      try { localStorage.setItem(STORAGE_ICLOUD_HINT, "1"); } catch (e) {}
    }

    async function buildAuftragPackage(auftrag) {
      const payload = JSON.parse(JSON.stringify(auftrag));
      payload.photos = [];
      for (const p of auftrag.photos || []) {
        const rec = await idbGetPhoto(auftrag.id, p.id);
        const item = Object.assign({}, migratePhoto(p));
        delete item.imageData;
        delete item.originalImageData;
        delete item.annotatedImageData;
        if (rec && rec.blob) item.originalImageData = await blobToDataUrl(rec.blob);
        if (rec && rec.annotatedBlob) item.annotatedImageData = await blobToDataUrl(rec.annotatedBlob);
        const display = rec ? displayBlob(rec) : null;
        if (display) {
          item.imageData = await blobToDataUrl(display);
          item.mime = rec.mime || "image/jpeg";
        }
        payload.photos.push(item);
      }
      payload.format = ICLOUD_FORMAT;
      payload.formatVersion = ICLOUD_FORMAT_VERSION;
      payload.lastModified = auftrag.updatedAt || nowIso();
      payload.exportedAt = nowIso();
      payload.photoSortMode = auftrag.photoSortMode || photoSortMode || "custom";
      return payload;
    }

    function downloadBlobFile(file) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }

    async function shareOrDownloadFile(file) {
      if (canShareFiles(file)) {
        await maybeShowICloudHint();
        try {
          await navigator.share({ files: [file] });
          toast("Auftrag geteilt");
          return "share";
        } catch (err) {
          if (err && (err.name === "AbortError" || err.name === "NotAllowedError")) return "abort";
          console.warn("share failed, falling back to download", err);
        }
      }
      downloadBlobFile(file);
      toast("Datei gespeichert");
      return "download";
    }

    async function getAuftragForExport(id) {
      if (!id || id === current.id) {
        if (view === "fotodetail") readPhotoDetailIntoModel();
        persistCurrent();
        return current;
      }
      const found = reports.find((r) => r.id === id);
      return found || null;
    }

    async function saveAuftragToICloud(id) {
      const auftrag = await getAuftragForExport(id);
      if (!auftrag) {
        toast("Auftrag nicht gefunden.", true);
        return;
      }
      try {
        toast("Datei wird erstellt…");
        const payload = await buildAuftragPackage(auftrag);
        const json = JSON.stringify(payload);
        const file = new File([json], safeAuftragFilename(auftrag), { type: "application/json" });
        await shareOrDownloadFile(file);
      } catch (err) {
        console.error(err);
        toast("Speichern fehlgeschlagen.", true);
      }
    }

    function looksLikeAuftrag(obj) {
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
      if (obj.format && obj.format !== ICLOUD_FORMAT) return false;
      const src = (obj.auftrag && typeof obj.auftrag === "object" && !Array.isArray(obj.auftrag))
        ? obj.auftrag : obj;
      return !!(src.id || src.meta || src.values || Array.isArray(src.photos));
    }

    function unwrapAuftragFile(obj) {
      const wrapper = obj;
      const src = (obj.auftrag && typeof obj.auftrag === "object" && !Array.isArray(obj.auftrag))
        ? obj.auftrag : obj;
      return {
        src,
        lastModified: wrapper.lastModified || src.lastModified || src.updatedAt || "",
        exportedAt: wrapper.exportedAt || src.exportedAt || "",
        formatVersion: wrapper.formatVersion || src.formatVersion || 0
      };
    }

    function stripPhotoData(p) {
      const m = migratePhoto(p);
      return m;
    }

    async function restorePhotosFromExport(auftragId, photos) {
      for (const p of photos || []) {
        if (!p || !p.id) continue;
        let blob = null;
        let annotatedBlob = null;
        if (p.originalImageData) {
          blob = await dataUrlToBlob(p.originalImageData);
        } else if (p.imageData) {
          blob = await dataUrlToBlob(p.imageData);
        }
        if (p.annotatedImageData) {
          annotatedBlob = await dataUrlToBlob(p.annotatedImageData);
        } else if (p.annotated && p.imageData && p.originalImageData) {
          annotatedBlob = await dataUrlToBlob(p.imageData);
        }
        if (!blob && !annotatedBlob) continue;
        const patch = { mime: p.mime || "image/jpeg" };
        if (blob) patch.blob = blob;
        if (annotatedBlob) patch.annotatedBlob = annotatedBlob;
        await idbMergePhoto(auftragId, p.id, patch);
      }
    }

    function formatStamp(iso) {
      if (!iso) return "";
      try {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return String(iso);
        return d.toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
      } catch (e) {
        return String(iso);
      }
    }


    async function importAuftragFromObject(obj) {
      if (!looksLikeAuftrag(obj)) throw new Error("format");
      const { src, lastModified, exportedAt } = unwrapAuftragFile(obj);
      const photoRaw = Array.isArray(src.photos) ? src.photos : [];
      let next = migrateAuftrag(src);
      const existing = reports.find((r) => r.id === next.id) || (current.id === next.id ? current : null);
      let mode = "new";
      if (existing) {
        const fileTs = lastModified || exportedAt || src.updatedAt || "";
        const localTs = existing.updatedAt || "";
        const fileTime = fileTs ? Date.parse(fileTs) : NaN;
        const localTime = localTs ? Date.parse(localTs) : NaN;
        const newer = isFinite(fileTime) && isFinite(localTime) && fileTime > localTime + 1000;
        const older = isFinite(fileTime) && isFinite(localTime) && fileTime + 1000 < localTime;
        let info = "Ein Auftrag mit derselben ID ist bereits gespeichert.";
        if (newer) {
          info += "<br><strong>Die Datei ist neuer</strong> (Datei: "
            + escapeHtml(formatStamp(fileTs)) + ", gespeichert: "
            + escapeHtml(formatStamp(localTs)) + ").";
        } else if (older) {
          info += "<br>Die gespeicherte Version ist neuer (Datei: "
            + escapeHtml(formatStamp(fileTs)) + ", gespeichert: "
            + escapeHtml(formatStamp(localTs)) + ").";
        } else if (fileTs || localTs) {
          info += "<br>Stand Datei: " + escapeHtml(formatStamp(fileTs) || "unbekannt")
            + ", gespeichert: " + escapeHtml(formatStamp(localTs) || "unbekannt") + ".";
        }
        const choice = await showChoiceDialog("Auftrag vorhanden", info, [
          { label: "Überschreiben", value: "overwrite", danger: true, id: "choiceOverwrite" },
          { label: "Als Kopie", value: "copy", primary: true, id: "choiceCopy" },
          { label: "Abbrechen", value: "cancel", id: "choiceCancel" }
        ]);
        if (choice === "cancel" || choice == null) return;
        mode = choice;
        if (mode === "copy") {
          next.id = uid("r");
          next.createdAt = nowIso();
        }
      }
      next.photos = photoRaw.map(stripPhotoData);
      if (mode === "overwrite") {
        try { await idbDeleteAuftragPhotos(next.id); } catch (e) {}
      }
      await restorePhotosFromExport(next.id, photoRaw);
      const idx = reports.findIndex((r) => r.id === next.id);
      next.updatedAt = nowIso();
      if (idx >= 0) reports[idx] = next;
      else reports.unshift(next);
      persistList();
      current = migrateAuftrag(JSON.parse(JSON.stringify(next)));
      photoSortMode = current.photoSortMode === "date" ? "date" : "custom";
      persistCurrent();
      showView("overview");
      closeDrawer();
      renderReportList();
      toast(mode === "copy" ? "Auftrag als Kopie importiert" : (mode === "overwrite" ? "Auftrag überschrieben" : "Auftrag geöffnet"));
    }

    async function importAuftragFile(file) {
      if (!file) return;
      try {
        const text = await file.text();
        const obj = JSON.parse(text);
        await importAuftragFromObject(obj);
      } catch (err) {
        console.error(err);
        if (err && err.message === "format") toast("Die Datei ist kein gültiger Auftrag.", true);
        else toast("Datei konnte nicht geöffnet werden.", true);
      }
    }


    /* Init */
    ensurePhotoOrder();
    renderApp();
    persistCurrent();
  })();
  </script>
</body>
