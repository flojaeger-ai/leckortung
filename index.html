  <title>Leckortung</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1a5fad;
      --blue-dark: #144a8a;
      --blue-light: #e8f0fa;
      --blue-mid: #2b73c9;
      --bg: #eef1f5;
      --card: #fff;
      --line: #d5dbe3;
      --line-soft: #e6eaef;
      --text: #1c2430;
      --muted: #5b6573;
      --label: #1c2430;
      --danger: #c0392b;
      --ok: #1e7a46;
      --dot-ok: #1f9d55;
      --dot-missing: #e23c2f;
      --shadow: 0 1px 3px rgba(16, 32, 56, .08);
      --header-h: 52px;
      --tabs-h: 46px;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --touch: 48px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      height: 100%;
      height: 100dvh;
      font-family: var(--font);
      color: #1c2430;
      background: #eef1f5;
      color-scheme: light;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      display: flex; flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }
    button, input, textarea, select {
      font-family: inherit;
      font-size: 16px;
      max-width: 100%;
      min-width: 0;
      color-scheme: light;
    }
    input, textarea, select {
      background-color: #f7f9fb;
      color: #1c2430;
    }
    .card, .menu-list, .foto-item, .report-item, .choice-dialog {
      background-color: #fff;
      color: #1c2430;
    }
    button, a, .tab, .menu-item, .icon-btn, .hdr-btn, .btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(26,95,173,.18);
    }
    img, svg { max-width: 100%; }
    input[type="date"], input[type="datetime-local"], input[type="time"], input[type="number"] {
      min-width: 0;
      max-width: 100%;
    }

    /* Header */
    .app-header {
      position: sticky; top: 0; z-index: 40;
      height: calc(var(--header-h) + var(--sat));
      background: linear-gradient(180deg, var(--blue-mid) 0%, var(--blue) 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sat) max(6px, var(--sar)) 0 max(4px, var(--sal));
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
      flex-shrink: 0;
    }
    .app-header h1 {
      position: absolute; left: 50%; transform: translateX(-50%);
      margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .2px;
      max-width: calc(100% - 196px);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      pointer-events: none; text-align: center;
    }
    .hdr-left, .hdr-right {
      display: flex; align-items: center; gap: 0; z-index: 1; min-width: 48px;
    }
    .hdr-right { margin-left: auto; }
    .hdr-btn {
      appearance: none; border: 0; background: transparent; color: #fff;
      width: 44px; height: 44px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hdr-btn-label {
      width: auto; min-width: 44px; height: 36px; padding: 0 10px; gap: 6px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      background: rgba(255,255,255,.16);
    }
    .hdr-btn-label:hover, .hdr-btn-label:focus-visible { background: rgba(255,255,255,.26); }
    .app-toolbar {
      display: none; flex-shrink: 0; gap: 8px; align-items: center;
      padding: 8px max(12px, var(--sar)) 8px max(12px, var(--sal));
      background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: calc(var(--header-h) + var(--sat)); z-index: 35;
    }
    .app-toolbar .btn { flex: 1; min-height: 44px; font-weight: 700; }
    .btn-icloud { white-space: nowrap; font-weight: 700; }
    .app-version {
      text-align: center; color: var(--muted); font-size: 12px;
      padding: 16px 8px 20px; user-select: text;
    }
    .hdr-btn:hover, .hdr-btn:focus-visible { background: rgba(255,255,255,.15); outline: none; }
    .hdr-btn:active { background: rgba(255,255,255,.25); }
    .hdr-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .hdr-btn.danger-icon:hover, .hdr-btn.danger-icon:focus-visible { background: rgba(226,60,47,.25); }
    .save-flash { animation: flashok .7s ease; }
    @keyframes flashok {
      0%,100% { background: transparent; }
      40% { background: rgba(255,255,255,.28); }
    }

    /* Tabs */
    .tab-bar {
      position: sticky; top: calc(var(--header-h) + var(--sat)); z-index: 30;
      display: flex; gap: 0; background: #fff;
      border-bottom: 1px solid var(--line);
      overflow-x: auto; overflow-y: hidden;
      flex-shrink: 0; height: var(--tabs-h);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-left: var(--sal);
      padding-right: var(--sar);
    }
    .tab-bar.is-hidden { display: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); font-size: 13.5px; font-weight: 600;
      padding: 0 18px; height: var(--tabs-h); white-space: nowrap;
      cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .tab-short { display: none; }
    .tab-full { display: inline; }
    .tab:hover { color: var(--blue); background: var(--blue-light); }
    .tab[aria-selected="true"] {
      color: var(--blue); border-bottom-color: var(--blue);
    }

    /* Main */
    main { flex: 1; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    main.tight { padding: 0 0 calc(40px + var(--sab)); }
    .panel { display: none; max-width: 1100px; width: 100%; margin: 0 auto; min-width: 0; }
    .panel.active { display: block; }
    .view { display: none; max-width: 1100px; margin: 0 auto; }
    .view.active { display: block; }

    /* Form rows */
    .section { margin: 22px 0 8px; }
    .section-title {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; font-variant: small-caps;
      color: var(--muted); margin: 0 2px 8px;
    }
    .section-title::after {
      content: ""; flex: 1; height: 1px; background: var(--line);
    }

    .card {
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      max-width: 100%; min-width: 0;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(200px, 38%) 1fr;
      align-items: center;
      min-height: 46px;
      border-bottom: 1px solid var(--line-soft);
      padding: 6px 14px;
      gap: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .row:last-child { border-bottom: 0; }
    .row.label-top { align-items: start; padding-top: 10px; padding-bottom: 10px; }
    .row .lbl {
      font-weight: 700; font-size: 14px; color: var(--label); line-height: 1.3;
    }
    .row input[type="text"],
    .row input[type="tel"],
    .row input[type="date"],
    .row input[type="datetime-local"],
    .row input[type="number"] {
      width: 100%; border: 1px solid transparent; background: #f7f9fb;
      border-radius: 6px; padding: 8px 10px; font-size: 16px; color: var(--text);
      text-align: right; min-height: 40px;
    }
    .row input:focus, .row textarea:focus, .row select:focus {
      outline: none; border-color: var(--blue); background: #fff;
      box-shadow: 0 0 0 3px rgba(26,95,173,.15);
    }
    .row textarea {
      width: 100%; border: 1px solid transparent; background: #f7f9fb;
      border-radius: 6px; padding: 8px 10px; font-size: 16px; color: var(--text);
      text-align: left; min-height: 88px; resize: vertical; line-height: 1.4;
    }
    .row select {
      width: 100%; border: 1px solid transparent; background-color: #f7f9fb;
      border-radius: 6px; padding: 8px 28px 8px 10px; font-size: 16px; color: var(--text);
      text-align: right; min-height: 40px; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%235b6573' d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center;
    }
    .row input::placeholder, .row textarea::placeholder { color: #9aa3af; }
    .row input:disabled, .row textarea:disabled, .row select:disabled {
      color: var(--text); opacity: 1; background: #f0f3f6;
    }

    .row.check { grid-template-columns: 1fr auto; }
    .row.check input[type="checkbox"] { margin: 0; }
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 28px; height: 28px; min-width: 28px; min-height: 28px;
      border: 2px solid #8b96a5;
      border-radius: 6px; background: #fff; cursor: pointer; position: relative;
      flex-shrink: 0; margin: 0; pointer-events: auto; z-index: 1;
    }
    input[type="checkbox"]:checked {
      background: var(--blue); border-color: var(--blue);
    }
    input[type="checkbox"]:checked::after {
      content: ""; position: absolute; left: 8px; top: 3px;
      width: 7px; height: 14px; border: solid #fff; border-width: 0 2.6px 2.6px 0;
      transform: rotate(45deg);
    }
    input[type="checkbox"]:focus-visible { box-shadow: 0 0 0 3px rgba(26,95,173,.25); outline: none; }
    input[type="checkbox"]:disabled { opacity: .7; cursor: default; }

    .row.pair {
      grid-template-columns: minmax(160px, 1fr) auto minmax(140px, 1fr) auto;
      gap: 10px 14px;
    }
    .row.pair .lbl { font-weight: 700; }
    .row.pair.mixed {
      grid-template-columns: minmax(140px, 32%) 1fr minmax(90px, auto) auto;
    }
    .row.pair.mixed input[type="text"],
    .row.pair.mixed input[type="number"] { text-align: right; }
    .row.pair .right-lbl { text-align: right; }

    .extend-note {
      margin: 16px 2px 0; font-size: 12.5px; color: var(--muted); font-style: italic;
    }

    /* Overview menu */
    .overview-wrap { padding: 14px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    .menu-list {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      margin-top: 16px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px;
      width: 100%; text-align: left;
      appearance: none; border: 0; background: #fff; color: var(--text);
      min-height: 62px; padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer; font-size: 16.5px; font-weight: 600;
    }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item:hover, .menu-item:focus-visible { background: var(--blue-light); outline: none; }
    .menu-item:active { background: #dce7f5; }
    .menu-ico {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--blue-light); color: var(--blue);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .menu-ico svg { width: 22px; height: 22px; fill: currentColor; }
    .menu-item .menu-label { flex: 1; text-align: left; }
    .status-dot {
      width: 14px; height: 14px; min-width: 14px; max-width: 14px;
      border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(0,0,0,.04);
    }
    .chevron { flex-shrink: 0; }
    .status-dot.ok { background: var(--dot-ok); }
    .status-dot.missing { background: var(--dot-missing); }
    .status-dot.neutral { background: #c5cbd3; }
    .chevron { color: #9aa3af; display: inline-flex; }
    .chevron svg { width: 18px; height: 18px; fill: currentColor; }

    /* Fotos list */
    .fotos-wrap { padding: 12px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    .fotos-count { color: var(--muted); font-size: 14px; margin: 4px 2px 12px; }
    .foto-list { display: flex; flex-direction: column; gap: 10px; }
    .foto-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 8px 10px 4px;
      box-shadow: var(--shadow); cursor: pointer; min-height: 76px;
      user-select: none; -webkit-user-select: none;
    }
    .foto-handle {
      appearance: none; border: 0; background: transparent; color: var(--muted);
      width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: grab; touch-action: none; padding: 0;
    }
    .foto-handle:hover, .foto-handle:focus-visible { background: #f4f7fa; color: var(--text); outline: none; }
    .foto-handle:active, .foto-item.is-dragging .foto-handle { cursor: grabbing; }
    .foto-handle svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
    .foto-move { display: flex; flex-direction: column; flex-shrink: 0; gap: 0; }
    .foto-move .icon-btn { width: 44px; height: 32px; }
    .foto-move .icon-btn:disabled, .foto-move .icon-btn[aria-disabled="true"] {
      opacity: .3; pointer-events: none;
    }
    .foto-item.is-placeholder {
      opacity: .4;
      border-style: dashed;
    }
    .foto-ghost {
      position: fixed; z-index: 90; pointer-events: none;
      box-shadow: 0 10px 28px rgba(16,32,56,.28);
      opacity: .96; margin: 0;
      box-sizing: border-box;
    }
    .foto-item:hover, .foto-item:focus-visible { border-color: var(--blue); background: #f7fbff; outline: none; }
    .foto-item.no-comment { border-color: #f0b4ae; background: #fdf6f5; }
    .foto-item.no-comment .foto-name { color: var(--danger); }
    .foto-thumb {
      width: 72px; height: 72px; border-radius: 6px; object-fit: cover;
      background: #dfe4ea; flex-shrink: 0;
    }
    .foto-meta { flex: 1; min-width: 0; }
    .foto-name { display: block; font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .foto-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .foto-flag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--danger); margin-top: 3px; }
    .icon-btn {
      appearance: none; border: 0; background: transparent; color: var(--muted);
      width: 44px; height: 44px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .icon-btn:hover, .icon-btn:focus-visible { background: #f4f7fa; color: var(--danger); outline: none; }
    .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

    /* Foto details */
    .fdetail { padding: 0 0 calc(80px + var(--sab)); max-width: 900px; margin: 0 auto; }
    .fdetail-img-wrap {
      background: transparent;
      display: flex; align-items: center; justify-content: center;
      width: fit-content; max-width: 100%; margin: 0 auto;
      max-height: 52vh; cursor: zoom-in;
    }
    .fdetail-img-wrap img {
      max-width: 100%; max-height: 52vh; width: auto; height: auto;
      object-fit: contain; display: block; background: transparent;
    }
    .fdetail-body { padding: 8px 18px 24px; }
    .fg { margin: 18px 0 6px; }
    .fg-cap {
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      padding: 0 0 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px;
    }
    .fg .ro { font-size: 16px; padding: 4px 0 2px; }
    .fg textarea, .fg input[type="text"], .fg input[type="number"] {
      width: 100%; border: 1px solid transparent; background: #f7f9fb;
      border-radius: 6px; padding: 10px 10px; font-size: 16px; color: var(--text);
      min-height: 42px;
    }
    .fg textarea { min-height: 110px; resize: vertical; line-height: 1.4; text-align: left; }
    .fg textarea:focus, .fg input:focus {
      outline: none; border-color: var(--blue); background: #fff;
      box-shadow: 0 0 0 3px rgba(26,95,173,.15);
    }
    .fg textarea.is-invalid { border-color: var(--danger); background: #fdf6f5; }
    .fg textarea:disabled, .fg input:disabled { background: #f0f3f6; color: var(--text); opacity: 1; }
    .fg .hint { font-size: 13px; color: var(--danger); margin: 6px 0 0; display: none; }
    .fg .hint.show { display: block; }
    .fg .check-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 48px; padding: 8px 6px; margin: 0 -6px; border-radius: 8px;
      font-weight: 650; font-size: 15px; cursor: pointer;
      position: relative; z-index: 2; pointer-events: auto;
    }
    .fg .check-row:hover, .fg .check-row:active { background: #f4f7fa; }

    /* Druck: großer Schalter (Fotodetails) und Ein-Tipp-Schalter (Fotoliste) */
    .druck-switch {
      appearance: none; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      width: 100%; min-height: 64px; padding: 10px 14px; margin: 0;
      border: 2px solid var(--line); border-radius: 12px; background: #fff;
      font: inherit; font-weight: 650; font-size: 16px; color: var(--text); text-align: left;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
    }
    .druck-switch .ds-text { flex: 1; min-width: 0; }
    .druck-switch .ds-state { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px; }
    .druck-switch .ds-track {
      position: relative; flex-shrink: 0; width: 64px; height: 36px; border-radius: 999px;
      background: #c9d1da; transition: background .15s ease;
    }
    .druck-switch .ds-knob {
      position: absolute; top: 3px; left: 3px; width: 30px; height: 30px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); transition: left .15s ease;
    }
    .druck-switch[aria-checked="true"] { border-color: #2e8b57; background: #eef8f2; }
    .druck-switch[aria-checked="true"] .ds-track { background: #2e8b57; }
    .druck-switch[aria-checked="true"] .ds-knob { left: 31px; }
    .druck-switch[aria-checked="true"] .ds-state { color: #1a5a3a; }
    .druck-switch:focus-visible { outline: 3px solid rgba(26,95,173,.35); outline-offset: 2px; }
    .fg-druck { margin-top: 12px; }
    .foto-druck-btn {
      appearance: none; flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 76px; min-height: 52px; padding: 4px 8px; border-radius: 10px;
      border: 2px solid #c9d1da; background: #fff; color: var(--muted);
      font: inherit; font-size: 13px; font-weight: 700; line-height: 1.15; cursor: pointer;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .foto-druck-btn svg { width: 18px; height: 18px; fill: currentColor; margin-bottom: 2px; }
    .foto-druck-btn .fd-state { font-size: 11px; font-weight: 600; }
    .foto-druck-btn[aria-checked="true"] { border-color: #2e8b57; background: #e5f4eb; color: #1a5a3a; }
    .foto-druck-btn:focus-visible { outline: 3px solid rgba(26,95,173,.35); outline-offset: 2px; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      z-index: 100; display: none; align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
    .lightbox .lb-close {
      position: absolute; top: calc(10px + var(--sat)); right: max(10px, var(--sar)); color: #fff;
    }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: calc(22px + var(--sab)); transform: translateX(-50%) translateY(16px);
      background: #1c2430; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: .25s ease; z-index: 110;
      box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: min(520px, 92vw); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #8e1e18; }

    /* Drawer / Aufträge */
    .overlay {
      position: fixed; inset: 0; background: rgba(16,24,40,.45);
      z-index: 50; opacity: 0; pointer-events: none; transition: .2s;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(420px, 92vw);
      background: #fff; z-index: 60;
      transform: translateX(calc(-100% - 40px));
      transition: transform .22s ease, box-shadow .22s ease, visibility 0s linear .22s;
      display: flex; flex-direction: column;
      box-shadow: none;
      visibility: hidden;
      padding-bottom: var(--sab);
    }
    .drawer.open {
      transform: none;
      box-shadow: 6px 0 24px rgba(0,0,0,.18);
      visibility: visible;
      transition: transform .22s ease, box-shadow .22s ease, visibility 0s;
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(14px + var(--sat)) max(14px, var(--sar)) 12px max(14px, var(--sal));
      border-bottom: 1px solid var(--line);
      background: var(--blue); color: #fff;
    }
    .drawer-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .drawer-actions { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .btn {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      min-height: 40px;
    }
    .btn:hover { background: #f4f7fa; }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .btn.primary:hover { background: var(--blue-dark); }
    .btn.danger { color: var(--danger); border-color: #f0c9c5; }
    .btn.danger:hover { background: #fdf2f1; }
    .report-list { flex: 1; overflow: auto; padding: 8px; }
    .report-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 12px; border: 1px solid var(--line); border-radius: 8px;
      margin-bottom: 8px; cursor: pointer; background: #fff;
    }
    .report-item:hover { border-color: var(--blue); background: var(--blue-light); }
    .report-item.current {
      outline: 2px solid var(--blue);
      border-color: var(--blue);
      background: var(--blue-light);
    }
    .report-item .meta { flex: 1; min-width: 0; }
    .report-item .meta strong { display: block; font-size: 15px; margin-bottom: 2px; }
    .report-item .meta span { font-size: 13px; color: var(--muted); }
    .empty-list { color: var(--muted); text-align: center; padding: 32px 16px; font-size: 14px; }

    .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .report-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .report-cloud {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--blue);
      border-radius: 8px; width: 40px; height: 40px; min-width: 40px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .report-cloud svg { width: 20px; height: 20px; fill: currentColor; }
    .report-cloud:hover, .report-cloud:focus-visible { background: var(--blue-light); outline: none; }
    .btn-ico { display: inline-flex; align-items: center; gap: 6px; }
    .btn-ico svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
    .choice-overlay {
      position: fixed; inset: 0; z-index: 140; background: rgba(16,24,40,.45);
      display: none; align-items: center; justify-content: center;
      padding: max(16px, var(--sat)) 16px max(16px, var(--sab));
    }
    .choice-overlay.open { display: flex; }
    .choice-dialog {
      background: #fff; color: var(--text); border-radius: 12px;
      padding: 18px 16px 14px; width: min(420px, 100%);
      box-shadow: 0 16px 40px rgba(0,0,0,.28);
    }
    .choice-dialog h3 { margin: 0 0 8px; font-size: 17px; font-weight: 650; }
    .choice-dialog p { margin: 0 0 16px; font-size: 14px; line-height: 1.45; color: var(--text); }
    .choice-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }

    /* Print / PDF – A4 portrait, Watersolution letter layout */
    @page { size: A4 portrait; margin: 0; }
    .print-root { display: none; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; height: auto !important; }
      .app-header, .app-toolbar, .tab-bar, main, .overlay, .drawer, .toast, .lightbox, .hidden-file, .annot-editor, .choice-overlay { display: none !important; }
      .print-root {
        display: block !important;
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9.5pt;
        color: #111;
        line-height: 1.32;
        background: #fff;
      }
      .pp {
        width: 210mm;
        height: 297mm;
        box-sizing: border-box;
        padding: 9mm 15mm 26mm 15mm;
        position: relative;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
        background: #fff;
      }
      .pp:last-child { page-break-after: auto; break-after: auto; }
      .pp-head { text-align: center; margin: 0 0 5mm; }
      .ws-logo {
        display: flex; align-items: center; justify-content: center; gap: 5pt;
        font-family: Arial, Helvetica, sans-serif;
      }
      .ws-water {
        font-weight: 300; font-size: 20pt; letter-spacing: 0.14em;
        color: #6eb6e0; line-height: 1;
      }
      .ws-drop { width: 15pt; height: 22pt; display: block; flex-shrink: 0; }
      .ws-solution {
        font-weight: 700; font-size: 20pt; letter-spacing: 0.04em;
        color: #0b3d73; line-height: 1; position: relative;
      }
      .ws-gmbh {
        font-weight: 600; font-size: 7pt; letter-spacing: 0.02em;
        color: #0b3d73; margin-left: 3pt; vertical-align: 8pt;
      }
      .pp-foot {
        position: absolute; left: 15mm; right: 15mm; bottom: 7mm;
        color: #0b3d73;
      }
      .pp-pageno { text-align: right; font-size: 8pt; margin-bottom: 1.6mm; color: #0b3d73; }
      .pp-cols {
        display: grid;
        grid-template-columns: 1.05fr 1.45fr 1fr;
        gap: 5mm;
        font-size: 6.4pt;
        line-height: 1.35;
        color: #0b3d73;
      }
      .sender {
        font-size: 8pt; text-decoration: underline; margin: 0 0 4mm;
        color: #111;
      }
      .letterhead {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8mm;
        margin-bottom: 5mm; align-items: start;
      }
      .addr { font-size: 10pt; line-height: 1.4; }
      .refs { font-size: 8.5pt; line-height: 1.35; }
      .refs-note { margin-bottom: 2mm; }
      .refs-nr { font-weight: 700; font-size: 11pt; margin: 0 0 2mm; }
      .refs-co { margin-top: 2.5mm; font-size: 8pt; line-height: 1.35; }
      .kv { width: 100%; border-collapse: collapse; margin: 0 0 4mm; font-size: 9.5pt; }
      .kv th { text-align: left; font-weight: 700; width: 38mm; padding: 0.6mm 3mm 0.6mm 0; vertical-align: top; }
      .kv td { padding: 0.6mm 0; vertical-align: top; }
      .doc-title { font-size: 15pt; font-weight: 700; margin: 3mm 0 3.5mm; color: #111; }
      .inline-row { display: flex; flex-wrap: wrap; gap: 2mm 8mm; margin: 0 0 1.4mm; }
      .h-u {
        font-weight: 700; font-size: 11pt; color: #111;
        border-bottom: 0.8pt solid #111; margin: 3.5mm 0 2mm; padding-bottom: 0.6mm;
      }
      .h-sub { font-weight: 700; font-size: 10pt; margin: 2.6mm 0 0.8mm; }
      .bodytext { white-space: pre-wrap; min-height: 7mm; margin: 0 0 1.2mm; font-size: 9.5pt; }
      .cb-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8mm 4mm; margin: 1mm 0 2.5mm; }
      .cb-grid.two { grid-template-columns: 1fr 1fr; }
      .cb-item { display: flex; align-items: center; gap: 2mm; font-size: 9pt; break-inside: avoid; }
      .bx {
        display: inline-flex; align-items: center; justify-content: center;
        width: 8.5pt; height: 8.5pt; border: 0.7pt solid #111;
        font-size: 7.5pt; font-weight: 700; line-height: 1;
        flex-shrink: 0; box-sizing: border-box; background: #fff; color: #111;
      }
      .yn { white-space: nowrap; }
      .yn .bx { margin: 0 1.5pt 0 1pt; vertical-align: -1pt; display: inline-flex; }
      .line { margin: 0 0 1.3mm; }
      table.pruef { width: 100%; border-collapse: collapse; margin: 2mm 0 3.5mm; font-size: 8.5pt; }
      table.pruef th, table.pruef td {
        border: 0.5pt solid #333; padding: 1mm 1.4mm; text-align: left; vertical-align: middle;
      }
      table.pruef th { font-weight: 700; background: #f3f3f3; text-align: center; }
      table.pruef th.lbl, table.pruef td.lbl { text-align: left; width: auto; }
      table.pruef td.ctr { text-align: center; width: 16mm; }
      table.pruef .bx { border-color: #111; }
      .photo-row {
        display: grid;
        grid-template-columns: 1fr 8.2cm;
        gap: 7mm;
        align-items: start;
        min-height: 68mm;
        margin: 0 0 5mm;
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .photo-title { font-weight: 700; font-size: 10.5pt; margin: 0 0 3mm; }
      .photo-rest { white-space: pre-wrap; font-size: 9.5pt; line-height: 1.4; }
      .photo-img img { width: 8cm; height: auto; max-height: 68mm; object-fit: contain; display: block; }
    }


    /* Annotation editor */
    .annot-editor {
      position: fixed; inset: 0; z-index: 120;
      display: none; flex-direction: column;
      background: #1a1f26; color: #fff;
      padding: var(--sat) var(--sar) var(--sab) var(--sal);
      overscroll-behavior: none;
    }
    .annot-editor.open { display: flex; }
    .annot-bar {
      display: flex; align-items: center; gap: 6px;
      min-height: 52px; padding: 6px 8px; flex-shrink: 0;
      background: #11161c;
    }
    .annot-bar h2 {
      flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 650;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .annot-bar .hdr-btn, .annot-bar .annot-act {
      color: #fff; min-width: 44px; min-height: 44px;
    }
    .annot-act {
      appearance: none; border: 0; background: transparent; color: #fff;
      border-radius: 8px; padding: 8px 12px; font-size: 15px; font-weight: 650;
      cursor: pointer; touch-action: manipulation;
    }
    .annot-act:hover, .annot-act:focus-visible { background: rgba(255,255,255,.12); outline: none; }
    .annot-act.primary { background: var(--blue); }
    .annot-act:disabled { opacity: .35; pointer-events: none; }
    .annot-tools {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 6px 8px 8px; background: #151a21; flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .annot-tool, .annot-w {
      appearance: none; border: 1px solid transparent; background: #2a313a; color: #fff;
      border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 650;
      min-height: 40px; cursor: pointer; touch-action: manipulation;
    }
    .annot-tool.is-on, .annot-w.is-on { background: var(--blue); border-color: #8cb8e8; }
    .annot-swatch {
      appearance: none; border: 2px solid transparent; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .annot-swatch.is-on { border-color: #fff; box-shadow: 0 0 0 2px #111; }
    .annot-swatch.weiß { box-shadow: inset 0 0 0 1px #888; }
    .annot-swatch.weiß.is-on { box-shadow: inset 0 0 0 1px #888, 0 0 0 2px #111; }
    .annot-sep { width: 1px; height: 28px; background: #3a414c; margin: 0 4px; }
    .annot-stage {
      flex: 1; min-height: 0; position: relative; background: #eef1f5;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    #annotCanvas {
      display: block; max-width: 100%; max-height: 100%;
      width: auto; height: auto; background: transparent;
      touch-action: none; cursor: crosshair;
    }
    .annot-textpop {
      position: absolute; z-index: 2; background: #fff; color: #111;
      border-radius: 10px; padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
      display: none; min-width: min(280px, 80vw);
    }
    .annot-textpop.open { display: block; }
    .annot-textpop input {
      width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line);
      border-radius: 6px; margin-bottom: 8px;
    }
    .annot-textpop .row-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .foto-badge {
      display: inline-block; font-size: 11px; font-weight: 700; color: var(--blue);
      background: var(--blue-light); border-radius: 999px; padding: 1px 8px; margin-left: 6px;
      vertical-align: middle;
    }
    .foto-badge svg {
      width: 11px; height: 11px; fill: currentColor; vertical-align: -1px; margin-right: 3px;
    }
    .foto-badge-druck {
      color: #1a5a3a;
      background: #e5f4eb;
    }
    .btn-restore { margin: 12px 0 0; width: 100%; }
    @media screen and (max-width: 767.98px) {
      .annot-tools { overflow-x: visible; flex-wrap: wrap; row-gap: 6px; }
      .annot-tool, .annot-w, .annot-act { font-size: 12px; padding: 8px 8px; white-space: nowrap; min-height: 40px; }
    }

    /* Tablet landscape (≥768 already uses the two-column default; widen at 900) */
    @media screen and (min-width: 768px) and (min-width: 900px) and (orientation: landscape) {
      .row { grid-template-columns: minmax(260px, 36%) 1fr; padding: 7px 18px; }
      main { padding: 16px max(28px, var(--sar)) calc(80px + var(--sab)) max(28px, var(--sal)); }
      main.tight { padding: 0 0 calc(40px + var(--sab)); }
      .overview-wrap, .fotos-wrap { padding-left: max(28px, var(--sal)); padding-right: max(28px, var(--sar)); }
      .fdetail-body { padding-left: 28px; padding-right: 28px; }
    }

    /* Phone / compact: auto-selected below 768px (e.g. iPhone 17 Pro Max 440×956) */
    @media screen and (max-width: 767.98px) {

    function todayDate() {
      const d = new Date();
      const z = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    }
    function todayAt(hh, mm) {
      return todayDate() + "T" + String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");

    function uid(prefix) {
      return (prefix || "r") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);

    function nowIso() { return new Date().toISOString(); }
    function formatDe(iso) {
      if (!iso) return "–";
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return d.toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" });
    }
    function formatDateDe(ymd) {
      if (!ymd) return "–";
      if (/^\d{4}-\d{2}-\d{2}/.test(ymd)) {
        const [y, m, d] = ymd.slice(0, 10).split("-");
        return d + "." + m + "." + y;
      }

    function defaultValue(field) {
      if (!field) return "";
      const d = field.default;
      if (typeof d === "function") return d();
      if (d === undefined || d === null) {
        if (field.type === "checkbox") return false;
        return "";
      }
      return d;
    }

    function collectFieldMeta(tab) {
      const list = [];
      (tab.fields || []).forEach((f) => {
        if (f.type === "section" || f.type === "extend") return;
        if (f.type === "checkbox-pair") {
          list.push({ ...f.left, type: "checkbox" }, { ...f.right, type: "checkbox" });
        } else if (f.type === "text-checkbox") {
          list.push({ ...f.text, type: "text" }, { ...f.check, type: "checkbox" });
        } else if (f.type === "checkbox-text") {
          list.push({ ...f.check, type: "checkbox" }, { ...f.text, type: "text" });
        } else if (f.type === "checkbox-number") {
          list.push({ ...f.check, type: "checkbox" }, { ...f.number, type: "number" });
        } else {
          list.push(f);
        }
      });
      return list;
    }

    function allFieldMeta() {
      return TABS.flatMap(collectFieldMeta);
    }

    function freshValues() {
      const values = {};
      allFieldMeta().forEach((f) => { values[f.id] = defaultValue(f); });
      return values;
    }

    const ANREDE_OPTIONS = ["", "Herrn", "Frau", "Firma", "Familie", "Eheleute", "Herrn und Frau"];

        startzeit: "",
        endzeit: "",
        notiz: "",
        ausgefArbeiten: "",
        textFolgeauftrag: ""
      };
    }

    function migrateAuftrag(raw) {
      const a = raw && typeof raw === "object" ? raw : {};
      const out = {
        id: a.id || uid("r"),
        createdAt: a.createdAt || nowIso(),
        updatedAt: a.updatedAt || a.createdAt || nowIso(),
        meta: Object.assign(freshMeta(), a.meta || {}),
        values: Object.assign(freshValues(), a.values || {}),
        mitarbeiter: Object.assign(freshMitarbeiter(), a.mitarbeiter || {}),
        photos: Array.isArray(a.photos) ? a.photos.map(migratePhoto) : [],
        photoSortMode: a.photoSortMode === "date" ? "date" : "custom"
      };
      return out;
    }

    function migratePhoto(p) {
      p = p || {};
      return {
        id: p.id || uid("p"),
        name: p.name || "Foto",
        date: (p.date || "").slice(0, 10) || todayDate(),
        addedAt: p.addedAt || nowIso(),
        comment: p.comment || "",

        sortiernummer: p.sortiernummer == null || p.sortiernummer === "" ? 0 : Number(p.sortiernummer),
        druck: p.druck === undefined ? true : !!p.druck,
        annotations: Array.isArray(p.annotations) ? p.annotations : [],
        annotated: !!p.annotated
      };
    }

    function freshAuftrag() {
      return migrateAuftrag({
        id: uid("r"),
        createdAt: nowIso(),
        updatedAt: nowIso(),
        meta: freshMeta(),
        values: freshValues(),
        mitarbeiter: freshMitarbeiter(),
        photos: []
      });

    /* ---------- IndexedDB for photo blobs ---------- */
    let dbPromise = null;
    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            const store = db.createObjectStore(DB_STORE, { keyPath: "key" });
            store.createIndex("auftragId", "auftragId", { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    function photoKey(auftragId, photoId) {
      return auftragId + "::" + photoId;
    }

    async function idbPutPhoto(auftragId, photoId, blob, extra) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(Object.assign({
          key: photoKey(auftragId, photoId),
          auftragId, photoId, blob
        }, extra || {}));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetPhoto(auftragId, photoId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const req = tx.objectStore(DB_STORE).get(photoKey(auftragId, photoId));
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbDeletePhoto(auftragId, photoId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(photoKey(auftragId, photoId));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDeleteAuftragPhotos(auftragId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        const idx = tx.objectStore(DB_STORE).index("auftragId");
        const req = idx.openCursor(IDBKeyRange.only(auftragId));
        req.onsuccess = () => {
          const cursor = req.result;
          if (cursor) { cursor.delete(); cursor.continue(); }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbMergePhoto(auftragId, photoId, patch) {
      const rec = (await idbGetPhoto(auftragId, photoId)) || {
        key: photoKey(auftragId, photoId), auftragId, photoId
      };
      Object.assign(rec, patch);
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(rec);
        tx.oncomplete = () => resolve(rec);
        tx.onerror = () => reject(tx.error);
      });
    }

    function displayBlob(rec) {
      return (rec && rec.annotatedBlob) ? rec.annotatedBlob : (rec && rec.blob);
    }

    const objectUrls = new Set();
    function blobUrl(blob) {
      const u = URL.createObjectURL(blob);
      objectUrls.add(u);
      return u;
    }
    function revokeUrls() {
      objectUrls.forEach((u) => URL.revokeObjectURL(u));
      objectUrls.clear();
    }

    function downscaleFile(file, maxSize, quality) {
      maxSize = maxSize || 1600;
      quality = quality || 0.82;
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxSize || h > maxSize) {
            const scale = maxSize / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => {
            if (!blob) reject(new Error("encode"));
            else resolve({ blob, width: w, height: h });
          }, "image/jpeg", quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
        img.src = url;
      });
    }

    async function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
      });
    }

    function isBerichtFilled(r) {
      const v = (r || current).values || {};
      if (BERICHT_TEXT_FIELDS.some((k) => String(v[k] || "").trim())) return true;
      return allFieldMeta().some((f) => {
        if (f.type !== "checkbox") return false;
        const def = defaultValue(f);
        return !!v[f.id] && !def;
      });

    function isMitarbeiterFilled(r) {
      const m = (r || current).mitarbeiter || {};
      return !!(m.startzeit && m.endzeit);
    }

    function photoHasComment(p) {
      return !!(p && String(p.comment || "").trim());
    }

    function photoNeedsComment(p) {
      return !!(p && p.druck && !photoHasComment(p));
    }

    function fotosStatus(r) {
      const photos = (r || current).photos || [];
      if (!photos.length) return "neutral";
      if (photos.some(photoNeedsComment)) return "missing";
      return "ok";
    }

    function isFotosFilled(r) {
      return fotosStatus(r) === "ok";
    }

    function updateCommentHint(focusIfNeeded) {
      const p = getPhoto(activePhotoId);
      const needs = photoNeedsComment(p);
      const comment = document.getElementById("photoComment");
      const hint = document.getElementById("commentHint");
      if (comment) comment.classList.toggle("is-invalid", needs);
      if (hint) hint.classList.toggle("show", needs);
      if (needs && focusIfNeeded && comment) comment.focus();
      return needs;
    }

    function getPhoto(id) {
      return (current.photos || []).find((p) => p.id === id) || null;
    }

    function orderedPhotos() {
      const list = (current.photos || []).slice();
      list.sort((a, b) => {
        const sa = Number(a.sortiernummer) || 0;
        const sb = Number(b.sortiernummer) || 0;
        if (sa !== sb) return sa - sb;
        return String(a.addedAt || "").localeCompare(String(b.addedAt || ""));
      });
      return list;
    }

    function photosByDate() {
      const list = (current.photos || []).slice();
      list.sort((a, b) => {
        const da = a.date || "";
        const db = b.date || "";
        if (da !== db) return da.localeCompare(db);
        return String(a.addedAt || "").localeCompare(String(b.addedAt || ""));
      });
      return list;
    }

    function sortedPhotos() {
      return photoSortMode === "date" ? photosByDate() : orderedPhotos();
    }

    function applyPhotoOrder(list, mode) {
      const ordered = list.slice();
      ordered.forEach((p, i) => { p.sortiernummer = i + 1; });
      current.photos = ordered;
      if (mode) photoSortMode = mode;
      current.photoSortMode = photoSortMode;
      persistCurrent();
    }

    function ensurePhotoOrder() {
      const list = orderedPhotos();
      const messy = list.some((p, i) => Number(p.sortiernummer) !== i + 1);
      if (messy) applyPhotoOrder(list, photoSortMode === "date" ? "date" : "custom");
    }

    function nextSortNumber() {
      return (current.photos || []).length + 1;
    }

    function movePhotoBy(id, delta) {
      const list = orderedPhotos();
      const i = list.findIndex((p) => p.id === id);
      if (i < 0) return;
      const j = i + delta;
      if (j < 0 || j >= list.length) return;
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
      applyPhotoOrder(list, "custom");
      renderApp();
    }

    function movePhotoToPosition(id, pos) {
      const list = orderedPhotos();
      const i = list.findIndex((p) => p.id === id);
      if (i < 0) return;
      const item = list.splice(i, 1)[0];
      const n = list.length + 1;
      let target = parseInt(pos, 10);
      if (!isFinite(target) || target < 1) target = n;
      if (target > n) target = n;
      list.splice(target - 1, 0, item);
      applyPhotoOrder(list, "custom");
    }

    /* ---------- Render fields (Bericht) ---------- */
    function inputHtml(f) {
      const val = current.values[f.id];
      const ph = f.placeholder ? ` placeholder="${attr(f.placeholder)}"` : "";
      if (f.type === "textarea") {
        return `<textarea id="f-${f.id}" data-id="${f.id}"${ph}>${escapeHtml(val)}</textarea>`;
      }
      if (f.type === "checkbox") {
        return `<input type="checkbox" id="f-${f.id}" data-id="${f.id}" ${val ? "checked" : ""} />`;
      }
      if (f.type === "decimal") {
        return `<input type="text" inputmode="decimal" id="f-${f.id}" data-id="${f.id}" value="${attr(val)}"${ph} />`;
      }
      if (f.type === "select") {
        const opts = (f.options || []).map((o) => {
          const sel = String(val) === String(o) ? " selected" : "";
          return `<option value="${attr(o)}"${sel}>${escapeHtml(o)}</option>`;
        }).join("");
        return `<select id="f-${f.id}" data-id="${f.id}">${opts}</select>`;
      }
      const typ = f.type === "number" ? "number" : f.type;
      const step = typ === "number" ? ' step="1" min="0"' : "";
      return `<input type="${typ}" id="f-${f.id}" data-id="${f.id}" value="${attr(val)}"${ph}${step} />`;
    }

    function renderBerichtPanels(container) {

        t.fields.forEach((f) => {
          if (f.type === "section") {
            closeCard();
            chunks.push(`<div class="section"><div class="section-title">${escapeHtml(f.title)}</div></div>`);

          if (f.type === "extend") {
            closeCard();
            chunks.push(`<p class="extend-note">Weitere Felder können hier später ergänzt werden.</p>`);

          }
          openCard();
          if (f.type === "textarea") {
            chunks.push(`<div class="row label-top"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);
          } else if (f.type === "checkbox") {
            chunks.push(`<div class="row check"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);
          } else if (f.type === "checkbox-pair") {
            chunks.push(`<div class="row pair">
              <label class="lbl" for="f-${f.left.id}">${escapeHtml(f.left.label)}</label>
              ${inputHtml({ ...f.left, type: "checkbox" })}
              <label class="lbl right-lbl" for="f-${f.right.id}">${escapeHtml(f.right.label)}</label>
              ${inputHtml({ ...f.right, type: "checkbox" })}

          } else if (f.type === "text-checkbox") {
            chunks.push(`<div class="row pair mixed">
              <label class="lbl" for="f-${f.text.id}">${escapeHtml(f.text.label)}</label>
              ${inputHtml({ ...f.text, type: "text" })}

              ${inputHtml({ ...f.check, type: "checkbox" })}
            </div>`);
          } else if (f.type === "checkbox-text") {
            chunks.push(`<div class="row pair mixed">
              <label class="lbl" for="f-${f.check.id}">${escapeHtml(f.check.label)}</label>
              ${inputHtml({ ...f.check, type: "checkbox" })}

          } else if (f.type === "checkbox-number") {

              <label class="lbl" for="f-${f.check.id}">${escapeHtml(f.check.label)}</label>
              ${inputHtml({ ...f.check, type: "checkbox" })}

            chunks.push(`<div class="row"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);

        });
        closeCard();
        return `<section class="panel${t.id === activeTab ? " active" : ""}" id="panel-${t.id}" role="tabpanel">${chunks.join("")}</section>`;
      }).join("");
      container.querySelectorAll("[data-id]").forEach((el) => {
        const id = el.getAttribute("data-id");
        const ev = (el.type === "checkbox" || el.tagName === "SELECT") ? "change" : "input";
        el.addEventListener(ev, () => {
          current.values[id] = el.type === "checkbox" ? el.checked : el.value;

    /* Schutz gegen Doppel-Tipp (z. B. Fernzugriff/Zoom-Geste): ein zweiter Klick
       innerhalb kurzer Zeit würde den Schalter sofort wieder zurücksetzen. */
    function druckTapAccepted(el, e) {
      if (e && e.detail > 1) return false;
      const now = Date.now();
      const last = Number(el.dataset.lastToggle || 0);
      if (now - last < 450) return false;
      el.dataset.lastToggle = String(now);
      return true;
    }

    function fotoDruckBtnHtml(p) {
      const on = !!p.druck;
      return `<button type="button" class="foto-druck-btn" data-druck-toggle="${p.id}" role="switch" aria-checked="${on ? "true" : "false"}" title="Druck auf Leckortungsbericht" aria-label="Druck auf Leckortungsbericht">${ICO.printer}<span>Druck</span><span class="fd-state">${on ? "an" : "aus"}</span></button>`;
    }

    function toggleDruckInList(btn) {
      const id = btn.getAttribute("data-druck-toggle");
      const p = getPhoto(id);
      if (!p) return;
      p.druck = !p.druck;
      persistCurrent();
      const item = btn.closest(".foto-item");
      if (item) {
        const tmp = document.createElement("div");
        tmp.innerHTML = fotoItemHtml(p, Number(item.getAttribute("data-index")) || 0, (current.photos || []).length);
        const fresh = tmp.firstElementChild;
        const thumb = item.querySelector("[data-thumb]");
        const freshThumb = fresh.querySelector("[data-thumb]");
        if (thumb && freshThumb) freshThumb.replaceWith(thumb);
        item.replaceWith(fresh);
        bindFotoItem(fresh);
        const nb = fresh.querySelector("[data-druck-toggle]");
        if (nb) { nb.dataset.lastToggle = btn.dataset.lastToggle || ""; nb.focus({ preventScroll: true }); }
      }
      renderTabs();
      if (photoNeedsComment(p)) toast("Druck an – bitte noch einen Kommentar ergänzen.", true);
    }

    function bindFotoItem(el, skipDrag) {

        if (e.target.closest("[data-del-photo], [data-drag-handle], [data-move-up], [data-move-down], .foto-move, [data-druck-toggle]")) return;
        if (el.dataset.didDrag === "1") { el.dataset.didDrag = ""; return; }
        openPhotoDetail(el.getAttribute("data-open-photo"), false);
      });
      el.addEventListener("keydown", (e) => {
        if (e.target !== el) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openPhotoDetail(el.getAttribute("data-open-photo"), false);
        }
      });
      el.querySelectorAll("[data-del-photo]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          deletePhoto(b.getAttribute("data-del-photo"));
        });
      });
      el.querySelectorAll("[data-move-up]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          movePhotoBy(b.getAttribute("data-move-up"), -1);
        });
      });
      el.querySelectorAll("[data-move-down]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          movePhotoBy(b.getAttribute("data-move-down"), 1);
        });
      });
      el.querySelectorAll("[data-druck-toggle]").forEach((b) => {
        b.addEventListener("pointerdown", (e) => e.stopPropagation());
        b.addEventListener("dblclick", (e) => { e.preventDefault(); e.stopPropagation(); });

          e.preventDefault(); e.stopPropagation();

          toggleDruckInList(b);

    /* Pointer-Events drag & drop (mouse + touch), handle only so list scroll stays intact */
    let fotoDrag = null;
    let fotoDragScrollRaf = 0;

    function bindFotoDrag() {
      const list = document.getElementById("fotoList");
      if (!list) return;
      list.querySelectorAll("[data-drag-handle]").forEach((handle) => {
        handle.addEventListener("pointerdown", onFotoPointerDown);
      });
    }

    function onFotoPointerDown(e) {
      if (e.button != null && e.button !== 0) return;
      const handle = e.currentTarget;
      const item = handle.closest(".foto-item");
      const list = document.getElementById("fotoList");
      if (!item || !list) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = item.getBoundingClientRect();
      const ghost = item.cloneNode(true);
      ghost.classList.add("foto-ghost");
      ghost.removeAttribute("data-open-photo");
      ghost.style.width = rect.width + "px";
      ghost.style.left = rect.left + "px";
      ghost.style.top = rect.top + "px";
      document.body.appendChild(ghost);
      item.classList.add("is-placeholder");
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      fotoDrag = {
        item: item,
        list: list,
        ghost: ghost,
        pointerId: e.pointerId,
        offsetY: e.clientY - rect.top,
        lastY: e.clientY,
        moved: false,
        fromIndex: Number(item.getAttribute("data-index")) || 0
      };
      stopFotoAutoScroll();
      document.addEventListener("pointermove", onFotoPointerMove);
      document.addEventListener("pointerup", onFotoPointerUp);
      document.addEventListener("pointercancel", onFotoPointerUp);
    }

    function fotoRowAtPoint(clientY) {
      const rows = [...document.querySelectorAll("#fotoList > .foto-item")];
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (clientY < mid) return { row: rows[i], index: i, before: true };
      }
      if (!rows.length) return null;
      return { row: rows[rows.length - 1], index: rows.length - 1, before: false };
    }

    function onFotoPointerMove(e) {
      if (!fotoDrag) return;
      if (fotoDrag.pointerId != null && e.pointerId !== fotoDrag.pointerId) return;
      e.preventDefault();
      const y = e.clientY;
      if (Math.abs(y - fotoDrag.lastY) > 2) fotoDrag.moved = true;
      fotoDrag.lastY = y;
      const gh = fotoDrag.ghost.getBoundingClientRect().height;
      let top = y - fotoDrag.offsetY;
      fotoDrag.ghost.style.top = top + "px";
      const hit = fotoRowAtPoint(y);
      if (hit && hit.row !== fotoDrag.item) {
        if (hit.before) hit.row.parentNode.insertBefore(fotoDrag.item, hit.row);
        else hit.row.parentNode.appendChild(fotoDrag.item);
      }
      maybeFotoAutoScroll(y);
    }

    function maybeFotoAutoScroll(clientY) {
      const scroller = document.getElementById("main");
      if (!scroller) return;
      const r = scroller.getBoundingClientRect();
      const edge = 56;
      let dir = 0;
      if (clientY < r.top + edge) dir = -1;
      else if (clientY > r.bottom - edge) dir = 1;
      fotoDrag.scrollDir = dir;
      if (dir && !fotoDragScrollRaf) {
        const step = () => {
          if (!fotoDrag || !fotoDrag.scrollDir) { fotoDragScrollRaf = 0; return; }
          scroller.scrollTop += fotoDrag.scrollDir * 14;
          fotoDragScrollRaf = requestAnimationFrame(step);
        };
        fotoDragScrollRaf = requestAnimationFrame(step);
      }
      if (!dir) stopFotoAutoScroll();
    }

    function stopFotoAutoScroll() {
      if (fotoDragScrollRaf) cancelAnimationFrame(fotoDragScrollRaf);
      fotoDragScrollRaf = 0;
      if (fotoDrag) fotoDrag.scrollDir = 0;
    }

    function onFotoPointerUp(e) {
      if (!fotoDrag) return;
      if (e && fotoDrag.pointerId != null && e.pointerId !== fotoDrag.pointerId) return;
      document.removeEventListener("pointermove", onFotoPointerMove);
      document.removeEventListener("pointerup", onFotoPointerUp);
      document.removeEventListener("pointercancel", onFotoPointerUp);
      stopFotoAutoScroll();
      const list = fotoDrag.list;
      const item = fotoDrag.item;
      const moved = fotoDrag.moved;
      if (fotoDrag.ghost && fotoDrag.ghost.parentNode) fotoDrag.ghost.parentNode.removeChild(fotoDrag.ghost);
      item.classList.remove("is-placeholder");
      if (moved) item.dataset.didDrag = "1";
      const ids = [...list.querySelectorAll(".foto-item[data-open-photo]")].map((el) => el.getAttribute("data-open-photo"));
      fotoDrag = null;
      if (moved && ids.length) {
        const byId = {};
        (current.photos || []).forEach((p) => { byId[p.id] = p; });
        const ordered = ids.map((id) => byId[id]).filter(Boolean);
        if (ordered.length === (current.photos || []).length) {
          applyPhotoOrder(ordered, "custom");
          renderApp();
          toast("Reihenfolge gespeichert");

      }
    }

    function saveToList(silent) {

    function auftragContentEquals(a, b) {
      const strip = (r) => JSON.stringify({
        meta: r && r.meta || {},
        values: r && r.values || {},
        mitarbeiter: r && r.mitarbeiter || {},
        photos: (r && r.photos || []).map((p) => p.id)
      });
      return strip(a) === strip(b);
    }
    function isPristineAuftrag(r) {
      if (!r) return true;
      if (r.photos && r.photos.length) return false;
      const fresh = freshAuftrag();
      return auftragContentEquals(r, fresh);
    }
    function syncCurrentIntoList() {
      if (view === "fotodetail") readPhotoDetailIntoModel();
      persistCurrent();
      const idx = reports.findIndex((r) => r.id === current.id);
      if (idx >= 0) {
        reports[idx] = JSON.parse(JSON.stringify(current));
        return;
      }
      if (!isPristineAuftrag(current)) {
        reports.unshift(JSON.parse(JSON.stringify(current)));
      }
    }
    function sortReportsNewestFirst() {
      reports.sort((a, b) => {
        const ca = Date.parse(a.createdAt || a.updatedAt || 0) || 0;
        const cb = Date.parse(b.createdAt || b.updatedAt || 0) || 0;
        if (cb !== ca) return cb - ca;
        const ua = Date.parse(a.updatedAt || 0) || 0;
        const ub = Date.parse(b.updatedAt || 0) || 0;
        if (ub !== ua) return ub - ua;
        return String(b.id || "").localeCompare(String(a.id || ""));
      });
    }
    function newAuftrag() {
      syncCurrentIntoList();
      current = freshAuftrag();
      photoSortMode = "custom";

      persistCurrent();

    /* Offline: register ./sw.js only (no blob fallback — it can pin stale versions) */
    function setupServiceWorker() {
      if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
      try {
        if (sessionStorage.getItem("leckortung.updated") === "1") {
          sessionStorage.removeItem("leckortung.updated");
          setTimeout(() => toast("Neue Version geladen"), 300);
        }
      } catch (e) {}
      const refreshOnce = () => {
        try {
          if (sessionStorage.getItem("leckortung.swReloading") === "1") return;
          sessionStorage.setItem("leckortung.swReloading", "1");
          sessionStorage.setItem("leckortung.updated", "1");
        } catch (e) {}
        location.reload();
      };
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        try {
          if (sessionStorage.getItem("leckortung.swReloading") === "1") {
            sessionStorage.removeItem("leckortung.swReloading");
            return;
          }
        } catch (e) {}
        refreshOnce();
      });
      const checkUpdate = (reg) => {
        if (reg && reg.update) reg.update().catch(() => {});
      };
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((reg) => {
        checkUpdate(reg);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkUpdate(reg);
        });
        window.addEventListener("focus", () => checkUpdate(reg));
        if (reg.waiting) {
          try { reg.waiting.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
        }
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              try { nw.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
            }
          });
        });
      }).catch((err) => console.warn("Service Worker nicht registriert", err));
    }
    setupServiceWorker();

    const ANNOT_COLORS = [

      { id: "thick", label: "dick" }
    ];
    const ANNOT_TOOLS = [
      { id: "freehand", label: "Freihand" },
      { id: "arrow", label: "Pfeil" },
      { id: "ellipse", label: "Ellipse" },
      { id: "rect", label: "Rechteck" },

      { id: "text", label: "Text" }
    ];

    const annot = {
      open: false,
      photoId: null,
      img: null,
      shapes: [],
      history: [],
      historyIndex: -1,
      tool: "freehand",
      color: "rot",
      width: "mid",
      draft: null,
      drawing: false,
      dirty: false,
      dpr: 1,
      scale: 1,
      ox: 0,
      oy: 0,
      cssW: 0,
      cssH: 0,
      imgW: 0,
      imgH: 0,
      pointerId: null
    };

    function annotColorHex(id) {
      const c = ANNOT_COLORS.find((x) => x.id === id);
      return c ? c.hex : "#e23c2f";
    }

    function annotStrokePx(widthToken, imgW, imgH) {
      const w = imgW || annot.imgW || 1600;
      const h = imgH || annot.imgH || 1200;
      const base = Math.max(w, h) / 800;
      const mul = widthToken === "thin" ? 2 : widthToken === "thick" ? 9 : 4.5;
      return Math.max(1, mul * base);
    }

    function annotFontPx(widthToken, imgW, imgH) {
      return annotStrokePx(widthToken, imgW, imgH) * 6.5;
    }

    function drawAnnotShape(ctx, s, imgW, imgH) {
      const hex = annotColorHex(s.color);
      const lw = annotStrokePx(s.width, imgW, imgH);
      ctx.save();
      ctx.strokeStyle = hex;
      ctx.fillStyle = hex;
      ctx.lineWidth = lw;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (s.color === "weiß") {
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = lw * 1.2;
      }
      if (s.type === "freehand") {
        const pts = s.points || [];
        if (pts.length === 1) {
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, lw / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (pts.length > 1) {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      } else if (s.type === "line" || s.type === "arrow") {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        if (s.type === "arrow") {
          const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          const head = Math.max(10, lw * 4);
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - head * Math.cos(ang - 0.4), s.y2 - head * Math.sin(ang - 0.4));
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - head * Math.cos(ang + 0.4), s.y2 - head * Math.sin(ang + 0.4));
          ctx.stroke();
        }
      } else if (s.type === "rect") {
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      } else if (s.type === "ellipse") {
        const rx = Math.abs(s.w) / 2, ry = Math.abs(s.h) / 2;
        const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(rx, 0.5), Math.max(ry, 0.5), 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (s.type === "text" && s.text) {
        const size = annotFontPx(s.width, imgW, imgH);
        ctx.font = "bold " + size + "px Arial, sans-serif";
        ctx.textBaseline = "top";
        ctx.fillText(s.text, s.x, s.y);
      }
      ctx.restore();
    }

    function annotPtr(e) {
      const canvas = document.getElementById("annotCanvas");
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left - annot.ox) / annot.scale,
        y: (e.clientY - r.top - annot.oy) / annot.scale
      };
    }

    function annotRedraw() {
      const canvas = document.getElementById("annotCanvas");
      if (!canvas || !annot.img) return;
      const ctx = canvas.getContext("2d");
      const dpr = annot.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sw = canvas.width / dpr, sh = canvas.height / dpr;
      ctx.clearRect(0, 0, sw, sh);
      ctx.drawImage(annot.img, annot.ox, annot.oy, annot.cssW, annot.cssH);
      ctx.save();
      ctx.translate(annot.ox, annot.oy);
      ctx.scale(annot.scale, annot.scale);
      annot.shapes.forEach((s) => drawAnnotShape(ctx, s, annot.imgW, annot.imgH));
      if (annot.draft) drawAnnotShape(ctx, annot.draft, annot.imgW, annot.imgH);
      ctx.restore();
    }

    function annotLayout() {
      const stage = document.getElementById("annotStage");
      const canvas = document.getElementById("annotCanvas");
      if (!stage || !canvas || !annot.img) return;
      const availW = Math.max(1, stage.clientWidth);
      const availH = Math.max(1, stage.clientHeight);
      const scale = Math.min(availW / annot.imgW, availH / annot.imgH);
      annot.scale = scale;
      annot.cssW = annot.imgW * scale;
      annot.cssH = annot.imgH * scale;
      annot.ox = 0;
      annot.oy = 0;
      annot.dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.style.width = Math.max(1, annot.cssW) + "px";
      canvas.style.height = Math.max(1, annot.cssH) + "px";
      canvas.width = Math.round(Math.max(1, annot.cssW) * annot.dpr);
      canvas.height = Math.round(Math.max(1, annot.cssH) * annot.dpr);
      annotRedraw();
    }

    function annotPushHistory() {
      annot.history = annot.history.slice(0, annot.historyIndex + 1);
      annot.history.push(JSON.parse(JSON.stringify(annot.shapes)));
      if (annot.history.length > 60) {
        annot.history.shift();

      annot.historyIndex = annot.history.length - 1;
      annot.dirty = true;
      annotUpdateButtons();

    function annotUndo() {
      if (annot.historyIndex <= 0) return;
      annot.historyIndex -= 1;
      annot.shapes = JSON.parse(JSON.stringify(annot.history[annot.historyIndex]));
      annot.dirty = true;
      annotUpdateButtons();
      annotRedraw();
    }

    function annotRedo() {
      if (annot.historyIndex >= annot.history.length - 1) return;
      annot.historyIndex += 1;
      annot.shapes = JSON.parse(JSON.stringify(annot.history[annot.historyIndex]));
      annot.dirty = true;
      annotUpdateButtons();
      annotRedraw();
    }

    function annotClear() {
      if (!annot.shapes.length) return;
      if (!confirm("Alle Markierungen auf diesem Bild löschen?")) return;
      annot.shapes = [];
      annotPushHistory();
      annotRedraw();
