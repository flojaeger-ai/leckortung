    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && sigSaveTimer) sigPersist(); });
    function sigSyncOwner() {
      if (sigStore.owner !== current.id) {
        if (sigStore.owner && sigSaveTimer) sigPersist();
        sigStore.ma = []; sigStore.kunde = [];
        sigStore.maAspect = SIG_PAD_ASPECT; sigStore.kundeAspect = SIG_PAD_ASPECT;
        sigStore.owner = current.id;
        sigLoadFor(current.id);
      }
    }
    async function sigEnsure() { sigSyncOwner(); await sigLoadPromise; }
    function sigPresent(k) { sigSyncOwner(); return sigStore[k].length > 0; }
    function sigBothPresent() { return sigPresent("ma") && sigPresent("kunde"); }

    function renderUnterschrift() {
      sigSyncOwner();
      const isK = sigTab === "kunde";
      const m = current.mitarbeiter || {};
      const meta = current.meta || {};
      const nameId = isK ? "sigNameKunde" : "sigNameMa";
      const namePh = isK ? ([meta.anrede, meta.kunde].filter(Boolean).join(" ") || "Name des Kunden") : ((current.values && current.values.messtechniker) || "Name des Monteurs");

        </div>

          <div class="sig-area"><canvas id="sigCanvas" aria-label="Unterschriftsfeld"></canvas><span class="sig-x" aria-hidden="true">X</span></div>

            ${isK ? `<div class="sig-mailrow"><label for="mit-kundeEmail">E-Mail</label><input type="email" class="sig-input" data-mit="kundeEmail" id="mit-kundeEmail" value="${attr(m.kundeEmail || "")}" placeholder="E-Mail-Adresse nicht vorhanden" /></div>` : ""}

    function bindSigPad() {
      const canvas = document.getElementById("sigCanvas");
      if (!canvas) return;
      const key = sigTab;
      const ctx = canvas.getContext("2d");
      function size() {
        const parent = canvas.parentElement;
        const r = (parent || canvas).getBoundingClientRect();
        const cssW = Math.max(1, r.width), cssH = Math.max(1, r.height);
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = cssW + "px";
        canvas.style.height = cssH + "px";
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));

      }

        ctx.lineCap = "round"; ctx.lineJoin = "round";
        sigStore[key].forEach((st) => {
          if (!st.length) return;
          ctx.beginPath();
          st.forEach((pt, i) => { const x = pt[0] * canvas.width, y = pt[1] * canvas.height; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
          if (st.length === 1) ctx.lineTo(st[0][0] * canvas.width + 0.01, st[0][1] * canvas.height);
          ctx.stroke();
        });

      let cur = null;
      const pt = (e) => {
        const r = canvas.getBoundingClientRect();
        return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
      };

        e.preventDefault();

        sigStore[key].push(cur);
        redraw();
      });

        if (!cur) return;
        e.preventDefault();

      });

      canvas.addEventListener("pointerup", done);
      canvas.addEventListener("pointercancel", done);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      window.addEventListener("resize", () => { if (document.getElementById("sigCanvas") === canvas) size(); });
      main.querySelectorAll("[data-sigtab]").forEach((b) => b.addEventListener("click", () => {
        sigTab = b.getAttribute("data-sigtab");
        renderMain();
      }));
      const fsBtn = document.getElementById("btnSigFs");
      if (fsBtn) fsBtn.addEventListener("click", openSigFullscreen);
    }

    /* ----- v34/v35: Unterschrift im Vollbild. Seitenverhältnis wird festgehalten (Letterbox),
       damit z. B. das Ein-/Ausblenden der iOS-Adressleiste die Unterschrift nicht in die Höhe zieht.
       Beim Übernehmen: zuschneiden, einpassen (contain) ins Feld 88/38, danach so speichern. */
    let sigFsStrokes = [];

    function sigMeasureAspect(el) {

      if (el.clientWidth > 8 && el.clientHeight > 8) return el.clientWidth / el.clientHeight;

    }
    function sigDeep(strokes) { return (strokes || []).map((st) => st.map((p) => [p[0], p[1]])); }

    function sigMapStrokes(strokes, srcAspect, dstAspect) {
      const srcA = (srcAspect > 0.05) ? srcAspect : SIG_PAD_ASPECT;

      list.forEach((st) => st.forEach((p) => {
        const x = p[0] * srcA, y = p[1];
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }));
      const bw = Math.max(maxX - minX, 0.04 * srcA);
      const bh = Math.max(maxY - minY, 0.04);

        Math.min(1, Math.max(0, ((p[0] * srcA - cx) * scale + dstA / 2) / dstA)),
        Math.min(1, Math.max(0, (p[1] - cy) * scale + 0.5))

        st.forEach((pt, i) => { const x = pt[0] * canvas.width, y = pt[1] * canvas.height; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        if (st.length === 1) ctx.lineTo(st[0][0] * canvas.width + 0.01, st[0][1] * canvas.height);

        return [Math.min(1, Math.max(0, (e.clientX - r.left) / w)), Math.min(1, Math.max(0, (e.clientY - r.top) / h))];

        if (!cur) return;
        e.preventDefault();

      });

      canvas.addEventListener("pointercancel", done);
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    }
    function sigFsEl() {
      let o = document.getElementById("sigFs");

      o.className = "sig-fs";
      o.setAttribute("role", "dialog");
      o.setAttribute("aria-modal", "true");
      o.setAttribute("aria-labelledby", "sigFsTitle");

          <div class="sig-fs-title" id="sigFsTitle">Unterschrift im Vollbild</div>
          <button type="button" class="btn" id="sigFsClear">Löschen</button>
          <button type="button" class="btn" id="sigFsCancel">Abbrechen</button>
          <button type="button" class="btn primary" id="sigFsOk">Übernehmen</button>
        </div>
        <p class="sig-fs-hint" id="sigFsHint">Für mehr Platz das Gerät quer halten.</p>
        <div class="sig-fs-stage" id="sigFsStage">
          <div class="sig-fs-surface" id="sigFsSurface">

            <span class="sig-x" aria-hidden="true">X</span>
          </div>
        </div>`;
      document.body.appendChild(o);

      o.addEventListener("gesturestart", stop, { passive: false });
      o.addEventListener("gesturechange", stop, { passive: false });

      o.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); closeSigFullscreen(false); } });
      const fit = () => {
        if (!sigFsOpen) return;
        const vv = window.visualViewport;
        if (vv) { o.style.left = vv.offsetLeft + "px"; o.style.top = vv.offsetTop + "px"; o.style.width = vv.width + "px"; o.style.height = vv.height + "px"; }
        else { o.style.left = "0px"; o.style.top = "0px"; o.style.width = "100vw"; o.style.height = (window.innerHeight ? window.innerHeight + "px" : "100dvh"); }
        const hint = document.getElementById("sigFsHint");
        if (hint) {
          let portrait = false;
          try { portrait = window.matchMedia("(orientation: portrait)").matches && Math.min(window.innerWidth, (vv && vv.width) || window.innerWidth) < 900; } catch (e) {}
          hint.hidden = !portrait;
        }
        sigFsLayoutSurface();
      };
      o.__fit = fit;
      if (window.visualViewport) { window.visualViewport.addEventListener("resize", fit); window.visualViewport.addEventListener("scroll", fit); }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", () => setTimeout(fit, 250));
      document.addEventListener("fullscreenchange", () => { if (sigFsOpen) fit(); });
      document.addEventListener("webkitfullscreenchange", () => { if (sigFsOpen) fit(); });
      return o;
    }
    function sigFsLayoutSurface() {
      const stage = document.getElementById("sigFsStage");
      const surface = document.getElementById("sigFsSurface");
      const c = document.getElementById("sigFsCanvas");
      if (!stage || !surface || !c) return;
      const sr = stage.getBoundingClientRect();
      const sw = Math.max(1, sr.width), sh = Math.max(1, sr.height);
      const stageA = sw / sh;
      if (sigFsLockW && sigFsLockH) {
        const rotated = (sw > sh) !== (sigFsLockW > sigFsLockH);
        if (rotated) {
          const newA = stageA;
          if (sigFsStrokes.length && sigFsLockAspect) sigFsStrokes = sigMapStrokes(sigFsStrokes, sigFsLockAspect, newA);
          sigFsLockAspect = newA;
        }
      }
      if (!sigFsLockAspect || sigFsLockAspect < 0.05) sigFsLockAspect = stageA;
      sigFsLockW = sw; sigFsLockH = sh;
      const A = sigFsLockAspect;
      let w, h;
      if (stageA > A) { h = sh; w = h * A; } else { w = sw; h = w / A; }
      surface.style.left = ((sw - w) / 2) + "px";
      surface.style.top = ((sh - h) / 2) + "px";
      surface.style.width = w + "px";
      surface.style.height = h + "px";
      const dpr = window.devicePixelRatio || 1;
      c.style.width = w + "px";
      c.style.height = h + "px";
      c.width = Math.max(1, Math.round(w * dpr));
      c.height = Math.max(1, Math.round(h * dpr));
      sigDrawStrokes(c.getContext("2d"), c, sigFsStrokes);
    }
    async function openSigFullscreen() {
      sigSyncOwner();
      const o = sigFsEl();
      sigFsOpen = true;
      sigFsLockAspect = null;
      sigFsLockW = 0; sigFsLockH = 0;
      document.body.classList.add("sig-fs-open");
      o.classList.add("open");
      const title = document.getElementById("sigFsTitle");
      if (title) title.textContent = (sigTab === "kunde" ? "Unterschrift des Kunden" : "Unterschrift des Monteurs") + " – Vollbild";
      o.__fit();
      const stage = document.getElementById("sigFsStage");
      const sr = stage ? stage.getBoundingClientRect() : { width: 1, height: 1 };
      sigFsLockAspect = (sr.width > 8 && sr.height > 8) ? sr.width / sr.height : SIG_PAD_ASPECT;
      const srcA = sigStore[sigTab + "Aspect"] || SIG_PAD_ASPECT;
      sigFsStrokes = sigStore[sigTab].length ? sigMapStrokes(sigStore[sigTab], srcA, sigFsLockAspect) : [];
      o.__fit();
      const dest = document.getElementById("sigFsCanvas");
      if (dest && !dest.__bound) { sigBindDraw(dest, () => sigFsStrokes, null); dest.__bound = true; }
      try { o.focus(); } catch (e) {}
      sigFsUsedNative = false;
      const fn = o.requestFullscreen || o.webkitRequestFullscreen;
      if (fn) {
        try {
          const p = fn.call(o, { navigationUI: "hide" });
          if (p && p.then) await p;
          sigFsUsedNative = !!(document.fullscreenElement || document.webkitFullscreenElement);
        } catch (e) { sigFsUsedNative = false; }
      }
      o.__fit();
    }
    function closeSigFullscreen(accept) {
      if (!sigFsOpen) return;
      if (accept) {
        sigSyncOwner();
        const srcA = (sigFsLockAspect && sigFsLockAspect > 0.05) ? sigFsLockAspect : sigMeasureAspect(document.getElementById("sigFsCanvas"));
        sigStore[sigTab] = sigMapStrokes(sigFsStrokes, srcA, SIG_PAD_ASPECT);
        sigStore[sigTab + "Aspect"] = SIG_PAD_ASPECT;
        sigPersist();
        if (view === "unterschrift") renderMain();
        toast(sigStore[sigTab].length ? "Unterschrift übernommen" : "Unterschrift gelöscht");
      }
      sigFsOpen = false;
      sigFsStrokes = [];
      sigFsLockAspect = null;
      document.body.classList.remove("sig-fs-open");
      const o = document.getElementById("sigFs");
      if (o) o.classList.remove("open");
      try {
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
      } catch (e) {}
    }
    function sigClearCurrent() {
      sigSyncOwner();
      sigStore[sigTab] = [];
      sigStore[sigTab + "Aspect"] = SIG_PAD_ASPECT;
      sigPersist();
      if (view === "unterschrift") renderMain();

    /* ----- Export: drei Dateien + Ergebnis-Fenster ----- */
    function safeFilePart(s) { return String(s || "").trim().replace(/[^\w.\-ÄÖÜäöüß]+/g, "_").replace(/^_+|_+$/g, ""); }
    let docsBusy = false;
    async function erzeugeDokumente() {
      if (docsBusy) return;
      docsBusy = true;
      try {
        if (view === "fotodetail") readPhotoDetailIntoModel();
        persistCurrent();
        await sigEnsure();
        toast("Dokumente werden erzeugt…");
        const meta = current.meta || {};
        const base = safeFilePart(meta.auftragsNr || (current.values && current.values.schadenNr) || (current.values && current.values.datum) || current.id) || "Auftrag";
        const photoImgs = await collectPhotoImages();
        const pdf1 = buildLeckPdf(photoImgs);
        const pdf2 = buildServicePdf({ ma: sigStore.ma, kunde: sigStore.kunde, maAspect: sigStore.maAspect, kundeAspect: sigStore.kundeAspect });
        const docx = buildNotizenDocx();
        const files = [
          new File([pdf1], base + "_Leckortungsbericht.pdf", { type: "application/pdf" }),
          new File([pdf2], base + "_Servicereport.pdf", { type: "application/pdf" }),
          new File([docx], base + "_Notizen.docx", { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" })
        ];
        /* v34: bearbeitete PDF aus dem Editor nur, wenn dort gerade ein Dokument geladen ist (nichts dauerhaft gespeichert) */
        const extra = await pdfEdExportForDocs(base);
        if (extra) files.push(extra);
        showDocsSheet(files, extra ? "Die bearbeitete PDF aus dem PDF-Editor ist enthalten. Der Editor selbst speichert nichts – nach einem Neuladen der Seite ist die Bearbeitung dort weg." : "");
      } catch (err) {
        console.error(err);
        toast("Dokumente konnten nicht erzeugt werden.", true);

        docsBusy = false;
      }
    }

    function fileSizeLabel(f) {
      return f.size > 1048576 ? (f.size / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(f.size / 1024)) + " KB";
    }
    function isCoarse() { try { return window.matchMedia("(pointer: coarse)").matches; } catch (e) { return false; } }
    function closeDocsSheet() {
      const o = document.getElementById("docsOverlay");
      if (o) o.remove();
    }
    /* Teilen/Speichern (v30): Chrome auf Android teilt nur bestimmte Dateitypen (z. B. PDF, Bilder, Text),
       KEINE Word-Dateien (.docx) – navigator.share bricht dann mit NotAllowedError ab. Ebenso, wenn die
       Nutzer-Geste abgelaufen ist. Früher wurde dieser Fehler still geschluckt (es passierte nichts).
       Jetzt: teilbare Dateien teilen, nicht teilbare herunterladen, bei Fehlern sichtbarer Dialog mit
       eigenen Buttons pro Datei (frische Nutzer-Geste). Abbrechen durch den Nutzer bleibt still. */
    const ANDROID_SHARE_EXT = /\.(pdf|png|jpe?g|jfif|pjpe?g|webp|gif|bmp|ico|svgz?|tiff?|txt|text|csv|css|html?|shtml?|mp3|mp4|m4a|m4v|mpe?g|oga|ogg|ogm|ogv|opus|wav|weba|webm|flac|xbm)$/i;
    function isAndroidLike() { return /Android|CrOS/i.test(navigator.userAgent || ""); }
    function preferShare() {
      try {
        if (window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(any-pointer: coarse)").matches) return true;
      } catch (e) {}
      const ua = navigator.userAgent || "";
      return /Android|iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    }
    function canShareList(list) {
      if (!list || !list.length || typeof navigator.share !== "function" || typeof navigator.canShare !== "function") return false;
      try { if (!navigator.canShare({ files: list })) return false; } catch (e) { return false; }
      if (isAndroidLike() && list.some((f) => !ANDROID_SHARE_EXT.test(f.name || ""))) return false;
      return true;
    }
    function shareErrorIsAbort(err) { return !!(err && err.name === "AbortError"); }
    async function saveFiles(files) {
      files = (files || []).filter(Boolean);
      if (!files.length) return;
      if (preferShare()) {
        const shareable = files.filter((f) => canShareList([f]));
        const rest = files.filter((f) => shareable.indexOf(f) < 0);
        if (shareable.length && canShareList(shareable)) {
          let p;
          try { p = navigator.share({ files: shareable }); } catch (err) { p = Promise.reject(err); }
          rest.forEach((f) => downloadBlobFile(f));
          if (rest.length) toast(rest.map((f) => f.name).join(", ") + " wird heruntergeladen (Word-Dateien kann Android nicht teilen).");
          try { await p; } catch (err) {
            if (shareErrorIsAbort(err)) return;
            console.warn("Teilen fehlgeschlagen:", err);
            showSaveFallback(files, "Das Teilen-Menü konnte nicht direkt geöffnet werden. Tippen Sie auf „Teilen“ oder „Herunterladen“.");
          }
          return;
        }
        if (files.length > 1) {
          showSaveFallback(files, "Teilen ist für diese Dateien nicht möglich. Bitte einzeln herunterladen.");
          return;
        }
      }
      for (let i = 0; i < files.length; i++) {
        downloadBlobFile(files[i]);
        if (i < files.length - 1) await new Promise((r) => setTimeout(r, 500));
      }
    }
    function closeSaveFallback() { const o = document.getElementById("saveOverlay"); if (o) o.remove(); }
    function showSaveFallback(files, msg) {
      closeSaveFallback();
      const shareable = files.filter((f) => canShareList([f]));
      const o = document.createElement("div");
      o.className = "choice-overlay open save-overlay";
      o.id = "saveOverlay";
      o.innerHTML = `<div class="choice-dialog docs-dialog" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
        <h3 id="saveTitle">Teilen / Speichern</h3>
        <p>${escapeHtml(msg || "")}</p>
        <div class="docs-list">${files.map((f, i) => `<div class="save-row"><div class="save-name"><span>${escapeHtml(f.name)}</span><small>${fileSizeLabel(f)}</small></div>${shareable.indexOf(f) >= 0 ? `<button type="button" class="btn primary" data-share="${i}">Teilen</button>` : ""}<button type="button" class="btn" data-dl="${i}">Herunterladen</button></div>`).join("")}</div>
        <div class="choice-actions">${shareable.length > 1 && canShareList(shareable) ? `<button type="button" class="btn primary" id="saveShareAll">Alle PDFs teilen (${shareable.length})</button>` : ""}<button type="button" class="btn" id="saveClose">Schließen</button></div>
      </div>`;
      document.body.appendChild(o);
      const doShare = async (list) => {
        try { await navigator.share({ files: list }); } catch (err) {
          if (shareErrorIsAbort(err)) return;
          console.warn("Teilen fehlgeschlagen:", err);
          toast("Teilen nicht möglich – bitte „Herunterladen“ verwenden.", true);
        }
      };
      o.querySelectorAll("[data-share]").forEach((b) => b.addEventListener("click", () => doShare([files[Number(b.getAttribute("data-share"))]])));
      o.querySelectorAll("[data-dl]").forEach((b) => b.addEventListener("click", () => { downloadBlobFile(files[Number(b.getAttribute("data-dl"))]); b.textContent = "Heruntergeladen ✓"; }));
      const all = document.getElementById("saveShareAll");
      if (all) all.addEventListener("click", () => doShare(shareable));
      document.getElementById("saveClose").addEventListener("click", closeSaveFallback);
    }
    /* ---------- PDF-Editor (eigener Ordner pdf-editor/, im iframe; Export über saveFiles) ----------
       Es wird nichts dauerhaft gespeichert (kein localStorage/IndexedDB im eingebetteten Editor):
       Unterschriften werden pro Dokument frisch gezeichnet und nur ins exportierte PDF eingebettet. */
    let pdfEdFrame = null, pdfEdReady = false, pdfEdPending = null;
    function pdfEdDocs() {
      return [{ kind: "lb", label: "Leckortungsbericht dieses Auftrags öffnen" }, { kind: "sr", label: "Servicereport dieses Auftrags öffnen" }];
    }
    function pdfEdPost(msg, transfer) {
      if (pdfEdFrame && pdfEdFrame.contentWindow) pdfEdFrame.contentWindow.postMessage(msg, location.origin, transfer || []);
    }
    async function pdfEdSendDoc(kind) {
      try {
        if (!current) throw new Error("Kein Auftrag");
        if (view === "fotodetail") readPhotoDetailIntoModel();
        persistCurrent();
        await sigEnsure();
        const meta = current.meta || {};
        const base = safeFilePart(meta.auftragsNr || (current.values && current.values.schadenNr) || (current.values && current.values.datum) || current.id) || "Auftrag";
        let bytes, name;
        if (kind === "lb") { bytes = buildLeckPdf(await collectPhotoImages()); name = base + "_Leckortungsbericht.pdf"; }
        else { bytes = buildServicePdf({ ma: sigStore.ma, kunde: sigStore.kunde, maAspect: sigStore.maAspect, kundeAspect: sigStore.kundeAspect }); name = base + "_Servicereport.pdf"; }
        const buf = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
        pdfEdPost({ type: "pdfed-open", name, buffer: buf }, [buf]);
      } catch (err) {
        console.error(err);
        pdfEdPost({ type: "pdfed-error", message: "Dokument konnte nicht erzeugt werden." });
      }
    }
    function openPdfEditor() {
      if (!pdfEdFrame) {
        pdfEdFrame = document.createElement("iframe");
        pdfEdFrame.id = "pdfEditorFrame";
        pdfEdFrame.className = "pdfed-frame";
        pdfEdFrame.title = "PDF bearbeiten";
        pdfEdFrame.setAttribute("allow", "clipboard-write");
        pdfEdFrame.src = "pdf-editor/index.html?v=" + APP_VERSION;
        document.body.appendChild(pdfEdFrame);
        window.addEventListener("message", (e) => {
          if (e.origin !== location.origin || !pdfEdFrame || e.source !== pdfEdFrame.contentWindow || !e.data) return;
          const d = e.data;
          if (d.type === "pdfed-ready") { pdfEdReady = true; pdfEdPost({ type: "pdfed-docs", docs: pdfEdDocs() }); }
          else if (d.type === "pdfed-close") closePdfEditor();
          else if (d.type === "pdfed-fetch") pdfEdSendDoc(d.kind === "sr" ? "sr" : "lb");
          else if (d.type === "pdfed-save" && d.buffer) {
            const name = String(d.name || "Dokument.pdf").replace(/[\\/]/g, "_");
            saveFiles([new File([d.buffer], name, { type: "application/pdf" })]);
          } else if (d.type === "pdfed-state" || d.type === "pdfed-export-result") {
            if (pdfEdPending) { const p = pdfEdPending; pdfEdPending = null; p(d); }
          }
        });
      } else if (pdfEdReady) pdfEdPost({ type: "pdfed-docs", docs: pdfEdDocs() });
      pdfEdFrame.classList.add("open");
      document.body.classList.add("pdfed-open");
    }
    function closePdfEditor() {
      if (pdfEdFrame) pdfEdFrame.classList.remove("open");
      document.body.classList.remove("pdfed-open");
    }
    function pdfEdAsk(type, timeoutMs) {
      return new Promise((resolve) => {
        if (!pdfEdFrame || !pdfEdReady || !pdfEdFrame.contentWindow) { resolve(null); return; }
        const t = setTimeout(() => { if (pdfEdPending === done) pdfEdPending = null; resolve(null); }, timeoutMs || 25000);
        function done(d) { clearTimeout(t); resolve(d); }
        pdfEdPending = done;
        pdfEdPost({ type: type });
      });
    }
    function pdfEdExportFileName(editorName, base) {
      let n = String(editorName || "Dokument.pdf").replace(/[\\/]/g, "_");
      if (!/\.pdf$/i.test(n)) n += ".pdf";
      const stem = n.replace(/\.pdf$/i, "");
      let out = stem;
      if (base && stem.indexOf(base) !== 0) out = base + "_" + stem;
      if (!/_bearbeitet$/i.test(out)) out += "_bearbeitet";
      return out + ".pdf";
    }
    async function pdfEdExportForDocs(base) {
      if (!pdfEdFrame || !pdfEdReady) return null;
      const st = await pdfEdAsk("pdfed-query", 4000);
      if (!st || !st.loaded) return null;
      toast("Bearbeitete PDF aus dem Editor wird übernommen…");
      const res = await pdfEdAsk("pdfed-export", 30000);
      if (!res || res.empty) return null;
      if (res.error || !res.buffer) { toast("Bearbeitete PDF konnte nicht übernommen werden.", true); return null; }
      const name = pdfEdExportFileName(res.name, base);
      return new File([res.buffer], name, { type: "application/pdf" });
    }

    /* Offline: register ./sw.js only (no blob fallback — it can pin stale versions) */
    function setupServiceWorker() {
      if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
      try {
        if (sessionStorage.getItem("leckortung.updated") === "1") {
          sessionStorage.removeItem("leckortung.updated");
          setTimeout(() => toast("Neue Version geladen"), 300);
        }
      } catch (e) {}
      const refreshOnce = () => {
        try {
          if (sessionStorage.getItem("leckortung.swReloading") === "1") return;
          sessionStorage.setItem("leckortung.swReloading", "1");
          sessionStorage.setItem("leckortung.updated", "1");
        } catch (e) {}
        location.reload();
      };
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        try {
          if (sessionStorage.getItem("leckortung.swReloading") === "1") {
            sessionStorage.removeItem("leckortung.swReloading");
            return;
          }
        } catch (e) {}
        refreshOnce();
      });
      const checkUpdate = (reg) => {
        if (reg && reg.update) reg.update().catch(() => {});
      };
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((reg) => {
        checkUpdate(reg);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") checkUpdate(reg);
        });
        window.addEventListener("focus", () => checkUpdate(reg));
        if (reg.waiting) {
          try { reg.waiting.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
        }
        reg.addEventListener("updatefound", () => {
          const nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", () => {
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              try { nw.postMessage({ type: "SKIP_WAITING" }); } catch (e) {}
            }
          });
        });
      }).catch((err) => console.warn("Service Worker nicht registriert", err));
    }
    setupServiceWorker();


    /* ---------- Photo annotation editor ---------- */
    const ANNOT_COLORS = [
      { id: "rot", hex: "#e23c2f", label: "Rot" },
      { id: "gelb", hex: "#f0c400", label: "Gelb" },
      { id: "gruen", hex: "#1f9d55", label: "Grün" },
      { id: "blau", hex: "#1a5fad", label: "Blau" },
      { id: "schwarz", hex: "#111111", label: "Schwarz" },
      { id: "weiß", hex: "#ffffff", label: "Weiß" }
    ];
    const ANNOT_WIDTHS = [
      { id: "thin", label: "dünn" },
      { id: "mid", label: "mittel" },
      { id: "thick", label: "dick" }
    ];
    const ANNOT_TOOLS = [
      { id: "freehand", label: "Freihand" },
      { id: "arrow", label: "Pfeil" },
      { id: "ellipse", label: "Ellipse" },
      { id: "rect", label: "Rechteck" },
      { id: "line", label: "Linie" },
      { id: "text", label: "Text" }
    ];

    const annot = {
      open: false,
      photoId: null,
      img: null,
      shapes: [],
      history: [],
      historyIndex: -1,
      tool: "freehand",
      color: "rot",
      width: "mid",
      draft: null,
      drawing: false,
      dirty: false,
      dpr: 1,
      scale: 1,
      ox: 0,
      oy: 0,
      cssW: 0,
      cssH: 0,
      imgW: 0,
      imgH: 0,
      pointerId: null
    };

    function annotColorHex(id) {
      const c = ANNOT_COLORS.find((x) => x.id === id);
      return c ? c.hex : "#e23c2f";
    }

    function annotStrokePx(widthToken, imgW, imgH) {
      const w = imgW || annot.imgW || 1600;
      const h = imgH || annot.imgH || 1200;
      const base = Math.max(w, h) / 800;
      const mul = widthToken === "thin" ? 2 : widthToken === "thick" ? 9 : 4.5;
      return Math.max(1, mul * base);
    }

    function annotFontPx(widthToken, imgW, imgH) {
      return annotStrokePx(widthToken, imgW, imgH) * 6.5;
    }

    function drawAnnotShape(ctx, s, imgW, imgH) {
      const hex = annotColorHex(s.color);
      const lw = annotStrokePx(s.width, imgW, imgH);
      ctx.save();
      ctx.strokeStyle = hex;
      ctx.fillStyle = hex;
      ctx.lineWidth = lw;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      if (s.color === "weiß") {
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = lw * 1.2;
      }
      if (s.type === "freehand") {
        const pts = s.points || [];
        if (pts.length === 1) {
          ctx.beginPath();
          ctx.arc(pts[0].x, pts[0].y, lw / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (pts.length > 1) {
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      } else if (s.type === "line" || s.type === "arrow") {
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        if (s.type === "arrow") {
          const ang = Math.atan2(s.y2 - s.y1, s.x2 - s.x1);
          const head = Math.max(10, lw * 4);
          ctx.beginPath();
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - head * Math.cos(ang - 0.4), s.y2 - head * Math.sin(ang - 0.4));
          ctx.moveTo(s.x2, s.y2);
          ctx.lineTo(s.x2 - head * Math.cos(ang + 0.4), s.y2 - head * Math.sin(ang + 0.4));
          ctx.stroke();
        }
      } else if (s.type === "rect") {
        ctx.strokeRect(s.x, s.y, s.w, s.h);
      } else if (s.type === "ellipse") {
        const rx = Math.abs(s.w) / 2, ry = Math.abs(s.h) / 2;
        const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
        ctx.beginPath();
        ctx.ellipse(cx, cy, Math.max(rx, 0.5), Math.max(ry, 0.5), 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (s.type === "text" && s.text) {
        const size = annotFontPx(s.width, imgW, imgH);
        ctx.font = "bold " + size + "px Arial, sans-serif";
        ctx.textBaseline = "top";
        ctx.fillText(s.text, s.x, s.y);
      }
      ctx.restore();
    }

    function annotPtr(e) {
      const canvas = document.getElementById("annotCanvas");
      const r = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - r.left - annot.ox) / annot.scale,
        y: (e.clientY - r.top - annot.oy) / annot.scale
      };
    }

    function annotRedraw() {
      const canvas = document.getElementById("annotCanvas");
      if (!canvas || !annot.img) return;
      const ctx = canvas.getContext("2d");
      const dpr = annot.dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const sw = canvas.width / dpr, sh = canvas.height / dpr;
      ctx.clearRect(0, 0, sw, sh);
      ctx.drawImage(annot.img, annot.ox, annot.oy, annot.cssW, annot.cssH);
      ctx.save();
      ctx.translate(annot.ox, annot.oy);
      ctx.scale(annot.scale, annot.scale);
      annot.shapes.forEach((s) => drawAnnotShape(ctx, s, annot.imgW, annot.imgH));
      if (annot.draft) drawAnnotShape(ctx, annot.draft, annot.imgW, annot.imgH);
      ctx.restore();
    }

    function annotLayout() {
      const stage = document.getElementById("annotStage");
      const canvas = document.getElementById("annotCanvas");
      if (!stage || !canvas || !annot.img) return;
      const availW = Math.max(1, stage.clientWidth);
      const availH = Math.max(1, stage.clientHeight);
      const scale = Math.min(availW / annot.imgW, availH / annot.imgH);
      annot.scale = scale;
      annot.cssW = annot.imgW * scale;
      annot.cssH = annot.imgH * scale;
      annot.ox = 0;
      annot.oy = 0;
      annot.dpr = Math.min(window.devicePixelRatio || 1, 3);
      canvas.style.width = Math.max(1, annot.cssW) + "px";
      canvas.style.height = Math.max(1, annot.cssH) + "px";
      canvas.width = Math.round(Math.max(1, annot.cssW) * annot.dpr);
      canvas.height = Math.round(Math.max(1, annot.cssH) * annot.dpr);
      annotRedraw();
    }

    function annotPushHistory() {
      annot.history = annot.history.slice(0, annot.historyIndex + 1);
      annot.history.push(JSON.parse(JSON.stringify(annot.shapes)));
      if (annot.history.length > 60) {
        annot.history.shift();
      }
      annot.historyIndex = annot.history.length - 1;
      annot.dirty = true;
      annotUpdateButtons();
    }

    function annotUndo() {
      if (annot.historyIndex <= 0) return;
      annot.historyIndex -= 1;
      annot.shapes = JSON.parse(JSON.stringify(annot.history[annot.historyIndex]));
      annot.dirty = true;
      annotUpdateButtons();
      annotRedraw();
    }

    function annotRedo() {
      if (annot.historyIndex >= annot.history.length - 1) return;
      annot.historyIndex += 1;
      annot.shapes = JSON.parse(JSON.stringify(annot.history[annot.historyIndex]));
      annot.dirty = true;
      annotUpdateButtons();
      annotRedraw();
    }

    function annotClear() {
      if (!annot.shapes.length) return;
      if (!confirm("Alle Markierungen auf diesem Bild löschen?")) return;
      annot.shapes = [];
      annotPushHistory();
      annotRedraw();
    }

    function annotUpdateButtons() {
      const undo = document.getElementById("annotUndo");
      const redo = document.getElementById("annotRedo");
      if (undo) undo.disabled = annot.historyIndex <= 0;
      if (redo) redo.disabled = annot.historyIndex >= annot.history.length - 1;
      document.querySelectorAll(".annot-tool").forEach((b) => b.classList.toggle("is-on", b.getAttribute("data-tool") === annot.tool));
      document.querySelectorAll(".annot-swatch").forEach((b) => b.classList.toggle("is-on", b.getAttribute("data-color") === annot.color));
      document.querySelectorAll(".annot-w").forEach((b) => b.classList.toggle("is-on", b.getAttribute("data-width") === annot.width));
    }

    function annotBuildChrome() {
      const el = document.getElementById("annotEditor");
      if (!el || el.dataset.ready) return;
      el.innerHTML = `
        <div class="annot-bar">
          <button type="button" class="annot-act" id="annotCancel">Abbrechen</button>
          <h2>Bild markieren</h2>
          <button type="button" class="annot-act primary" id="annotSave">Speichern</button>
        </div>
        <div class="annot-tools" id="annotTools">
          ${ANNOT_TOOLS.map((t) => `<button type="button" class="annot-tool" data-tool="${t.id}">${escapeHtml(t.label)}</button>`).join("")}
          <span class="annot-sep"></span>
          ${ANNOT_COLORS.map((c) => `<button type="button" class="annot-swatch ${escapeHtml(c.id)}" data-color="${c.id}" title="${escapeHtml(c.label)}" style="background:${c.hex}" aria-label="${escapeHtml(c.label)}"></button>`).join("")}
          <span class="annot-sep"></span>
          ${ANNOT_WIDTHS.map((w) => `<button type="button" class="annot-w" data-width="${w.id}">${escapeHtml(w.label)}</button>`).join("")}
          <span class="annot-sep"></span>
          <button type="button" class="annot-act" id="annotUndo">Rückgängig</button>
          <button type="button" class="annot-act" id="annotRedo">Wiederholen</button>
          <button type="button" class="annot-act" id="annotClear">Alles löschen</button>
        </div>
        <div class="annot-stage" id="annotStage">
          <canvas id="annotCanvas"></canvas>
          <div class="annot-textpop" id="annotTextPop">
            <input type="text" id="annotTextInput" placeholder="Text eingeben" maxlength="200" />
            <div class="row-btns">
              <button type="button" class="btn" id="annotTextCancel">Abbrechen</button>
              <button type="button" class="btn primary" id="annotTextOk">OK</button>
            </div>
          </div>
        </div>`;
      el.dataset.ready = "1";
      document.getElementById("annotCancel").addEventListener("click", () => annotClose(false));
      document.getElementById("annotSave").addEventListener("click", () => annotClose(true));
      document.getElementById("annotUndo").addEventListener("click", annotUndo);
      document.getElementById("annotRedo").addEventListener("click", annotRedo);
      document.getElementById("annotClear").addEventListener("click", annotClear);
      document.getElementById("annotTools").addEventListener("click", (e) => {
        const tool = e.target.closest("[data-tool]");
        const col = e.target.closest("[data-color]");
        const w = e.target.closest("[data-width]");
        if (tool) { annot.tool = tool.getAttribute("data-tool"); annotUpdateButtons(); }
        if (col) { annot.color = col.getAttribute("data-color"); annotUpdateButtons(); }
        if (w) { annot.width = w.getAttribute("data-width"); annotUpdateButtons(); }
      });
      const canvas = document.getElementById("annotCanvas");
      canvas.addEventListener("pointerdown", onAnnotDown);
      canvas.addEventListener("pointermove", onAnnotMove);
      canvas.addEventListener("pointerup", onAnnotUp);
      canvas.addEventListener("pointercancel", onAnnotUp);
      document.getElementById("annotTextOk").addEventListener("click", annotCommitText);
      document.getElementById("annotTextCancel").addEventListener("click", annotCancelText);
      document.getElementById("annotTextInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); annotCommitText(); }
        if (e.key === "Escape") annotCancelText();
      });
    }

    function onAnnotDown(e) {
      if (!annot.open || e.button) return;
      e.preventDefault();
      e.stopPropagation();
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      annot.pointerId = e.pointerId;
      const p = annotPtr(e);
      annot.drawing = true;
      if (annot.tool === "freehand") {
        annot.draft = { type: "freehand", color: annot.color, width: annot.width, points: [{ x: p.x, y: p.y }] };
      } else if (annot.tool === "text") {
        annot.draft = { type: "text", color: annot.color, width: annot.width, x: p.x, y: p.y, text: "" };
        annot.drawing = false;
        annotShowTextPop(e.clientX, e.clientY);
        return;
      } else {
        annot.draft = { type: annot.tool, color: annot.color, width: annot.width, x1: p.x, y1: p.y, x2: p.x, y2: p.y, x: p.x, y: p.y, w: 0, h: 0 };
      }
      annotRedraw();
    }

    function onAnnotMove(e) {
      if (!annot.drawing || !annot.draft) return;
      if (annot.pointerId != null && e.pointerId !== annot.pointerId) return;
      e.preventDefault();
      const p = annotPtr(e);
      if (annot.draft.type === "freehand") {
        const last = annot.draft.points[annot.draft.points.length - 1];
        if (!last || Math.hypot(p.x - last.x, p.y - last.y) > 1.5 / annot.scale) {
          annot.draft.points.push({ x: p.x, y: p.y });
        }
      } else {
        annot.draft.x2 = p.x;
        annot.draft.y2 = p.y;
        annot.draft.w = p.x - annot.draft.x;
        annot.draft.h = p.y - annot.draft.y;
      }
      annotRedraw();
    }

    function onAnnotUp(e) {
      if (!annot.drawing && annot.tool !== "text") return;
      if (annot.pointerId != null && e.pointerId !== annot.pointerId) return;
      if (annot.draft && annot.draft.type !== "text") {
        annot.shapes.push(annot.draft);
        annot.draft = null;
        annotPushHistory();
      }
      annot.drawing = false;
      annot.pointerId = null;
      annotRedraw();
    }

    let annotTextPos = null;
    function annotShowTextPop(clientX, clientY) {
      const pop = document.getElementById("annotTextPop");
      const stage = document.getElementById("annotStage");
      const sr = stage.getBoundingClientRect();
      let left = clientX - sr.left + 8;
      let top = clientY - sr.top + 8;
      pop.classList.add("open");
      pop.style.left = "0px";
      pop.style.top = "0px";
      const pr = pop.getBoundingClientRect();
      if (left + pr.width > sr.width - 8) left = Math.max(8, sr.width - pr.width - 8);
      if (top + pr.height > sr.height - 8) top = Math.max(8, sr.height - pr.height - 8);
      pop.style.left = left + "px";
      pop.style.top = top + "px";
      const input = document.getElementById("annotTextInput");
      input.value = "";
      setTimeout(() => input.focus(), 30);
    }
    function annotCommitText() {
      const input = document.getElementById("annotTextInput");
      const text = (input && input.value || "").trim();
      document.getElementById("annotTextPop").classList.remove("open");
      if (text && annot.draft && annot.draft.type === "text") {
        annot.draft.text = text;
        annot.shapes.push(annot.draft);
        annotPushHistory();
      }
      annot.draft = null;
      annotRedraw();
    }
    function annotCancelText() {
      document.getElementById("annotTextPop").classList.remove("open");
      annot.draft = null;
      annotRedraw();
    }

    async function openAnnotEditor() {
      const p = getPhoto(activePhotoId);
      if (!p) return;
      const rec = await idbGetPhoto(current.id, p.id);
      if (!rec || !rec.blob) {
        toast("Bild konnte nicht geladen werden.", true);
        return;
      }
      annotBuildChrome();
      const img = new Image();
      const url = URL.createObjectURL(rec.blob);
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = url;
      });
      URL.revokeObjectURL(url);
      annot.open = true;
      annot.photoId = p.id;
      annot.img = img;
      annot.imgW = img.naturalWidth;
      annot.imgH = img.naturalHeight;
      annot.shapes = JSON.parse(JSON.stringify(p.annotations || []));
      annot.history = [JSON.parse(JSON.stringify(annot.shapes))];
      annot.historyIndex = 0;
      annot.draft = null;
      annot.drawing = false;
      annot.dirty = false;
      annot.tool = "freehand";
      annot.color = "rot";
      annot.width = "mid";
      const el = document.getElementById("annotEditor");
      el.hidden = false;
      el.classList.add("open");
      document.body.style.overflow = "hidden";
      annotUpdateButtons();
      requestAnimationFrame(() => { annotLayout(); annotLayout(); });
    }

    async function flattenAnnotatedJpeg(img, shapes) {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0);
      shapes.forEach((s) => drawAnnotShape(ctx, s, c.width, c.height));
      return new Promise((resolve, reject) => {
        c.toBlob((b) => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", 0.88);
      });
    }

    async function annotClose(save) {
      if (!annot.open) return;
      if (!save && annot.dirty) {
        if (!confirm("Markierungen verwerfen und den Editor schließen?")) return;
      }
      if (save) {
        const p = getPhoto(annot.photoId);
        if (p && annot.img) {
          p.annotations = JSON.parse(JSON.stringify(annot.shapes));
          p.annotated = p.annotations.length > 0;
          persistCurrent();
          try {
            let annotatedBlob = null;
            if (p.annotated) annotatedBlob = await flattenAnnotatedJpeg(annot.img, p.annotations);
            await idbMergePhoto(current.id, p.id, { annotatedBlob: annotatedBlob });
          } catch (err) {
            toast("Markierungen konnten nicht gespeichert werden.", true);
          }
          toast(p.annotated ? "Markierungen gespeichert" : "Bild ohne Markierungen gespeichert");
        }
      }
      annot.open = false;
      annot.img = null;
      annot.shapes = [];

    async function buildAuftragPackage(auftrag) {

        const rec = await idbGetPhoto(auftrag.id, p.id);
        const item = Object.assign({}, migratePhoto(p));
        delete item.imageData;
        delete item.originalImageData;
        delete item.annotatedImageData;
        if (rec && rec.blob) item.originalImageData = await blobToDataUrl(rec.blob);
        if (rec && rec.annotatedBlob) item.annotatedImageData = await blobToDataUrl(rec.annotatedBlob);
        const display = rec ? displayBlob(rec) : null;
        if (display) {
          item.imageData = await blobToDataUrl(display);
          item.mime = rec.mime || "image/jpeg";
        }
        payload.photos.push(item);
      }
      payload.format = ICLOUD_FORMAT;
      payload.formatVersion = ICLOUD_FORMAT_VERSION;
      payload.lastModified = auftrag.updatedAt || nowIso();

      return {

        } else if (p.imageData) {
          blob = await dataUrlToBlob(p.imageData);
        }
        if (p.annotatedImageData) {
          annotatedBlob = await dataUrlToBlob(p.annotatedImageData);
        } else if (p.annotated && p.imageData && p.originalImageData) {
          annotatedBlob = await dataUrlToBlob(p.imageData);
        }
        if (!blob && !annotatedBlob) continue;
        const patch = { mime: p.mime || "image/jpeg" };
        if (blob) patch.blob = blob;

        await idbMergePhoto(auftragId, p.id, patch);

       - Fotos als Daten-URL genau so, wie sie gespeichert sind (bereits verkleinerte JPEGs), ohne Doppel-Kopie.
       - Unterschrift nur die des jeweiligen Auftrags (gleiche Auftrags-ID = derselbe Bericht auf anderem Gerät).
       - Einstellungen werden nicht exportiert.
       Laden: pro Auftrags-ID gewinnt der neuere Stand (changedAt, sonst updatedAt); gleicher Inhalt = unverändert;
       neue IDs werden hinzugefügt; es wird nie etwas gelöscht. Unterschriften: jeweils die neuere. */
    const BACKUP_FORMAT = "leckortung-sicherung";
    function backupAuftraege() {
      if (view === "fotodetail") readPhotoDetailIntoModel();

      const list = reports.map((r) => (r.id === current.id ? current : r));
      if (!list.some((r) => r.id === current.id) && !isPristineAuftrag(current)) list.unshift(current);
      return list;
    }
    async function buildBackupFile() {
      if (sigSaveTimer) await sigPersist();
      const list = backupAuftraege();
      const stamp = new Date();
      const p2 = (n) => String(n).padStart(2, "0");
      const name = "Leckortung-Sicherung_" + stamp.getFullYear() + "-" + p2(stamp.getMonth() + 1) + "-" + p2(stamp.getDate()) + "_" + p2(stamp.getHours()) + p2(stamp.getMinutes()) + ".json";
      const parts = ['{"format":"' + BACKUP_FORMAT + '","formatVersion":1,"appVersion":' + APP_VERSION + ',"exportedAt":' + JSON.stringify(nowIso()) + ',"anzahl":' + list.length + ',"auftraege":['];
      let fotos = 0;
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        const item = { auftrag: JSON.parse(JSON.stringify(a)), fotos: [], unterschrift: null };
        if (!item.auftrag.contentHash) item.auftrag.contentHash = auftragContentHash(item.auftrag);
        for (const p of a.photos || []) {
          let rec = null;
          try { rec = await idbGetPhoto(a.id, p.id); } catch (e) {}
          if (!rec || (!rec.blob && !rec.annotatedBlob)) continue;
          item.fotos.push({
            id: p.id, mime: rec.mime || "image/jpeg", width: rec.width || null, height: rec.height || null,
            original: rec.blob ? await blobToDataUrl(rec.blob) : null,
            markiert: rec.annotatedBlob ? await blobToDataUrl(rec.annotatedBlob) : null
          });
          fotos++;
        }
        try {
          const sig = await sigDbOp("readonly", (st) => st.get(a.id));
          if (sig && ((sig.ma && sig.ma.length) || (sig.kunde && sig.kunde.length))) item.unterschrift = { ma: sig.ma || [], kunde: sig.kunde || [], maAspect: sig.maAspect || SIG_PAD_ASPECT, kundeAspect: sig.kundeAspect || SIG_PAD_ASPECT, updatedAt: sig.updatedAt || "" };
        } catch (e) {}
        parts.push((i ? "," : "") + JSON.stringify(item));
      }
      parts.push("]}");
      const file = new File(parts, name, { type: "application/json" });
      return { file, anzahl: list.length, fotos };
    }
    async function backupAllClick() {

    function backupPlan(items) {
      const plan = [];
      for (const it of items) {
        if (!it || !it.auftrag || !it.auftrag.id) continue;
        const inc = migrateAuftrag(JSON.parse(JSON.stringify(it.auftrag)));
        const local = current.id === inc.id ? current : reports.find((r) => r.id === inc.id);
        let action;
        if (!local) action = "neu";
        else if (auftragContentHash(local) === auftragContentHash(inc)) action = "gleich";
        else if (auftragChangeTime(inc) > auftragChangeTime(local)) action = "update";
        else action = "lokalNeuer";
        plan.push({ it, inc, local, action });
      }
      return plan;
    }
    async function restoreBackupPhotos(auftragId, fotos, onlyMissing) {
      for (const f of fotos || []) {
        if (!f || !f.id) continue;
        if (onlyMissing) {
          let rec = null; try { rec = await idbGetPhoto(auftragId, f.id); } catch (e) {}
          if (rec && (rec.blob || rec.annotatedBlob)) continue;
        }
        const patch = { mime: f.mime || "image/jpeg" };
        if (f.width) patch.width = f.width;
        if (f.height) patch.height = f.height;
        if (f.original) patch.blob = await dataUrlToBlob(f.original);
        patch.annotatedBlob = f.markiert ? await dataUrlToBlob(f.markiert) : null;
        if (!patch.blob && !patch.annotatedBlob) continue;
        await idbMergePhoto(auftragId, f.id, patch);
      }
    }
    async function mergeBackupSig(auftragId, u) {
      if (!u || !((u.ma && u.ma.length) || (u.kunde && u.kunde.length))) return false;
      let local = null;
      try { local = await sigDbOp("readonly", (st) => st.get(auftragId)); } catch (e) {}
      const lt = local ? Date.parse(local.updatedAt || "") || 0 : -1;
      const it = Date.parse(u.updatedAt || "") || 0;
      if (local && lt >= it) return false;
      if (sigStore.owner === auftragId && sigSaveTimer) await sigPersist();
      await sigDbOp("readwrite", (st) => st.put({ auftragId, ma: u.ma || [], kunde: u.kunde || [], maAspect: u.maAspect || SIG_PAD_ASPECT, kundeAspect: u.kundeAspect || SIG_PAD_ASPECT, updatedAt: u.updatedAt || nowIso() }));
      if (sigStore.owner === auftragId) { sigStore.owner = null; sigSyncOwner(); await sigLoadPromise; }
      return true;
    }
    async function loadBackupObject(obj) {
      const items = Array.isArray(obj.auftraege) ? obj.auftraege : [];
      const plan = backupPlan(items);
      const nUpd = plan.filter((p) => p.action === "update").length;
      if (nUpd > 0) {
        const choice = await showChoiceDialog("Berichte laden",
          nUpd + (nUpd === 1 ? " Bericht wird" : " Berichte werden") + " durch einen neueren Stand aus der Datei ersetzt. Möchten Sie vorher eine Sicherung der Berichte auf diesem Gerät speichern?",
          [{ label: "Abbrechen", value: "cancel", id: "bkCancel" }, { label: "Erst sichern", value: "backup", id: "bkFirst" }, { label: "Laden", value: "go", primary: true, id: "bkGo" }]);
        if (choice === "cancel" || choice == null) return null;
        if (choice === "backup") { await backupAllClick(); return null; }
      }
      const res = { neu: 0, aktualisiert: 0, unveraendert: 0, lokalNeuer: 0, unterschriften: 0 };
      let currentReplaced = false;
      toast("Berichte werden geladen…");
      for (const p of plan) {
        const id = p.inc.id;
        if (p.action === "neu" || p.action === "update") {
          await restoreBackupPhotos(id, p.it.fotos, false);
          const next = p.inc;
          const idx = reports.findIndex((r) => r.id === id);
          if (idx >= 0) reports[idx] = JSON.parse(JSON.stringify(next)); else reports.push(JSON.parse(JSON.stringify(next)));
          if (current.id === id) { current = migrateAuftrag(JSON.parse(JSON.stringify(next))); currentReplaced = true; }
          res[p.action === "neu" ? "neu" : "aktualisiert"]++;
        } else {
          await restoreBackupPhotos(id, p.it.fotos, true);
          res[p.action === "gleich" ? "unveraendert" : "lokalNeuer"]++;
        }
        if (await mergeBackupSig(id, p.it.unterschrift)) res.unterschriften++;
      }
      sortReportsNewestFirst();
      persistList();
      if (currentReplaced) {
        photoSortMode = current.photoSortMode === "date" ? "date" : "custom";
        try { localStorage.setItem(STORAGE_CURRENT, JSON.stringify(current)); } catch (e) {}
      }
      renderReportList();
      renderApp();
      return res;
    }
    async function backupLoadFile(file) {

      o = document.createElement("div");
      o.id = "taOverlay"; o.className = "ta-overlay"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "taTitle");
      o.innerHTML = `<div class="ta-head"><button type="button" class="ta-ico" id="taShrink" aria-label="Verkleinern" title="Verkleinern">${ICO_SHRINK}</button><div class="ta-title" id="taTitle"></div><button type="button" class="btn ta-done" id="taDone">Fertig</button></div><textarea id="taBig" class="ta-big" aria-labelledby="taTitle"></textarea><div class="ta-foot" id="taCount"></div>`;
      document.body.appendChild(o);
      document.getElementById("taShrink").addEventListener("click", closeTaEditor);
      document.getElementById("taDone").addEventListener("click", closeTaEditor);
      document.getElementById("taBig").addEventListener("input", updateTaCount);
      o.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); closeTaEditor(); } });
      const fit = () => {
        const vv = window.visualViewport;
        if (vv) { o.style.top = vv.offsetTop + "px"; o.style.height = vv.height + "px"; }
        else { o.style.top = "0px"; o.style.height = window.innerHeight + "px"; }
      };
      o.__fit = fit;
      if (window.visualViewport) { window.visualViewport.addEventListener("resize", fit); window.visualViewport.addEventListener("scroll", fit); }
      window.addEventListener("resize", fit);
      return o;
    }
    function updateTaCount() {
      const el = document.getElementById("taCount"), big = document.getElementById("taBig");
      if (!el || !big) return;
      if (!taTarget || taTarget.id !== "mit-notiz") { el.textContent = ""; el.className = "ta-foot"; return; }
      const n = (big.value || "").length;
      el.className = "ta-foot" + (n >= NOTIZ_LIMIT ? " over" : (n >= NOTIZ_WARN ? " warn" : ""));
      el.innerHTML = n + " / " + NOTIZ_LIMIT + (n > NOTIZ_LIMIT ? '<span class="char-hint">EasyTec-Limit überschritten</span>' : "");
    }
    function openTaEditor(ta) {
      if (!ta || ta.disabled) return;
      const o = taOverlayEl();
      taTarget = ta;
      document.getElementById("taTitle").textContent = taLabelOf(ta);
      const big = document.getElementById("taBig");
      big.value = ta.value;
      big.placeholder = ta.getAttribute("placeholder") || "";
      big.readOnly = !!ta.readOnly;
      o.classList.add("open");
      document.body.style.overflow = "hidden";
      o.__fit();
      updateTaCount();
      big.focus();
      try { big.setSelectionRange(big.value.length, big.value.length); } catch (e) {}
      big.scrollTop = big.scrollHeight;
    }
    /* Fertig / Verkleinern / Esc: Text zurück ins Feld, input+change auslösen (Speichern, Zeichenzähler, Pflichtfeld-Hinweise) */
    function closeTaEditor() {
      const o = document.getElementById("taOverlay");
      if (!o || !o.classList.contains("open")) return;
      const big = document.getElementById("taBig"), ta = taTarget;
      o.classList.remove("open");
      document.body.style.overflow = "";
      taTarget = null;
      if (ta && ta.isConnected && ta.value !== big.value) {
        ta.value = big.value;
        ta.dispatchEvent(new Event("input", { bubbles: true }));
        ta.dispatchEvent(new Event("change", { bubbles: true }));
      }
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
    function enhanceTextareas(root) {
      const list = [];
      if (root.matches && root.matches("textarea")) list.push(root);
      if (root.querySelectorAll) root.querySelectorAll("textarea").forEach((t) => list.push(t));
      list.forEach((ta) => {
        if (ta.dataset.taEnh || ta.closest("#taOverlay") || !ta.parentNode) return;
        ta.dataset.taEnh = "1";
        const wrap = document.createElement("div");
        wrap.className = "ta-wrap";
        ta.parentNode.insertBefore(wrap, ta);
        wrap.appendChild(ta);
        const b = document.createElement("button");
        b.type = "button"; b.className = "ta-exp"; b.title = "Vergrößern"; b.setAttribute("aria-label", "Textfeld vergrößern");
        b.innerHTML = ICO_EXPAND;
        b.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); openTaEditor(ta); });
        wrap.appendChild(b);
      });
    }
    new MutationObserver((muts) => {
      muts.forEach((m) => m.addedNodes.forEach((n) => { if (n.nodeType === 1) enhanceTextareas(n); }));
    }).observe(document.body, { childList: true, subtree: true });
    enhanceTextareas(document.body);


    /* Init */
    ensurePhotoOrder();
    renderApp();
    persistCurrent();
  })();
  </script>
</body>
</html>
