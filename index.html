  <title>Leckortung</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #1a5fad;
      --blue-dark: #144a8a;
      --blue-light: #e8f0fa;
      --blue-mid: #2b73c9;
      --bg: #eef1f5;
      --card: #fff;
      --line: #d5dbe3;
      --line-soft: #e6eaef;
      --text: #1c2430;
      --muted: #5b6573;
      --label: #1c2430;
      --danger: #c0392b;
      --ok: #1e7a46;
      --dot-ok: #1f9d55;
      --dot-missing: #e23c2f;
      --shadow: 0 1px 3px rgba(16, 32, 56, .08);
      --header-h: 52px;
      --tabs-h: 46px;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --touch: 48px;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      height: 100%;
      height: 100dvh;
      font-family: var(--font);
      color: #1c2430;
      background: #eef1f5;
      color-scheme: light;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      display: flex; flex-direction: column;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }
    button, input, textarea, select {
      font-family: inherit;
      font-size: 16px;
      max-width: 100%;
      min-width: 0;
      color-scheme: light;
    }
    input, textarea, select {
      background-color: #f7f9fb;
      color: #1c2430;
    }
    .card, .menu-list, .foto-item, .report-item, .choice-dialog {
      background-color: #fff;
      color: #1c2430;
    }
    button, a, .tab, .menu-item, .icon-btn, .hdr-btn, .btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(26,95,173,.18);
    }
    img, svg { max-width: 100%; }
    input[type="date"], input[type="datetime-local"], input[type="time"], input[type="number"] {
      min-width: 0;
      max-width: 100%;
    }

    /* Header */
    .app-header {
      position: sticky; top: 0; z-index: 40;
      height: calc(var(--header-h) + var(--sat));
      background: linear-gradient(180deg, var(--blue-mid) 0%, var(--blue) 100%);
      color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--sat) max(6px, var(--sar)) 0 max(4px, var(--sal));
      box-shadow: 0 1px 4px rgba(0,0,0,.18);
      flex-shrink: 0;
    }
    .app-header h1 {
      position: absolute; left: 50%; transform: translateX(-50%);
      margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .2px;
      max-width: calc(100% - 196px);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      pointer-events: none; text-align: center;
    }
    .hdr-left, .hdr-right {
      display: flex; align-items: center; gap: 0; z-index: 1; min-width: 48px;
    }
    .hdr-right { margin-left: auto; }
    .hdr-btn {
      appearance: none; border: 0; background: transparent; color: #fff;
      width: 44px; height: 44px; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .hdr-btn-label {
      width: auto; min-width: 44px; height: 36px; padding: 0 10px; gap: 6px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      background: rgba(255,255,255,.16);
    }
    .hdr-btn-label:hover, .hdr-btn-label:focus-visible { background: rgba(255,255,255,.26); }
    .app-toolbar {
      display: none; flex-shrink: 0; gap: 8px; align-items: center;
      padding: 8px max(12px, var(--sar)) 8px max(12px, var(--sal));
      background: #fff; border-bottom: 1px solid var(--line);
      position: sticky; top: calc(var(--header-h) + var(--sat)); z-index: 35;
    }
    .app-toolbar .btn { flex: 1; min-height: 44px; font-weight: 700; }
    .btn-icloud { white-space: nowrap; font-weight: 700; }
    .app-version {
      text-align: center; color: var(--muted); font-size: 12px;
      padding: 16px 8px 20px; user-select: text;
    }
    .btn-quiet {
      font-weight: 600; color: var(--muted); background: #f7f8fa;
    }
    .btn-quiet:hover, .btn-quiet:focus-visible { color: var(--text); background: #eef1f5; }
    .field-with-count { min-width: 0; width: 100%; }
    .char-count {
      display: block; margin: 6px 0 0; font-size: 12px; font-weight: 600;
      color: var(--muted); text-align: right;
    }
    .char-count.warn { color: #c47b00; }
    .char-count.over { color: var(--danger); }
    .char-count .char-hint { display: block; font-weight: 700; margin-top: 2px; }
    .hdr-btn:hover, .hdr-btn:focus-visible { background: rgba(255,255,255,.15); outline: none; }
    .hdr-btn:active { background: rgba(255,255,255,.25); }
    .hdr-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .hdr-btn.danger-icon:hover, .hdr-btn.danger-icon:focus-visible { background: rgba(226,60,47,.25); }
    .save-flash { animation: flashok .7s ease; }
    @keyframes flashok {
      0%,100% { background: transparent; }
      40% { background: rgba(255,255,255,.28); }
    }

    /* Tabs */
    .tab-bar {
      position: sticky; top: calc(var(--header-h) + var(--sat)); z-index: 30;
      display: flex; gap: 0; background: #fff;
      border-bottom: 1px solid var(--line);
      overflow-x: auto; overflow-y: hidden;
      flex-shrink: 0; height: var(--tabs-h);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-left: var(--sal);
      padding-right: var(--sar);
    }
    .tab-bar.is-hidden { display: none; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab {
      appearance: none; border: 0; background: transparent;
      color: var(--muted); font-size: 13.5px; font-weight: 600;
      padding: 0 18px; height: var(--tabs-h); white-space: nowrap;
      cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .tab-short { display: none; }
    .tab-full { display: inline; }
    .tab:hover { color: var(--blue); background: var(--blue-light); }
    .tab[aria-selected="true"] {
      color: var(--blue); border-bottom-color: var(--blue);
    }

    /* Main */
    main { flex: 1; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    main.tight { padding: 0 0 calc(40px + var(--sab)); }
    .panel { display: none; max-width: 1100px; width: 100%; margin: 0 auto; min-width: 0; }
    .panel.active { display: block; }
    .view { display: none; max-width: 1100px; margin: 0 auto; }
    .view.active { display: block; }

    /* Form rows */
    .section { margin: 22px 0 8px; }
    .section-title {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; font-variant: small-caps;
      color: var(--muted); margin: 0 2px 8px;
    }
    .section-title::after {
      content: ""; flex: 1; height: 1px; background: var(--line);
    }

    .card {
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      max-width: 100%; min-width: 0;
    }
    .row {
      display: grid;
      grid-template-columns: minmax(200px, 38%) 1fr;
      align-items: center;
      min-height: 46px;
      border-bottom: 1px solid var(--line-soft);
      padding: 6px 14px;
      gap: 12px;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .row:last-child { border-bottom: 0; }
    .row.label-top { align-items: start; padding-top: 10px; padding-bottom: 10px; }
    .row .lbl {
      font-weight: 700; font-size: 14px; color: var(--label); line-height: 1.3;
    }
    .row input[type="text"],
    .row input[type="tel"],
    .row input[type="date"],
    .row input[type="datetime-local"],
    .row input[type="number"] {
      width: 100%; border: 1px solid transparent; background: #f7f9fb;
      border-radius: 6px; padding: 8px 10px; font-size: 16px; color: var(--text);
      text-align: right; min-height: 40px;
    }
    .row input:focus, .row textarea:focus, .row select:focus {
      outline: none; border-color: var(--blue); background: #fff;
      box-shadow: 0 0 0 3px rgba(26,95,173,.15);
    }
    .row textarea {
      width: 100%; border: 1px solid transparent; background: #f7f9fb;
      border-radius: 6px; padding: 8px 10px; font-size: 16px; color: var(--text);
      text-align: left; min-height: 88px; resize: vertical; line-height: 1.4;
    }
    .row select {
      width: 100%; border: 1px solid transparent; background-color: #f7f9fb;
      border-radius: 6px; padding: 8px 28px 8px 10px; font-size: 16px; color: var(--text);
      text-align: right; min-height: 40px; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%235b6573' d='M1 1l5 5 5-5'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center;
    }
    .row input::placeholder, .row textarea::placeholder { color: #9aa3af; }
    .row input:disabled, .row textarea:disabled, .row select:disabled {
      color: var(--text); opacity: 1; background: #f0f3f6;
    }

    .row.check { grid-template-columns: 1fr auto; }
    .row.check input[type="checkbox"] { margin: 0; }
    input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 28px; height: 28px; min-width: 28px; min-height: 28px;
      border: 2px solid #8b96a5;
      border-radius: 6px; background: #fff; cursor: pointer; position: relative;
      flex-shrink: 0; margin: 0; pointer-events: auto; z-index: 1;
    }
    input[type="checkbox"]:checked {
      background: var(--blue); border-color: var(--blue);
    }
    input[type="checkbox"]:checked::after {
      content: ""; position: absolute; left: 8px; top: 3px;
      width: 7px; height: 14px; border: solid #fff; border-width: 0 2.6px 2.6px 0;
      transform: rotate(45deg);
    }
    input[type="checkbox"]:focus-visible { box-shadow: 0 0 0 3px rgba(26,95,173,.25); outline: none; }
    input[type="checkbox"]:disabled { opacity: .7; cursor: default; }

    .row.pair {
      grid-template-columns: minmax(160px, 1fr) auto minmax(140px, 1fr) auto;
      gap: 10px 14px;
    }
    .row.pair .lbl { font-weight: 700; }
    .row.pair.mixed {
      grid-template-columns: minmax(140px, 32%) 1fr minmax(90px, auto) auto;
    }
    .row.pair.mixed input[type="text"],
    .row.pair.mixed input[type="number"] { text-align: right; }
    .row.pair .right-lbl { text-align: right; }

    .extend-note {
      margin: 16px 2px 0; font-size: 12.5px; color: var(--muted); font-style: italic;
    }

    /* Overview menu */
    .overview-wrap { padding: 14px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    .menu-list {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
      margin-top: 16px;
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px;
      width: 100%; text-align: left;
      appearance: none; border: 0; background: #fff; color: var(--text);
      min-height: 62px; padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
      cursor: pointer; font-size: 16.5px; font-weight: 600;
    }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item:hover, .menu-item:focus-visible { background: var(--blue-light); outline: none; }
    .menu-item:active { background: #dce7f5; }
    .menu-ico {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--blue-light); color: var(--blue);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .menu-ico svg { width: 22px; height: 22px; fill: currentColor; }
    .menu-item .menu-label { flex: 1; text-align: left; }
    .status-dot {
      width: 14px; height: 14px; min-width: 14px; max-width: 14px;
      border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 3px rgba(0,0,0,.04);
    }
    .chevron { flex-shrink: 0; }
    .status-dot.ok { background: var(--dot-ok); }
    .status-dot.missing { background: var(--dot-missing); }
    .status-dot.neutral { background: #c5cbd3; }
    .chevron { color: #9aa3af; display: inline-flex; }
    .chevron svg { width: 18px; height: 18px; fill: currentColor; }

    /* Fotos list */
    .fotos-wrap { padding: 12px max(16px, var(--sar)) calc(80px + var(--sab)) max(16px, var(--sal)); }
    .fotos-count { color: var(--muted); font-size: 14px; margin: 4px 2px 12px; }
    .foto-list { display: flex; flex-direction: column; gap: 10px; }
    .foto-item {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 10px 8px 10px 4px;

    .foto-handle {

    .foto-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .foto-flag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--danger); margin-top: 3px; }
    .icon-btn {

    /* Foto details */
    .fdetail { padding: 0 0 calc(80px + var(--sab)); max-width: 900px; margin: 0 auto; }

    }
    .fdetail-body { padding: 8px 18px 24px; }
    .fg { margin: 18px 0 6px; }

      font-size: 11px; font-weight: 700; letter-spacing: .1em;

    .fg .check-row:hover, .fg .check-row:active { background: #f4f7fa; }

    /* Druck: großer Schalter (Fotodetails) und Ein-Tipp-Schalter (Fotoliste) */
    .druck-switch {
      appearance: none; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      width: 100%; min-height: 64px; padding: 10px 14px; margin: 0;

      font: inherit; font-weight: 650; font-size: 16px; color: var(--text); text-align: left;

    .fg-druck { margin-top: 12px; }
    .foto-druck-btn {
      appearance: none; flex-shrink: 0; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 76px; min-height: 52px; padding: 4px 8px; border-radius: 10px;

    /* Lightbox */
    .lightbox {

    }

    /* Toast */

    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: #8e1e18; }

    /* Drawer / Aufträge */
    .overlay {

    }

    }
    .drawer-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
    .drawer-actions { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .btn {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 8px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
      min-height: 40px;

    .btn:hover { background: #f4f7fa; }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }

    .btn.danger { color: var(--danger); border-color: #f0c9c5; }

    .report-list { flex: 1; overflow: auto; padding: 8px; }

      margin-bottom: 8px; cursor: pointer; background: #fff;
    }

      outline: 2px solid var(--blue);

    }
    .report-item .meta { flex: 1; min-width: 0; }
    .report-item .meta strong { display: block; font-size: 15px; margin-bottom: 2px; }
    .report-item .meta span { font-size: 13px; color: var(--muted); }
    .empty-list { color: var(--muted); text-align: center; padding: 32px 16px; font-size: 14px; }

    .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .report-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .report-cloud {
      appearance: none; border: 1px solid var(--line); background: #fff; color: var(--blue);
      border-radius: 8px; width: 40px; height: 40px; min-width: 40px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .report-cloud svg { width: 20px; height: 20px; fill: currentColor; }
    .report-cloud:hover, .report-cloud:focus-visible { background: var(--blue-light); outline: none; }
    .btn-ico { display: inline-flex; align-items: center; gap: 6px; }

    .choice-overlay {
      position: fixed; inset: 0; z-index: 140; background: rgba(16,24,40,.45);

    .choice-dialog {

    .choice-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }



    /* Version 22: Aufträge-Liste (Vollbild), Report-Vorschau */
    .drawer-actions { border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: max(12px, var(--sab)); }
    .drawer-head-r { display: flex; gap: 4px; }
    .drawer-head h2 { flex: 1; margin-left: 10px; }
    .auf-filter { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px max(14px, var(--sal)); background: #f4f7fa; border-bottom: 1px solid var(--line); }
    .auf-filter select, .auf-filter input[type=search] { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; background: #fff; }
    .auf-filter select { flex: 0 1 240px; }
    .auf-filter input[type=search] { flex: 1 1 220px; min-width: 0; }

    @keyframes sync-spin { to { transform: rotate(360deg); } }
    .hdr-btn.spin svg { animation: sync-spin 1s linear infinite; }
    .hdr-flag { color: #fff; }
    .rp-status { margin: 8px 0 0; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; }
    .rp-status.ok { background: #e3f4e6; color: #1b6b2c; }

    .rp-art th:nth-child(1) { width: 17%; } .rp-art th:nth-child(3) { width: 11%; } .rp-art th:nth-child(4) { width: 11%; } .rp-art th:nth-child(5) { width: 14%; }
    .rp-sum th, .rp-sum td { background: #fff; }
    .rp-sum th { background: #d4d4d4; }
    .rp-ed { cursor: pointer; }
    .rp-ed:hover { background: #eaf2fb; }
    .rp-wm { position: absolute; inset: 0; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='170'><text x='150' y='90' text-anchor='middle' transform='rotate(-30 150 85)' font-family='Helvetica,Arial,sans-serif' font-size='28' font-weight='700' fill='%23888' fill-opacity='.22'>Unterschrift fehlt</text></svg>");
      background-repeat: repeat; }
    .art-ed { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
    .art-row { display: grid; grid-template-columns: 1.1fr 2.4fr .7fr .7fr .9fr 44px; gap: 6px; align-items: center; }

    @media (max-width: 700px) { .art-row { grid-template-columns: 1fr 1fr 44px; } .art-text { grid-column: 1 / 3; } }

    /* Version 18: Unterschrift, Report, Dokumente */
    .menu-sub { font-weight: 400; color: var(--danger); font-size: .8em; }
    .sig-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--line); margin: 0 calc(-1 * var(--page-pad, 0px)); }
    .sig-tab { flex: 1; min-height: 46px; background: none; border: 0; border-bottom: 3px solid transparent; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }

    .sig-mailrow { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; font-weight: 600; }
    .sig-note { font-size: 12px; color: var(--muted); margin: 14px 2px 0; line-height: 1.4; }
    .sig-fs-openbtn { width: 100%; margin-top: 10px; min-height: 48px; font-size: 16px; font-weight: 700; }
    .sig-fs { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; height: 100%; z-index: 2000; background: #1a2230; color: #fff; display: none; flex-direction: column; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    .sig-fs.open { display: flex; }
    body.sig-fs-open { overflow: hidden; overscroll-behavior: none; touch-action: none; }
    .sig-fs-bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top, 0px)) 10px 8px; }
    .sig-fs-title { flex: 1 1 120px; font-weight: 700; font-size: 15px; min-width: 0; }
    .sig-fs-hint { flex: 0 0 auto; margin: 0 10px 6px; font-size: 13px; color: #ffe08a; }
    .sig-fs-stage { position: relative; flex: 1 1 auto; min-height: 0; margin: 0 8px max(8px, env(safe-area-inset-bottom, 0px)); background: #121821; border-radius: 10px; overflow: hidden; touch-action: none; }

    .sig-fs-bar .btn { min-height: 44px; }

    .doc-card { padding: 12px 14px; }
    .doc-stat { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 14px; }
    .doc-gen { width: 100%; margin-top: 12px; min-height: 48px; font-size: 16px; }
    .doc-hint { font-size: 12px; color: var(--muted); margin: 8px 4px 0; line-height: 1.4; }
    .docs-dialog { width: min(460px, 100%); }
    .docs-list { display: grid; gap: 8px; margin: 0 0 14px; }
    .docs-file { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; min-height: 52px; padding: 8px 12px; }

    /* Print / PDF – A4 portrait, Watersolution letter layout */

    @media screen and (max-width: 767.98px) {

    /* Tablet landscape (≥768 already uses the two-column default; widen at 900) */

    /* Version 28: Vergrößern-Icon an mehrzeiligen Textfeldern + Vollbild-Editor */

      .pdfed-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; z-index: 500; display: none; }

  <script>

        } else if (f.type === "checkbox-text") {

        } else if (f.type === "checkbox-number") {

      else if (!String(out.meta.auftragsart || "").trim()) out.meta.auftragsart = "Leckageortung";
      /* Version 23: nur true (= Ja / angehakt) bleibt erhalten; false, "nein", null usw. → null (nicht angehakt) */
      TRI_IDS.forEach((id) => {
        const val = out.values[id];

    /* ---------- IndexedDB for photo blobs ---------- */
    let dbPromise = null;
    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            const store = db.createObjectStore(DB_STORE, { keyPath: "key" });
            store.createIndex("auftragId", "auftragId", { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbPromise;
    }

    function photoKey(auftragId, photoId) {
      return auftragId + "::" + photoId;
    }

    async function idbPutPhoto(auftragId, photoId, blob, extra) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(Object.assign({
          key: photoKey(auftragId, photoId),
          auftragId, photoId, blob
        }, extra || {}));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbGetPhoto(auftragId, photoId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const req = tx.objectStore(DB_STORE).get(photoKey(auftragId, photoId));
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbDeletePhoto(auftragId, photoId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).delete(photoKey(auftragId, photoId));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDeleteAuftragPhotos(auftragId) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        const idx = tx.objectStore(DB_STORE).index("auftragId");
        const req = idx.openCursor(IDBKeyRange.only(auftragId));
        req.onsuccess = () => {
          const cursor = req.result;
          if (cursor) { cursor.delete(); cursor.continue(); }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbMergePhoto(auftragId, photoId, patch) {
      const rec = (await idbGetPhoto(auftragId, photoId)) || {
        key: photoKey(auftragId, photoId), auftragId, photoId
      };
      Object.assign(rec, patch);
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(rec);
        tx.oncomplete = () => resolve(rec);
        tx.onerror = () => reject(tx.error);
      });
    }

    const objectUrls = new Set();
    function blobUrl(blob) {
      const u = URL.createObjectURL(blob);
      objectUrls.add(u);
      return u;
    }
    function revokeUrls() {
      objectUrls.forEach((u) => URL.revokeObjectURL(u));
      objectUrls.clear();
    }

    function downscaleFile(file, maxSize, quality) {
      maxSize = maxSize || 1600;
      quality = quality || 0.82;
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if (w > maxSize || h > maxSize) {
            const scale = maxSize / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => {
            if (!blob) reject(new Error("encode"));
            else resolve({ blob, width: w, height: h });
          }, "image/jpeg", quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
        img.src = url;
      });
    }

    async function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
      });
    }

    /* v33: Inhalts-Prüfsumme (ohne Zeitstempel/Ansichts-Einstellungen). updatedAt wird bei jedem Speichern
       gesetzt (auch beim bloßen Öffnen) – für den Abgleich zählt deshalb changedAt (nur bei echter Änderung). */
    function auftragContentHash(r) {
      const str = JSON.stringify({ meta: r.meta || {}, values: r.values || {}, mitarbeiter: r.mitarbeiter || {}, photos: r.photos || [], status: r.status || "offen", abgeschlossenAm: r.abgeschlossenAm || null });
      let h1 = 0x811c9dc5, h2 = 0x01000193;
      for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 + c, 2654435761) ^ (h2 >>> 13); }
      return (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0") + ":" + str.length;
    }
    function auftragChangeTime(r) {
      const t = Date.parse((r && (r.changedAt || r.updatedAt || r.createdAt)) || "");
      return isFinite(t) ? t : 0;
    }
    function persistCurrent() {
      current.updatedAt = nowIso();
      try {
        const h = auftragContentHash(current);
        if (current.contentHash && current.contentHash !== h) current.changedAt = current.updatedAt;
        current.contentHash = h;
      } catch (e) {}
      current.photoSortMode = photoSortMode;
      try { localStorage.setItem(STORAGE_CURRENT, JSON.stringify(current)); }
      catch (e) { toast("Speichern nicht möglich (Speicher voll?)", true); }
    }

    function orderedPhotos() {
      const list = (current.photos || []).slice();
      list.sort((a, b) => {
        const sa = Number(a.sortiernummer) || 0;
        const sb = Number(b.sortiernummer) || 0;
        if (sa !== sb) return sa - sb;
        return String(a.addedAt || "").localeCompare(String(b.addedAt || ""));
      });
      return list;
    }

    function photosByDate() {
      const list = (current.photos || []).slice();
      list.sort((a, b) => {
        const da = a.date || "";
        const db = b.date || "";
        if (da !== db) return da.localeCompare(db);
        return String(a.addedAt || "").localeCompare(String(b.addedAt || ""));
      });
      return list;
    }

    function sortedPhotos() {
      return photoSortMode === "date" ? photosByDate() : orderedPhotos();
    }

    function applyPhotoOrder(list, mode) {
      const ordered = list.slice();
      ordered.forEach((p, i) => { p.sortiernummer = i + 1; });
      current.photos = ordered;
      if (mode) photoSortMode = mode;
      current.photoSortMode = photoSortMode;
      persistCurrent();
    }

    function ensurePhotoOrder() {
      const list = orderedPhotos();
      const messy = list.some((p, i) => Number(p.sortiernummer) !== i + 1);
      if (messy) applyPhotoOrder(list, photoSortMode === "date" ? "date" : "custom");
    }

    function nextSortNumber() {
      return (current.photos || []).length + 1;
    }

    function movePhotoBy(id, delta) {
      const list = orderedPhotos();
      const i = list.findIndex((p) => p.id === id);
      if (i < 0) return;
      const j = i + delta;
      if (j < 0 || j >= list.length) return;
      const tmp = list[i];
      list[i] = list[j];
      list[j] = tmp;
      applyPhotoOrder(list, "custom");
      renderApp();
    }

    function movePhotoToPosition(id, pos) {
      const list = orderedPhotos();
      const i = list.findIndex((p) => p.id === id);
      if (i < 0) return;
      const item = list.splice(i, 1)[0];
      const n = list.length + 1;
      let target = parseInt(pos, 10);
      if (!isFinite(target) || target < 1) target = n;
      if (target > n) target = n;
      list.splice(target - 1, 0, item);
      applyPhotoOrder(list, "custom");
    }

    /* ---------- Render fields (Bericht) ---------- */
    function inputHtml(f) {
      const val = current.values[f.id];
      const ph = f.placeholder ? ` placeholder="${attr(f.placeholder)}"` : "";
      if (f.type === "textarea") {
        return `<textarea id="f-${f.id}" data-id="${f.id}"${ph}>${escapeHtml(val)}</textarea>`;
      }
      if (f.type === "checkbox") {
        return `<input type="checkbox" id="f-${f.id}" data-id="${f.id}" ${val ? "checked" : ""} />`;
      }
      if (f.type === "decimal") {
        return `<input type="text" inputmode="decimal" id="f-${f.id}" data-id="${f.id}" value="${attr(val)}"${ph} />`;
      }
      if (f.type === "select") {
        const opts = (f.options || []).map((o) => {
          const sel = String(val) === String(o) ? " selected" : "";
          return `<option value="${attr(o)}"${sel}>${escapeHtml(o)}</option>`;
        }).join("");
        return `<select id="f-${f.id}" data-id="${f.id}">${opts}</select>`;
      }
      const typ = f.type === "number" ? "number" : f.type;
      const step = typ === "number" ? ' step="1" min="0"' : "";
      return `<input type="${typ}" id="f-${f.id}" data-id="${f.id}" value="${attr(val)}"${ph}${step} />`;
    }

    function renderBerichtPanels(container) {
      container.innerHTML = TABS.map((t) => {
        const chunks = [];
        let open = false;
        const closeCard = () => { if (open) { chunks.push("</div>"); open = false; } };
        const openCard = () => { if (!open) { chunks.push('<div class="card">'); open = true; } };

        t.fields.forEach((f) => {
          if (f.type === "section") {
            closeCard();
            chunks.push(`<div class="section"><div class="section-title">${escapeHtml(f.title)}</div></div>`);
            return;
          }
          if (f.type === "extend") {
            closeCard();
            chunks.push(`<p class="extend-note">Weitere Felder können hier später ergänzt werden.</p>`);
            return;
          }
          openCard();
          if (f.type === "textarea") {
            chunks.push(`<div class="row label-top"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);
          } else if (f.type === "checkbox") {
            chunks.push(`<div class="row check"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);
          } else if (f.type === "checkbox-pair") {
            chunks.push(`<div class="row pair">
              <label class="lbl" for="f-${f.left.id}">${escapeHtml(f.left.label)}</label>
              ${inputHtml({ ...f.left, type: "checkbox" })}
              <label class="lbl right-lbl" for="f-${f.right.id}">${escapeHtml(f.right.label)}</label>
              ${inputHtml({ ...f.right, type: "checkbox" })}
            </div>`);
          } else if (f.type === "text-checkbox") {
            chunks.push(`<div class="row pair mixed">
              <label class="lbl" for="f-${f.text.id}">${escapeHtml(f.text.label)}</label>
              ${inputHtml({ ...f.text, type: "text" })}
              <label class="lbl right-lbl" for="f-${f.check.id}">${escapeHtml(f.check.label)}</label>
              ${inputHtml({ ...f.check, type: "checkbox" })}
            </div>`);
          } else if (f.type === "checkbox-text") {
            chunks.push(`<div class="row pair mixed">
              <label class="lbl" for="f-${f.check.id}">${escapeHtml(f.check.label)}</label>
              ${inputHtml({ ...f.check, type: "checkbox" })}
              <label class="lbl right-lbl" for="f-${f.text.id}">${escapeHtml(f.text.label)}</label>
              ${inputHtml({ ...f.text, type: "text" })}

          } else if (f.type === "checkbox-number") {
            chunks.push(`<div class="row pair mixed">
              <label class="lbl" for="f-${f.check.id}">${escapeHtml(f.check.label)}</label>

              ${inputHtml({ ...f.number, type: "number" })}

          } else {
            chunks.push(`<div class="row"><label class="lbl" for="f-${f.id}">${escapeHtml(f.label)}</label>${inputHtml(f)}</div>`);
          }
        });
        closeCard();
        return `<section class="panel${t.id === activeTab ? " active" : ""}" id="panel-${t.id}" role="tabpanel">${chunks.join("")}</section>`;
      }).join("");
      container.querySelectorAll("[data-id]").forEach((el) => {
        const id = el.getAttribute("data-id");

    function renderMitarbeiter() {
      const ph = "Geben Sie hier Ihren Text ein";
      return `<div class="section" style="margin-top:8px"><div class="section-title">Zeiten und Notizen</div></div>
        <div class="card">
          <div class="row"><label class="lbl" for="mit-startzeit">Startzeit</label>${mitInput("startzeit", "datetime-local")}</div>

    function fotoItemHtml(p, idx, n) {
        const missing = photoNeedsComment(p);
        const first = idx === 0;
        const last = idx === n - 1;
        return `<div class="foto-item${missing ? " no-comment" : ""}" data-open-photo="${p.id}" data-index="${idx}" tabindex="0" role="button">
          <button type="button" class="foto-handle" data-drag-handle title="Verschieben" aria-label="Reihenfolge ändern">${ICO.handle}</button>
          <img class="foto-thumb" alt="" data-thumb="${p.id}" />
          <div class="foto-meta">
            <span class="foto-name">${escapeHtml(p.name)}</span>
            <span class="foto-sub">Nr. ${p.sortiernummer} · ${escapeHtml(formatDateDe(p.date))}${p.annotated ? ' <span class="foto-badge">Markiert</span>' : ""}${p.druck ? ' <span class="foto-badge foto-badge-druck" title="Wird auf den Leckortungsbericht gedruckt">' + ICO.printer + ' Druck</span>' : ""}</span>
            ${missing ? '<span class="foto-flag">Kommentar fehlt</span>' : (p.comment ? `<span class="foto-sub">${escapeHtml(String(p.comment).replace(/\n+/g, " "))}</span>` : "")}
          </div>
          ${fotoDruckBtnHtml(p)}
          <div class="foto-move">
            <button type="button" class="icon-btn" data-move-up="${p.id}" title="Nach oben" aria-label="Nach oben"${first ? " disabled" : ""}>${ICO.up}</button>
            <button type="button" class="icon-btn" data-move-down="${p.id}" title="Nach unten" aria-label="Nach unten"${last ? " disabled" : ""}>${ICO.down}</button>
          </div>
          <button type="button" class="icon-btn" data-del-photo="${p.id}" title="Foto löschen" aria-label="Foto löschen">${ICO.trash}</button>
        </div>`;
    }

    function renderFotosListSkeleton() {
      ensurePhotoOrder();
      const list = sortedPhotos();
      const n = list.length;
      const count = (n === 1 ? "1 Eintrag gefunden" : n + " Einträge gefunden")
        + " · " + (photoSortMode === "date" ? "nach Datum" : "eigene Reihenfolge");
      const items = list.map((p, idx) => fotoItemHtml(p, idx, n)).join("");
      return `<div class="fotos-wrap">
        <div class="fotos-count">${escapeHtml(count)}</div>
        <div class="foto-list" id="fotoList">${items || '<div class="empty-list">Noch keine Fotos. Tippen Sie oben rechts auf +, um Bilder aus der Galerie hinzuzufügen.</div>'}</div>
      </div>`;
    }

    function renderFotoDetailSkeleton() {
      const p = getPhoto(activePhotoId);
      if (!p) return `<div class="fotos-wrap"><p>Foto nicht gefunden.</p></div>`;
      const dis = "";
      const commentInvalid = photoNeedsComment(p);
      return `<div class="fdetail">
        <div class="fdetail-img-wrap" id="fotoZoom" title="Tippen für Vollbild">
          <img id="fotoDetailImg" alt="${attr(p.name)}" />
        </div>
        <div class="fdetail-body">
          <div class="fg fg-druck">
            <div class="fg-cap">Druck</div>
            ${druckSwitchHtml(p)}
          </div>
          ${p.annotated ? '<button type="button" class="btn btn-restore" id="btnRestoreOriginal">Original wiederherstellen</button>' : ""}
          <div class="fg">
            <div class="fg-cap">Name</div>
            <div class="ro">${escapeHtml(p.name)}</div>
          </div>
          <div class="fg">
            <div class="fg-cap">Kommentar</div>
            <textarea id="photoComment" data-phfield="comment" placeholder="Geben Sie hier Ihren Text ein"${dis} class="${commentInvalid && photoEditMode ? "is-invalid" : ""}">${escapeHtml(p.comment)}</textarea>
            <p class="hint${commentInvalid ? " show" : ""}" id="commentHint">Ein Kommentar ist erforderlich, wenn das Foto auf den Leckortungsbericht gedruckt wird.</p>

            <div class="ro">${escapeHtml(formatDateDe(p.date))}</div>

            <div class="fg-cap">Folgeauftrag</div>
            <label class="check-row">
              <span>Anlage Folgeauftrag</span>
              <input type="checkbox" id="photoFolge" ${p.folgeauftrag ? "checked" : ""} />
            </label>
          </div>
          <div class="fg">
            <div class="fg-cap">Sortiernummer</div>
            <input type="number" id="photoSort" step="1" min="1" value="${attr(p.sortiernummer)}" />
          </div>
        </div>
      </div>`;

    function druckSwitchHtml(p) {
      const on = !!(p && p.druck);
      return `<button type="button" class="druck-switch" id="photoDruck" role="switch" aria-checked="${on ? "true" : "false"}">
              <span class="ds-text">Druck auf Leckortungsbericht<span class="ds-state">${on ? "An – wird gedruckt" : "Aus – wird nicht gedruckt"}</span></span>
              <span class="ds-track" aria-hidden="true"><span class="ds-knob"></span></span>
            </button>`;
    }

    function setDruckSwitchState(el, on) {
      if (!el) return;
      el.setAttribute("aria-checked", on ? "true" : "false");
      const st = el.querySelector(".ds-state");
      if (st) st.textContent = on ? "An – wird gedruckt" : "Aus – wird nicht gedruckt";
    }

    /* Schutz gegen Doppel-Tipp (z. B. Fernzugriff/Zoom-Geste): ein zweiter Klick
       innerhalb kurzer Zeit würde den Schalter sofort wieder zurücksetzen. */
    function druckTapAccepted(el, e) {
      if (e && e.detail > 1) return false;
      const now = Date.now();
      const last = Number(el.dataset.lastToggle || 0);
      if (now - last < 450) return false;
      el.dataset.lastToggle = String(now);
      return true;
    }

    function fotoDruckBtnHtml(p) {
      const on = !!p.druck;
      return `<button type="button" class="foto-druck-btn" data-druck-toggle="${p.id}" role="switch" aria-checked="${on ? "true" : "false"}" title="Druck auf Leckortungsbericht" aria-label="Druck auf Leckortungsbericht">${ICO.printer}<span>Druck</span><span class="fd-state">${on ? "an" : "aus"}</span></button>`;
    }

    function toggleDruckInList(btn) {
      const id = btn.getAttribute("data-druck-toggle");
      const p = getPhoto(id);
      if (!p) return;
      p.druck = !p.druck;
      persistCurrent();
      const item = btn.closest(".foto-item");
      if (item) {
        const tmp = document.createElement("div");
        tmp.innerHTML = fotoItemHtml(p, Number(item.getAttribute("data-index")) || 0, (current.photos || []).length);
        const fresh = tmp.firstElementChild;
        const thumb = item.querySelector("[data-thumb]");
        const freshThumb = fresh.querySelector("[data-thumb]");
        if (thumb && freshThumb) freshThumb.replaceWith(thumb);
        item.replaceWith(fresh);
        bindFotoItem(fresh);
        const nb = fresh.querySelector("[data-druck-toggle]");
        if (nb) { nb.dataset.lastToggle = btn.dataset.lastToggle || ""; nb.focus({ preventScroll: true }); }
      }
      renderTabs();
      if (photoNeedsComment(p)) toast("Druck an – bitte noch einen Kommentar ergänzen.", true);
    }

    async function fillPhotoImages() {
      if (view === "fotos") {
        const thumbs = main.querySelectorAll("[data-thumb]");
        for (const img of thumbs) {
          const rec = await idbGetPhoto(current.id, img.getAttribute("data-thumb"));
          if (displayBlob(rec)) img.src = blobUrl(displayBlob(rec));
        }
      } else if (view === "fotodetail" && activePhotoId) {
        const img = document.getElementById("fotoDetailImg");
        if (img) {
          const rec = await idbGetPhoto(current.id, activePhotoId);
          if (displayBlob(rec)) img.src = blobUrl(displayBlob(rec));
        }
      }
    }

    function bindMetaAndMit() {
      main.querySelectorAll("[data-meta]").forEach((el) => {
        const handler = () => {
          current.meta[el.getAttribute("data-meta")] = el.value;
          persistCurrent();
          const title = document.getElementById("hdrTitle");
          if (title && view === "overview") title.textContent = headerTitle();
        };
        el.addEventListener("input", handler);
        el.addEventListener("change", handler);
      });
      main.querySelectorAll("[data-mit]").forEach((el) => {
        const ev = el.type === "checkbox" ? "change" : "input";
        el.addEventListener(ev, () => {
          current.mitarbeiter[el.getAttribute("data-mit")] = el.type === "checkbox" ? el.checked : el.value;
          persistCurrent();
        });
      });
      main.querySelectorAll("[data-goto]").forEach((el) => {
        el.addEventListener("click", () => {
          const dest = el.getAttribute("data-goto");
          if (dest === "bericht") { activeTab = TABS[0].id; showView("bericht"); }
          else if (dest === "pdfeditor") openPdfEditor();
          else showView(dest);
        });
      });
      main.querySelectorAll("[data-open-photo]").forEach((el) => bindFotoItem(el, true));
      bindFotoDrag();
      bindPhotoDetailFields();
      const notiz = document.getElementById("mit-notiz");
      if (notiz) {
        updateNotizCount();
        notiz.addEventListener("input", updateNotizCount);
      }
    }

    const NOTIZ_LIMIT = 2048;
    const NOTIZ_WARN = 1900;
    function updateNotizCount() {
      const ta = document.getElementById("mit-notiz");
      const el = document.getElementById("notizCount");
      if (!ta || !el) return;
      const n = (ta.value || "").length;
      const over = n > NOTIZ_LIMIT;
      const atLimit = n >= NOTIZ_LIMIT;
      el.className = "char-count" + (atLimit ? " over" : (n >= NOTIZ_WARN ? " warn" : ""));
      if (over) {
        el.innerHTML = n + " / " + NOTIZ_LIMIT + '<span class="char-hint">EasyTec-Limit überschritten</span>';
      } else {
        el.textContent = n + " / " + NOTIZ_LIMIT;
      }
    }

    function bindFotoItem(el, skipDrag) {
      el.addEventListener("click", (e) => {
        if (e.target.closest("[data-del-photo], [data-drag-handle], [data-move-up], [data-move-down], .foto-move, [data-druck-toggle]")) return;
        if (el.dataset.didDrag === "1") { el.dataset.didDrag = ""; return; }
        openPhotoDetail(el.getAttribute("data-open-photo"), false);
      });
      el.addEventListener("keydown", (e) => {
        if (e.target !== el) return;
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openPhotoDetail(el.getAttribute("data-open-photo"), false);
        }
      });
      el.querySelectorAll("[data-del-photo]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          deletePhoto(b.getAttribute("data-del-photo"));
        });
      });
      el.querySelectorAll("[data-move-up]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          movePhotoBy(b.getAttribute("data-move-up"), -1);
        });
      });
      el.querySelectorAll("[data-move-down]").forEach((b) => {
        b.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          movePhotoBy(b.getAttribute("data-move-down"), 1);
        });
      });
      el.querySelectorAll("[data-druck-toggle]").forEach((b) => {
        b.addEventListener("pointerdown", (e) => e.stopPropagation());
        b.addEventListener("dblclick", (e) => { e.preventDefault(); e.stopPropagation(); });
        b.addEventListener("click", (e) => {
          e.preventDefault(); e.stopPropagation();
          if (!druckTapAccepted(b, e)) return;
          toggleDruckInList(b);
        });
      });
      if (!skipDrag) el.querySelectorAll("[data-drag-handle]").forEach((h) => h.addEventListener("pointerdown", onFotoPointerDown));
    }

    function bindPhotoCheckbox(el, apply) {
      if (!el) return;
      el.disabled = false;
      el.removeAttribute("disabled");
      const sync = () => {
        apply(!!el.checked);
        persistCurrent();
      };
      el.addEventListener("change", sync);
    }

    function bindPhotoDetailFields() {
      const comment = document.getElementById("photoComment");
      const folge = document.getElementById("photoFolge");
      const sort = document.getElementById("photoSort");
      const druck = document.getElementById("photoDruck");
      const zoom = document.getElementById("fotoZoom");
      if (comment) {
        comment.addEventListener("input", () => {
          readPhotoDetailIntoModel();
          persistCurrent();
          updateCommentHint(false);
        });
      }
      bindPhotoCheckbox(folge, (on) => {
        const p = getPhoto(activePhotoId);
        if (p) p.folgeauftrag = on;
      });
      if (druck) {
        druck.addEventListener("dblclick", (e) => { e.preventDefault(); e.stopPropagation(); });
        druck.addEventListener("click", (e) => {
          e.preventDefault();
          if (!druckTapAccepted(druck, e)) return;
          const p = getPhoto(activePhotoId);
          if (!p) return;
          p.druck = !p.druck;
          setDruckSwitchState(druck, p.druck);
          persistCurrent();
          updateCommentHint(false);
        });
      }
      if (sort) {
        sort.addEventListener("change", () => {
          movePhotoToPosition(activePhotoId, sort.value);
          const p = getPhoto(activePhotoId);
          if (p) sort.value = p.sortiernummer;
          toast("Reihenfolge aktualisiert (Nr. " + (p && p.sortiernummer) + ")");
        });
      }
      if (zoom) zoom.addEventListener("click", openLightbox);
      const restore = document.getElementById("btnRestoreOriginal");
      if (restore) restore.addEventListener("click", restoreOriginalPhoto);
    }

    function readPhotoDetailIntoModel() {
      if (view !== "fotodetail") return;
      const p = getPhoto(activePhotoId);
      if (!p) return;
      const comment = document.getElementById("photoComment");
      const folge = document.getElementById("photoFolge");
      const sort = document.getElementById("photoSort");
      const druck = document.getElementById("photoDruck");
      if (comment) p.comment = comment.value;
      if (folge) p.folgeauftrag = folge.checked;
      if (druck) p.druck = druck.getAttribute("aria-checked") === "true";
    }

    function openPhotoDetail(id, editMode) {
      const p = getPhoto(id);
      if (!p) return;
      activePhotoId = id;
      photoEditMode = editMode || photoNeedsComment(p);
      showView("fotodetail", { photoId: id, editMode: photoEditMode });
      setTimeout(() => {
        const ta = document.getElementById("photoComment");
        if (ta && photoNeedsComment(p)) ta.focus();
      }, 50);
    }

    function savePhotoDetail() {
      readPhotoDetailIntoModel();
      const sortEl = document.getElementById("photoSort");
      if (sortEl) movePhotoToPosition(activePhotoId, sortEl.value);
      const p = getPhoto(activePhotoId);
      if (photoNeedsComment(p)) {
        updateCommentHint(true);
        toast("Bitte geben Sie einen Kommentar ein, weil „Druck auf Leckortungsbericht“ aktiv ist.", true);
        return;
      }
      persistCurrent();
      photoEditMode = false;
      saveToList(true);
      renderApp();
      toast("Foto gespeichert");
    }

    function sortPhotosClick() {
      if (photoSortMode === "custom") {
        if (!current.photos || current.photos.length < 2) {
          photoSortMode = "date";
          persistCurrent();
          renderApp();
          toast("Anzeige: nach Datum");
          return;
        }
        if (!confirm("Nach Datum sortieren? Die bisherige Reihenfolge wird überschrieben, die Sortiernummern werden neu vergeben.")) return;
        applyPhotoOrder(photosByDate(), "date");
        renderApp();
        toast("Sortiert nach Datum");
      } else {
        photoSortMode = "custom";
        persistCurrent();
        renderApp();
        toast("Anzeige: eigene Reihenfolge");
      }
    }

    /* Pointer-Events drag & drop (mouse + touch), handle only so list scroll stays intact */
    let fotoDrag = null;
    let fotoDragScrollRaf = 0;

    function bindFotoDrag() {
      const list = document.getElementById("fotoList");
      if (!list) return;
      list.querySelectorAll("[data-drag-handle]").forEach((handle) => {
        handle.addEventListener("pointerdown", onFotoPointerDown);
      });
    }

    function onFotoPointerDown(e) {
      if (e.button != null && e.button !== 0) return;
      const handle = e.currentTarget;
      const item = handle.closest(".foto-item");
      const list = document.getElementById("fotoList");
      if (!item || !list) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = item.getBoundingClientRect();
      const ghost = item.cloneNode(true);
      ghost.classList.add("foto-ghost");
      ghost.removeAttribute("data-open-photo");
      ghost.style.width = rect.width + "px";
      ghost.style.left = rect.left + "px";
      ghost.style.top = rect.top + "px";
      document.body.appendChild(ghost);
      item.classList.add("is-placeholder");
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      fotoDrag = {
        item: item,
        list: list,
        ghost: ghost,
        pointerId: e.pointerId,
        offsetY: e.clientY - rect.top,
        lastY: e.clientY,
        moved: false,
        fromIndex: Number(item.getAttribute("data-index")) || 0
      };
      stopFotoAutoScroll();
      document.addEventListener("pointermove", onFotoPointerMove);
      document.addEventListener("pointerup", onFotoPointerUp);
      document.addEventListener("pointercancel", onFotoPointerUp);
    }

    function fotoRowAtPoint(clientY) {
      const rows = [...document.querySelectorAll("#fotoList > .foto-item")];
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].getBoundingClientRect();
        const mid = r.top + r.height / 2;
        if (clientY < mid) return { row: rows[i], index: i, before: true };
      }
      if (!rows.length) return null;
      return { row: rows[rows.length - 1], index: rows.length - 1, before: false };
    }

    function onFotoPointerMove(e) {
      if (!fotoDrag) return;
      if (fotoDrag.pointerId != null && e.pointerId !== fotoDrag.pointerId) return;
      e.preventDefault();
      const y = e.clientY;
      if (Math.abs(y - fotoDrag.lastY) > 2) fotoDrag.moved = true;
      fotoDrag.lastY = y;
      const gh = fotoDrag.ghost.getBoundingClientRect().height;
      let top = y - fotoDrag.offsetY;
      fotoDrag.ghost.style.top = top + "px";
      const hit = fotoRowAtPoint(y);
      if (hit && hit.row !== fotoDrag.item) {
        if (hit.before) hit.row.parentNode.insertBefore(fotoDrag.item, hit.row);
        else hit.row.parentNode.appendChild(fotoDrag.item);
      }
      maybeFotoAutoScroll(y);
    }

    function maybeFotoAutoScroll(clientY) {
      const scroller = document.getElementById("main");
      if (!scroller) return;
      const r = scroller.getBoundingClientRect();
      const edge = 56;
      let dir = 0;
      if (clientY < r.top + edge) dir = -1;
      else if (clientY > r.bottom - edge) dir = 1;
      fotoDrag.scrollDir = dir;
      if (dir && !fotoDragScrollRaf) {
        const step = () => {
          if (!fotoDrag || !fotoDrag.scrollDir) { fotoDragScrollRaf = 0; return; }
          scroller.scrollTop += fotoDrag.scrollDir * 14;
          fotoDragScrollRaf = requestAnimationFrame(step);
        };
        fotoDragScrollRaf = requestAnimationFrame(step);
      }
      if (!dir) stopFotoAutoScroll();
    }

    function stopFotoAutoScroll() {
      if (fotoDragScrollRaf) cancelAnimationFrame(fotoDragScrollRaf);
      fotoDragScrollRaf = 0;
      if (fotoDrag) fotoDrag.scrollDir = 0;
    }

    function onFotoPointerUp(e) {
      if (!fotoDrag) return;
      if (e && fotoDrag.pointerId != null && e.pointerId !== fotoDrag.pointerId) return;
      document.removeEventListener("pointermove", onFotoPointerMove);
      document.removeEventListener("pointerup", onFotoPointerUp);
      document.removeEventListener("pointercancel", onFotoPointerUp);
      stopFotoAutoScroll();
      const list = fotoDrag.list;
      const item = fotoDrag.item;
      const moved = fotoDrag.moved;
      if (fotoDrag.ghost && fotoDrag.ghost.parentNode) fotoDrag.ghost.parentNode.removeChild(fotoDrag.ghost);
      item.classList.remove("is-placeholder");
      if (moved) item.dataset.didDrag = "1";
      const ids = [...list.querySelectorAll(".foto-item[data-open-photo]")].map((el) => el.getAttribute("data-open-photo"));
      fotoDrag = null;
      if (moved && ids.length) {
        const byId = {};
        (current.photos || []).forEach((p) => { byId[p.id] = p; });
        const ordered = ids.map((id) => byId[id]).filter(Boolean);
        if (ordered.length === (current.photos || []).length) {
          applyPhotoOrder(ordered, "custom");
          renderApp();
          toast("Reihenfolge gespeichert");
        }
      }
    }

    async function addPhotosFromFiles(fileList) {

          const p = migratePhoto({
            id: uid("p"),

            date: todayDate(),
            addedAt: nowIso(),
            comment: "",
            folgeauftrag: false,
            sortiernummer: nextSortNumber(),

          });
          current.photos.push(p);
          await idbPutPhoto(current.id, p.id, scaled.blob, { width: scaled.width, height: scaled.height, mime: "image/jpeg" });
          newIds.push(p.id);
        } catch (err) {
          toast("Bild konnte nicht geladen werden: " + (file.name || ""), true);

    function saveToList(silent) {

    function auftragContentEquals(a, b) {
      const strip = (r) => JSON.stringify({
        meta: r && r.meta || {},
        values: r && r.values || {},
        mitarbeiter: r && r.mitarbeiter || {},
        photos: (r && r.photos || []).map((p) => p.id)
      });
      return strip(a) === strip(b);
    }
    function isPristineAuftrag(r) {
      if (!r) return true;
      if (sigStore.owner === r.id && (sigStore.ma.length || sigStore.kunde.length)) return false;
      if (r.photos && r.photos.length) return false;
      const fresh = freshAuftrag();
      return auftragContentEquals(r, fresh);
    }
    function syncCurrentIntoList() {
      if (view === "fotodetail") readPhotoDetailIntoModel();
      persistCurrent();
      const idx = reports.findIndex((r) => r.id === current.id);
      if (idx >= 0) {
        reports[idx] = JSON.parse(JSON.stringify(current));
        return;
      }
      if (!isPristineAuftrag(current)) {
        reports.unshift(JSON.parse(JSON.stringify(current)));
      }
    }
    function sortReportsNewestFirst() {
      reports.sort((a, b) => {
        const ca = Date.parse(a.createdAt || a.updatedAt || 0) || 0;
        const cb = Date.parse(b.createdAt || b.updatedAt || 0) || 0;
        if (cb !== ca) return cb - ca;
        const ua = Date.parse(a.updatedAt || 0) || 0;
        const ub = Date.parse(b.updatedAt || 0) || 0;
        if (ub !== ua) return ub - ua;
        return String(b.id || "").localeCompare(String(a.id || ""));
      });
    }
    function newAuftrag() {
      syncCurrentIntoList();
      current = freshAuftrag();
      photoSortMode = "custom";
      reports.unshift(JSON.parse(JSON.stringify(current)));
      sortReportsNewestFirst();
      persistCurrent();
      persistList();

    /* ================= Aufträge-Liste (wie EasyTec) + Sync-Schicht (Version 22) =================
       Einstellungen: localStorage "leckortung.settings" = { "serverUrl": "https://server.example" } (leer = nicht eingerichtet).

       Server-API (erwartetes JSON):
       GET  {serverUrl}/auftraege
            -> { "auftraege": [ Auftrag, ... ] }   (oder direkt ein Array)
            Auftrag = {
              "nr": "WA260489-001",              // Pflicht, eindeutiger Schlüssel (alternativ "auftragsNr")
              "kunde": "Max Mustermann", "anrede": "Herr",
              "strasse": "Hambacher Straße 25", "plz": "67433", "ort": "Neustadt an der Weinstraße",
              "auftragsart": "Leckageortung, (L)",  // optional
              "projekt": "WS WEG Am Schlossberg 10, Maikammer",  // optional
              "start": "2026-11-18T08:00", "ende": "2026-11-18T11:00"   // optional, ISO lokal
            }
            Bereits vorhandene Nummern werden nicht überschrieben; neue erscheinen mit "NEW"-Badge.
       POST {serverUrl}/auftraege/{nr}   Content-Type: application/json
            Body = { "format": "leckortung-auftrag", "formatVersion": 1, "appVersion": 22, "auftragsNr", "status": "abgeschlossen",
                     "abgeschlossenAm": ISO, "meta": {...}, "values": {...}, "mitarbeiter": {...},
                     "photos": [ { order, id, name, comment, druck, annotated, annotationsRelative: [...] } ] }
            Fotos nur als Metadaten (ohne Bilddaten). Unterschriften sind NIE enthalten (sie liegen getrennt pro Auftrag in IndexedDB
            und landen ausschließlich in den lokal erzeugten PDFs). Antwort 2xx = angenommen.
    */
    const STORAGE_SETTINGS = "leckortung.settings";
    function loadSettings() {
      try { return Object.assign({ serverUrl: "" }, JSON.parse(localStorage.getItem(STORAGE_SETTINGS) || "{}")); }
      catch (e) { return { serverUrl: "" }; }
    }
    function saveSettings(s) { try { localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(s)); } catch (e) {} }
    function serverBase() {
      const u = String(loadSettings().serverUrl || "").trim().replace(/\/+$/, "");
      return /^https?:\/\//i.test(u) ? u : "";
    }

    const SYNC_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6c0 1-.25 1.97-.7 2.8l1.46 1.46A8 8 0 0 0 20 12a8 8 0 0 0-8-8zm0 14a6 6 0 0 1-6-6c0-1 .25-1.97.7-2.8L5.24 7.74A8 8 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4v3z"/></svg>';
    const FLAG_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="3" width="2" height="18"/><path d="M5.4 4h3.5v3.5H5.4zM12 4h3.5v3.5H12zM8.9 7.5h3.1V11H8.9zM15.5 7.5H19V11h-3.5zM5.4 11h3.5v3.5H5.4zM12 11h3.5v3.5H12z"/><rect x="5.4" y="4" width="13.6" height="10.5" fill="none" stroke="currentColor" stroke-width="1"/></svg>';
    const SIGN_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(0,-2.2) scale(.95)" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/><rect x="3" y="20.2" width="18" height="1.8" rx=".9"/></svg>';

    /* ---------- Listen-Ansicht ---------- */
    const aufState = { kat: "alle", q: "", name: false, nr: false, adresse: false, alle: true, asc: true };
    function aufStart(r) {
      return (r.meta && r.meta.terminVon) || (r.values && (r.values.messterminVon || r.values.datum)) || r.createdAt || r.updatedAt || "";
    }
    function aufAdresse(r) {
      const m = r.meta || {};
      return [m.strasse, [m.plz, m.ort].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    }
    function aufProjekt(r) {
      const m = r.meta || {}, v = r.values || {};
      return String(m.projekt || "").trim() || [v.versicherungsgesellschaft, v.schadenNr].filter((x) => String(x || "").trim()).join(", ");
    }
    function aufArt(r) { return String((r.meta && r.meta.auftragsart) || "").trim(); }
    function aufMatches(r) {
      const m = r.meta || {};
      if (aufState.kat === "neu" && !r.neu) return false;
      if (aufState.kat === "offen" && r.status === "abgeschlossen") return false;
      if (aufState.kat === "abgeschlossen" && r.status !== "abgeschlossen") return false;
      if (aufState.kat === "wartet" && r.sync !== "wartet") return false;
      if (aufState.kat.indexOf("art:") === 0 && aufArt(r) !== aufState.kat.slice(4)) return false;
      const q = aufState.q.trim().toLowerCase();
      if (!q) return true;
      const parts = [];
      if (aufState.alle || aufState.name) parts.push(m.kunde);
      if (aufState.alle || aufState.nr) parts.push(m.auftragsNr);
      if (aufState.alle || aufState.adresse) parts.push(aufAdresse(r));
      if (aufState.alle) parts.push(aufArt(r), aufProjekt(r), m.anrede, (r.values || {}).schadenNr);
      return parts.join(" \n ").toLowerCase().indexOf(q) >= 0;
    }
    function aufStatusChips(r) {
      let h = "";
      if (r.status === "abgeschlossen") {
        h += r.sync === "wartet"
          ? '<span class="auf-chip warn" title="Abgeschlossen, wartet auf Sync">⟳ Wartet auf Sync</span>'
          : '<span class="auf-chip ok">✓ Abgeschlossen' + (r.sync === "gesendet" ? " · gesendet" : "") + "</span>";
      }
      return h;
    }
    function renderAufFilter() {
      const sel = document.getElementById("aufKat");
      if (!sel) return;
      const arts = Array.from(new Set(reports.map(aufArt).filter(Boolean))).sort();
      const opts = [["alle", "Alle Kategorien"], ["neu", "Neu"], ["offen", "Offen"], ["abgeschlossen", "Abgeschlossen"], ["wartet", "Wartet auf Sync"]]
        .concat(arts.map((a) => ["art:" + a, a]));
      if (!opts.some((o) => o[0] === aufState.kat)) aufState.kat = "alle";
      sel.innerHTML = opts.map((o) => `<option value="${attr(o[0])}"${o[0] === aufState.kat ? " selected" : ""}>${escapeHtml(o[1])}</option>`).join("");
      document.getElementById("aufSuche").value = aufState.q;
      ["name", "nr", "adresse", "alle"].forEach((k) => { document.getElementById("auf-" + k).checked = !!aufState[k]; });
    }
    function bindAufFilter() {
      document.getElementById("aufKat").addEventListener("change", (e) => { aufState.kat = e.target.value; renderReportList(); });
      document.getElementById("aufSuche").addEventListener("input", (e) => { aufState.q = e.target.value; renderReportList(); });
      ["name", "nr", "adresse", "alle"].forEach((k) => document.getElementById("auf-" + k).addEventListener("change", (e) => {
        aufState[k] = e.target.checked;
        if (k === "alle" && e.target.checked) { aufState.name = aufState.nr = aufState.adresse = false; }
        else if (e.target.checked) aufState.alle = false;
        if (!aufState.name && !aufState.nr && !aufState.adresse) aufState.alle = true;
        renderAufFilter();
        renderReportList();
      }));
      document.getElementById("aufCount").addEventListener("click", () => { aufState.asc = !aufState.asc; renderReportList(); });
    }
    function renderReportList() {
      const box = document.getElementById("reportList");
      const version = '<div class="app-version">Version ' + APP_VERSION + '</div>';
      renderAufFilter();
      const all = reports.slice();
      const list = all.filter(aufMatches);
      list.sort((a, b) => {
        const da = Date.parse(aufStart(a)) || 0, db = Date.parse(aufStart(b)) || 0;
        const d = aufState.asc ? da - db : db - da;
        return d || String((a.meta || {}).auftragsNr || "").localeCompare(String((b.meta || {}).auftragsNr || ""));
      });
      const n = list.length;
      document.getElementById("aufCount").textContent = (n === 1 ? "1 Eintrag gefunden" : n + " Einträge gefunden")
        + ", Sortiert nach Startdatum (" + (aufState.asc ? "A-Z" : "Z-A") + ")";
      if (!all.length) {
        box.innerHTML = '<div class="empty-list">Noch keine Aufträge. Tippen Sie auf „Neuer Auftrag“ oder holen Sie Aufträge über das Sync-Symbol oben rechts.</div>' + version;
        return;
      }
      if (!n) {
        box.innerHTML = '<div class="empty-list">Keine Aufträge für diese Suche.</div>' + version;
        return;
      }
      box.innerHTML = '<div class="auf-grid">' + list.map((r) => {
        const m = r.meta || {};
        const isCurrent = r.id === current.id;
        const nr = String(m.auftragsNr || "").trim() || "Ohne Nummer";
        const ortZeile = [m.plz, m.ort].filter(Boolean).join(" ");
        const start = fmtDateTimeDe(m.terminVon), ende = fmtDateTimeDe(m.terminBis);
        const zeit = (start || ende) ? ((start ? "Start: " + start : "") + (start && ende ? " · " : "") + (ende ? "Ende: " + ende : "")) : "";
        const lines = [
          ["auf-name", [m.anrede, m.kunde].filter((x) => String(x || "").trim()).join(" ") || "Ohne Kunde"],
          ["", ortZeile], ["", m.strasse], ["auf-art", aufArt(r)], ["auf-proj", aufProjekt(r)], ["auf-zeit", zeit]
        ].filter((l) => String(l[1] || "").trim());
        return `<div class="report-item auf-card${isCurrent ? " current" : ""}${r.status === "abgeschlossen" ? " done" : ""}" data-open="${r.id}"${isCurrent ? ' aria-current="true"' : ""}>
          <div class="meta">
            <div class="auf-nr"><strong>${escapeHtml(nr)}</strong>${r.neu ? '<span class="auf-new">NEW</span>' : ""}${aufStatusChips(r)}</div>
            ${lines.map((l) => `<div class="auf-line ${l[0]}">${escapeHtml(l[1])}</div>`).join("")}
          </div>
          <div class="report-actions">
            <button type="button" class="btn btn-icloud" data-icloud="${r.id}" title="In iCloud speichern">☁</button>
            <button class="btn danger" data-del="${r.id}" title="Auftrag löschen">Löschen</button>
          </div>
        </div>`;
      }).join("") + "</div>" + version;
    }

      return migrateAuftrag({ id: uid("r"), createdAt: nowIso(), updatedAt: nowIso(), meta, neu: true, serverNr: nr });
    }
    async function buildServerPayload(a) {
      const photos = [];
      const list = (a.photos || []).slice().sort((x, y) => (Number(x.sortiernummer) || 0) - (Number(y.sortiernummer) || 0));
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        let w = 0, h = 0;
        try { const rec = await idbGetPhoto(a.id, p.id); if (rec && rec.width) { w = rec.width; h = rec.height; } } catch (e) {}
        const anns = Array.isArray(p.annotations) ? p.annotations : [];
        photos.push({
          order: i + 1, id: p.id, name: p.name || "", comment: p.comment || "", druck: !!p.druck, annotated: !!p.annotated,
          annotationsRelative: (w && h) ? anns.map((s) => annotToRelative(s, w, h)) : []
        });
      }
      return {
        format: "leckortung-auftrag", formatVersion: 1, appVersion: APP_VERSION,
        auftragsNr: (a.meta && a.meta.auftragsNr) || a.serverNr || "",
        status: a.status === "abgeschlossen" ? "abgeschlossen" : "offen",
        abgeschlossenAm: a.abgeschlossenAm || null,
        meta: JSON.parse(JSON.stringify(a.meta || {})),
        values: JSON.parse(JSON.stringify(a.values || {})),
        mitarbeiter: JSON.parse(JSON.stringify(a.mitarbeiter || {})),
        photos
      };
    }
    async function postAuftrag(a) {
      const base = serverBase();
      const nr = (a.meta && a.meta.auftragsNr) || a.serverNr || a.id;
      const payload = await buildServerPayload(a);
      const res = await fetch(base + "/auftraege/" + encodeURIComponent(nr), {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
    }
    function markSent(id) {
      const t = (current.id === id) ? current : null;
      const e = reports.find((r) => r.id === id);
      [t, e].forEach((x) => { if (x) { x.sync = "gesendet"; x.syncedAt = nowIso(); } });
      if (t) persistCurrent();
      persistList();
    }
    function showSyncHint() {
      showChoiceDialog("Server noch nicht eingerichtet",
        "Sobald der Firmenserver bereit ist, tragen Sie unter „Einstellungen“ die Adresse ein. Dann holt dieser Knopf neue Aufträge und schickt abgeschlossene Aufträge zurück. Bis dahin bleibt alles lokal gespeichert.",
        [{ label: "Einstellungen", value: "set" }, { label: "OK", value: "ok", primary: true }]
      ).then((v) => { if (v === "set") showSettingsDialog(); });
    }
    async function syncNow() {
      if (syncBusy) return;
      const base = serverBase();
      if (!base) { showSyncHint(); return; }
      syncBusy = true; setSyncSpin(true);
      let neu = 0, gesendet = 0, fehler = 0;
      try {
        syncCurrentIntoList();
        try {
          const res = await fetch(base + "/auftraege", { headers: { Accept: "application/json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const arr = Array.isArray(data) ? data : (data && Array.isArray(data.auftraege) ? data.auftraege : []);
          arr.forEach((s) => {
            const a = auftragFromServer(s || {});
            if (!a) return;
            const nr = a.meta.auftragsNr;
            if (reports.some((r) => ((r.meta || {}).auftragsNr || r.serverNr) === nr)) return;
            reports.push(JSON.parse(JSON.stringify(a)));
            neu++;
          });
          persistList();
        } catch (e) { console.warn("sync get", e); fehler++; }
        for (const r of reports.filter((x) => x.status === "abgeschlossen" && x.sync === "wartet")) {
          try { await postAuftrag(r); markSent(r.id); gesendet++; } catch (e) { console.warn("sync post", e); fehler++; }
        }
        renderReportList();
        if (view === "report") renderMain();
        toast(fehler && !neu && !gesendet ? "Server nicht erreichbar – später erneut versuchen"
          : (neu + (neu === 1 ? " neuer Auftrag" : " neue Aufträge") + ", " + gesendet + " gesendet" + (fehler ? " (" + fehler + " Fehler)" : "")), !!fehler && !neu && !gesendet);
      } finally {
        syncBusy = false; setSyncSpin(false);
      }
    }

    function annotToRelative(s, w, h) {
      if (!s || !w || !h) return s ? JSON.parse(JSON.stringify(s)) : s;
      const nx = (v) => (typeof v === "number" ? v / w : v);
      const ny = (v) => (typeof v === "number" ? v / h : v);
      const out = Object.assign({}, s);
      if ("x" in out) out.x = nx(out.x);
      if ("y" in out) out.y = ny(out.y);
      if ("w" in out) out.w = nx(out.w);
      if ("h" in out) out.h = ny(out.h);
      if ("x1" in out) out.x1 = nx(out.x1);
      if ("y1" in out) out.y1 = ny(out.y1);
      if ("x2" in out) out.x2 = nx(out.x2);
      if ("y2" in out) out.y2 = ny(out.y2);
      if (Array.isArray(out.points)) {
        out.points = out.points.map((pt) => ({ x: nx(pt.x), y: ny(pt.y) }));
      }
      return out;
    }

    async function photoDimensions(p) {
      const rec = await idbGetPhoto(current.id, p.id);
      if (rec && rec.width && rec.height) {
        return { width: rec.width, height: rec.height, mime: rec.mime || "" };
      }
      const blob = rec && rec.blob;
      if (!blob) return { width: 0, height: 0, mime: "" };
      try {
        const url = URL.createObjectURL(blob);
        const dims = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = reject;
          img.src = url;
        });
        URL.revokeObjectURL(url);
        return { width: dims.width, height: dims.height, mime: rec.mime || blob.type || "" };
      } catch (e) {
        return { width: 0, height: 0, mime: "" };
      }
    }

    function wrapLines(str, widthMm, size, bold) {

        const words = para.split(" ");

        words.forEach((w) => {

          if (textWidthMm(cand, size, bold) <= widthMm) { line = cand; return; }
          if (line !== "") flush();
          if (textWidthMm(w, size, bold) <= widthMm) { line = w; return; }
          let piece = "";
          for (const ch of w) {
            if (textWidthMm(piece + ch, size, bold) > widthMm && piece) { out.push(piece); piece = ""; }

        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);

    /* ----- JPEG-Helfer: Fotos 1:1 als DCT in die PDF einbetten ----- */
    function jpegInfo(b) {
      if (!b || b.length < 4 || b[0] !== 0xFF || b[1] !== 0xD8) return null;
      let i = 2;
      while (i + 9 < b.length) {
        if (b[i] !== 0xFF) { i++; continue; }
        const mk = b[i + 1];
        if (mk === 0xFF) { i++; continue; }
        if (mk === 0xD8 || (mk >= 0xD0 && mk <= 0xD7) || mk === 0x01) { i += 2; continue; }
        const len = (b[i + 2] << 8) | b[i + 3];
        if (mk >= 0xC0 && mk <= 0xCF && mk !== 0xC4 && mk !== 0xC8 && mk !== 0xCC) {
          return { h: (b[i + 5] << 8) | b[i + 6], w: (b[i + 7] << 8) | b[i + 8], comps: b[i + 9] };
        }
        i += 2 + len;
      }
      return null;
    }
    function reencodeJpeg(blob) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          c.toBlob((b) => b ? resolve(b) : reject(new Error("encode")), "image/jpeg", 0.92);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("load")); };
        img.src = url;
      });
    }
    async function blobToJpegImg(blob) {
      let bytes = new Uint8Array(await blob.arrayBuffer());
      let info = jpegInfo(bytes);
      if (!info || (info.comps !== 3 && info.comps !== 1)) {
        bytes = new Uint8Array(await (await reencodeJpeg(blob)).arrayBuffer());
        info = jpegInfo(bytes);
      }
      if (!info) return null;
      return { bytes, w: info.w, h: info.h, comps: info.comps };
    }
    async function collectPhotoImages() {
      const out = [];
      for (const p of orderedPhotos().filter((x) => x.druck)) {
        let img = null;
        try {
          const rec = await idbGetPhoto(current.id, p.id);
          const b = displayBlob(rec);
          if (b) img = await blobToJpegImg(b);
        } catch (e) { console.warn("photo", e); }
        if (img) out.push({ p, img });
      }
      return out;
    }

    /* ----- Unterschriften (v31): pro Auftrag dauerhaft gespeichert, bis der Auftrag gelöscht wird -----
       Eigene IndexedDB "leckortung-signaturen" (Store "sigs", Schlüssel = Auftrags-id) – rein additiv,
       bestehende Daten (localStorage, Foto-DB) bleiben unberührt. Gespeichert werden die Striche als
       Vektor (normierte Koordinaten, 4 Nachkommastellen) – kleiner als ein PNG.
       Nie in einen anderen Auftrag übernommen: Laden/Speichern immer nur über current.id; keine Bibliothek,
       nicht im JSON-Export/Import, beim Import "als Kopie" (neue id) also leer. */
    const sigStore = { owner: null, ma: [], kunde: [], maAspect: SIG_PAD_ASPECT, kundeAspect: SIG_PAD_ASPECT };
    let sigTab = "ma";
    let sigLoadPromise = Promise.resolve();
    let sigDbPromise = null;
    function openSigDb() {
      if (sigDbPromise) return sigDbPromise;
      sigDbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open("leckortung-signaturen", 1);
        req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains("sigs")) db.createObjectStore("sigs", { keyPath: "auftragId" }); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return sigDbPromise;
    }
    async function sigDbOp(mode, fn) {
      const db = await openSigDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("sigs", mode);
        let out;
        const r = fn(tx.objectStore("sigs"));
        if (r) r.onsuccess = () => { out = r.result; };
        tx.oncomplete = () => resolve(out);
        tx.onerror = () => reject(tx.error);

    function sigLoadFor(id) {
      sigLoadPromise = sigDbOp("readonly", (st) => st.get(id)).then((rec) => {
        if (sigStore.owner !== id || !rec) return;
        let changed = false;
        ["ma", "kunde"].forEach((k) => {
          if (!sigStore[k].length && Array.isArray(rec[k]) && rec[k].length) { sigStore[k] = rec[k]; changed = true; }
          const ak = k + "Aspect";
          if (rec[ak] && rec[ak] > 0.05) sigStore[ak] = rec[ak];
          else if (!sigStore[ak]) sigStore[ak] = SIG_PAD_ASPECT;
        });
        if (changed && (view === "unterschrift" || view === "report" || view === "overview")) renderMain();

    let sigSaveTimer = null;

      const ma = sigRound(sigStore.ma), kunde = sigRound(sigStore.kunde);
      const rec = { auftragId: id, ma, kunde, maAspect: sigStore.maAspect || SIG_PAD_ASPECT, kundeAspect: sigStore.kundeAspect || SIG_PAD_ASPECT, updatedAt: nowIso() };
      const p = (ma.length || kunde.length)
        ? sigDbOp("readwrite", (st) => st.put(rec))
        : sigDbOp("readwrite", (st) => st.delete(id));
      return p.catch((e) => { console.warn("Unterschrift speichern", e); toast("Unterschrift konnte nicht gespeichert werden.", true); });
    }
